apiVersion: v1
kind: Secret
metadata:
  name: askdata-secret
  labels:
    app: askdata-server
type: Opaque
# 占位值，部署前请替换为真实密钥，或改用 Sealed Secrets / External Secrets / CSI 驱动。
# 也可不在此填写，改为集群级 Secret 注入。
stringData:
  ASKDATA_SECRET_KEY: "please-change-this-secret"
  ASKDATA_DB_PASSWORD: "change-me"
  ASKDATA_REDIS_PASSWORD: "change-me"
  MINIO_ACCESS_KEY: "minio"
  MINIO_SECRET_KEY: "change-me"
