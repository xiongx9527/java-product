version: "3.8"
# 本地集群形态联调：应用(cluster profile) + MySQL + Redis + MinIO
# 用法: docker compose up -d   (首次需 docker build 或已构建 askdata-server:latest)
services:
  mysql:
    image: mysql:8
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: askdata
      MYSQL_USER: ${MYSQL_USER:-askdata}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-askdata}
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123}"]
    ports:
      - "63790:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio123}
    ports:
      # 宿主 9000/9001 若被其它 MinIO 占用，可改这里（容器内仍 9000/9001）
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性服务：建 askdata bucket（应用只读 MINIO_BUCKET，不自建）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/askdata
      "
    restart: "no"

  # 向量库（可选）：启用语义召回 ANN 检索。ASKDATA_VECTOR_STORE_TYPE=qdrant 时生效。
  # 不启用向量库也可运行（askdata.vector-store.type=none 时向量存元数据库 JSON 列 + 应用内余弦）。
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "63330:6333"
      - "63331:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  askdata:
    image: askdata-server:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    ports:
      - "19528:19528"
    # 挂载本地 embedding 模型目录（约 793MB，不进镜像/仓库）；缺失时自动降级词法召回。
    volumes:
      - ./models:/opt/askdata/models
      # 数据源配置加密密钥环：必须持久化，否则容器重建后换密钥导致存量密文解不开
      - ./data/.secrets:/app/data/.secrets
    environment:
      SPRING_PROFILES_ACTIVE: cluster
      ASKDATA_SERVER_PORT: "19528"
      ASKDATA_SECRET_KEY: ${ASKDATA_SECRET_KEY:-please-change-this-secret}
      ASKDATA_DB_URL: jdbc:mysql://mysql:3306/askdata?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      ASKDATA_DB_USERNAME: ${MYSQL_USER:-askdata}
      ASKDATA_DB_PASSWORD: ${MYSQL_PASSWORD:-askdata}
      ASKDATA_REDIS_HOST: redis
      ASKDATA_REDIS_PORT: "6379"
      ASKDATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # Spring Boot 标准 Redis 绑定：框架部分组件读 spring.data.redis.*，
      # 显式设置确保容器内所有 RedisConnectionFactory 都指向 compose 的 redis 服务
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # 禁用框架动态 Redis 数据源（默认开启会另建一个连 localhost:6379 的 factory，
      # 导致 MCP SSE 监听器连错地址）；Redis 统一由应用 RedisClientConfig 提供
      FW_PLUS_REDIS_ENABLED: "false"
      # 兼容旧前缀 spring.redis.*（框架部分组件仍读此前缀）
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      ASKDATA_CACHE_TYPE: redis
      ASKDATA_SA_TOKEN_STORE: redis
      ASKDATA_CLUSTER_ENABLED: "true"
      FILE_STORAGE_PLATFORM: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio123}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: askdata
      # 报表生成图片的对外访问前缀（MCP/IM 客户端拿到完整 URL 才能取图）
      ASKDATA_CHART_IMAGE_BASE_URL: https://wa259rm4671.vicp.fun/api/chart/image
      # LLM / 远程 embedding 连接信息在「系统 -> AI 模型」界面配置（写入 sys_ai_model），不在此硬编码。
      ASKDATA_EMBEDDING_MODEL_PATH: /opt/askdata/models
      # 向量存储后端：qdrant（需上方 qdrant 服务）/ none（默认，DB JSON 列 + 应用内余弦）
      ASKDATA_VECTOR_STORE_TYPE: qdrant
      ASKDATA_QDRANT_URL: http://qdrant:6333
      ASKDATA_QDRANT_GRPC_PORT: "6334"
      ASKDATA_VECTOR_RECALL_THRESHOLD: "0.4"

volumes:
  mysql_data:
  minio_data:
  qdrant_data:
