server:
  port: 8000

# Actuator：对外暴露 /health（base-path 设为根，使外部探针 path=/health 命中；
# 默认挂载在 /actuator/health）。show-details 仅对鉴权用户可见，避免泄露内部组件状态。
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  # Elasticsearch 为可选外部依赖（未部署时不强制要求），不纳入 /health 聚合，
  # 避免本地未起 ES 时 /health 误报 DOWN（与 Redis/Milvus 可选化策略一致）。
  health:
    elasticsearch:
      enabled: false

spring:
  application:
    name: askdata-server
  # 排除 Spring Boot 自带的 Redis 自动配置：它在 spring-data-redis 位于 classpath 时会无条件创建
  # StringRedisTemplate，而框架 McpAutoConfiguration.RedisClusterConfiguration 以
  # @ConditionalOnBean(StringRedisTemplate) 为条件，会注册启动期即连接 Redis 的
  # mcpRedisMessageListenerContainer —— 导致未部署 Redis 时应用无法启动。
  # 改由 RedisClientConfig 在确实启用 Redis（askdata.cache.type=redis）时按需装配。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      # 同理：Sa-Token 的 Redis DAO 自动配置只要 spring-data-redis 在 classpath 就会装配并要求
      # RedisConnectionFactory bean；改由 RedisClientConfig 在启用 Redis 时自行创建。
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
  datasource:
    url: jdbc:h2:file:./data/askdata;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 元数据库版本化迁移（A9）：common 种子 + 当前方言 baseline。
  # {vendor} 由 Flyway 按 JDBC URL 解析为 h2 / postgresql / mysql。
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
    # 兼容 schema.sql 时代的旧库：已有表但没有 flyway_schema_history 时，
    # 以 V2 为基线（旧库已完成建表+种子），不会重复执行 V1/V2；空库仍完整执行 V1→V2。
    baseline-on-migrate: true
    baseline-version: "2"
  # 运行期不再执行 schema.sql（文件已删除由 Flyway 接管）
  sql:
    init:
      mode: never
  data:
    redis:
      # Redis 连接（askdata.cache.type=redis 或 sa-token-store=redis 时生效）；
      # 走 Spring Boot 标准配置，未配置时保持本地默认。
      host: ${ASKDATA_REDIS_HOST:127.0.0.1}
      port: ${ASKDATA_REDIS_PORT:6379}
      password: ${ASKDATA_REDIS_PASSWORD:}
      database: ${ASKDATA_REDIS_DATABASE:0}
      timeout: ${ASKDATA_REDIS_TIMEOUT:3s}
  servlet:
    multipart:
      # 数据源 Excel 上传上限（对齐前端 50MB 校验）
      max-file-size: 50MB
      max-request-size: 60MB

# 框架 UidGenerator 开关：启用后由 UIDAutoConfiguration 创建 UidGenerator（CachedUidGenerator），
# 底层 DisposableWorkerIdAssigner 写 WORKER_NODE 表分配 worker id（见 db/migration/h2/V1__baseline.sql）。
# epochStr 留空 → 框架默认取当日（CachedUidGenerator 默认 28 位时间戳，需贴近当前日期，
# 与旧雪花 epoch=0/1970 的 41/5/5/12 布局不同；生成的仍是全局唯一 long，对调用方透明）。
fw:
  plus:
    uid:
      enabled: true
# 数据源 Excel 上传文件目录（对齐 SQLBot settings.EXCEL_PATH）
askdata:
  # 集群模式（多实例）：开启后启动期执行就绪自检，逐项核对「任意实例处理任意请求」所需的
  # 共享化前提（共享元数据库 / 统一密钥 / Redis 会话与缓存 / 远端对象存储 / 唯一 workerId /
  # MCP 会话注册表）。缺省关闭，保持单实例零外部依赖启动。
  # 集群基线见 application-cluster.yaml（--spring.profiles.active=cluster）。
  cluster:
    enabled: ${ASKDATA_CLUSTER_ENABLED:false}
    # true：自检存在不满足项时拒绝启动；false：只输出 ERROR 级诊断后继续
    fail-fast: ${ASKDATA_CLUSTER_FAIL_FAST:false}
  excel:
    path: ./data/excel
  # CORS 允许来源（等价 SQLBot BACKEND_CORS_ORIGINS；逗号/分号分隔）。
  # 留空表示放开全部；助手应用的 domain 会在运行时动态加入（见 common/web/CorsConfig）。
  cors:
    origins: ""
  # 数据源连接池（对齐 SQLBot ConnectionPoolManager(max_pools=500)）：
  # 按数据源 id 缓存连接，LRU 淘汰（淘汰即关闭底层连接）。
  datasource:
    pool:
      max-pools: 500
  # 雪花 ID 位段（对齐 SQLBot common/utils/snowflake.py：41/5/5/12）：
  # worker-id 缺省按 PID 派生（同机多实例不撞号），datacenter-id 缺省 0，epoch 缺省 0。
  id:
    worker-id: -1
    datacenter-id: 0
    epoch: 0
  openapi:
    # OpenAPI 文档元数据（/doc.html 与 /v3/api-docs）。title/description 可按部署改名，
    # version 留空则取构建版本（askdata-build.properties，由 Maven 过滤生成），随构建自动更新。
    title: "${ASKDATA_OPENAPI_TITLE:askdata API}"
    version: "${ASKDATA_OPENAPI_VERSION:}"
    description: "${ASKDATA_OPENAPI_DESCRIPTION:}"
  cache:
    # 缓存后端类型：memory（Caffeine 进程内，缺省）/ redis（Redis）/ none（不缓存）。
    type: "${ASKDATA_CACHE_TYPE:memory}"
    # 内存后端：单缓存条目上限与存活秒数。
    max-size: ${ASKDATA_CACHE_MAX_SIZE:10000}
    ttl-seconds: ${ASKDATA_CACHE_TTL_SECONDS:300}
    # Sa-Token 会话存储：memory（缺省，进程内）/ redis；留空则跟随上面的 type。
    sa-token-store: "${ASKDATA_SA_TOKEN_STORE:}"
  debounce:
    # 接口防抖：在控制器方法上用 @Debounce 声明，窗口内同一维度只放行一次，重复请求返回 429。
    # 缺省关闭；维度由注解决定（接口 + 可选当前用户 + 可选接口参数 + 可选 SpEL）。
    # 后端复用缓存层（askdata.cache.type）：memory 单实例、redis 多实例全局。
    enabled: ${ASKDATA_DEBOUNCE_ENABLED:false}
    # 防抖窗口（毫秒）。
    window-ms: ${ASKDATA_DEBOUNCE_WINDOW_MS:1000}
  lock:
    # 单 worker 启动守卫的锁后端：db（缺省，元数据库表行锁，作用域=各元数据库）
    # / redis（全局 SET NX PX 锁，仅在「共享 Redis + 各实例独立库」部署下有意义）。
    type: "${ASKDATA_LOCK_TYPE:db}"
    # 防抖窗口（秒，缺省 300）：一次成功执行后，窗口内的后续启动不再重复执行同一任务
    # （防「应用反复重启 → 一次性启动任务被反复触发」）；0 表示不防抖。
    debounce-seconds: ${ASKDATA_LOCK_DEBOUNCE_SECONDS:300}
  # 本地 embedding 模型（D8/A6）：shibing624/text2vec-base-chinese（ONNX，768 维归一化）。
  # 模型权重随构建产物交付到 model-path（不进 git，793MB）；
  # 目录缺失或加载失败时向量召回降级为词法，问数主链路不报错。
  embedding:
    model-path: /opt/askdata/models
    # 启动期向量回填开关（关闭则不做回填；开启时由单 worker 守卫保证集群内只跑一次）。
    backfill-enabled: true
  # 向量存储后端（可插拔）：none（缺省，DB embedding JSON 列 + 应用内余弦）或 qdrant（在线向量库）。
  # 向量仍由上方 embedding 模型（远程 API / 本地 ONNX）产出；此处只决定向量的持久化与 ANN 检索后端。
  # type=qdrant 时四类对象（术语 / SQL 示例 / 表 / 数据源）的向量读写统一走在线库；
  # Qdrant 不可达时自动回落 DB 路径，问数主链路不报错。
  vector-store:
    type: none
    # 集合名前缀：集合名为 "{collection-prefix}-{object-type}"，object-type ∈
    # {terminology, data_training, core_table, core_datasource}。
    collection-prefix: askdata
    qdrant:
      # Qdrant REST 基址，如 http://qdrant:6333（https 前缀走 TLS）。仅用于健康检查。
      url: ${ASKDATA_QDRANT_URL:}
      # 可选 API Key（Qdrant 开启鉴权时必填；REST 与 gRPC 共用同一把钥匙）。
      api-key: ${ASKDATA_QDRANT_API_KEY:}
      # gRPC 端口：langchain4j/Qdrant Java 客户端走 gRPC，与 REST 端口相互独立，Qdrant 缺省 6334。
      grpc-port: ${ASKDATA_QDRANT_GRPC_PORT:6334}
    milvus:
      # Milvus gRPC 主机与端口（缺省 19530）。health-url 留空则乐观视为可用（失败由各读写回落）。
      host: ${ASKDATA_MILVUS_HOST:}
      port: ${ASKDATA_MILVUS_PORT:19530}
      # 是否走 TLS。
      tls: ${ASKDATA_MILVUS_TLS:false}
      # 鉴权 token（API Key 或 user:password），开启鉴权时必填。
      token: ${ASKDATA_MILVUS_TOKEN:}
      # 数据库名（缺省 default）。
      database: ${ASKDATA_MILVUS_DATABASE:default}
      # RESTful 健康检查基址（如 http://milvus:9091），用于启动期连通性探测；留空则不探测。
      health-url: ${ASKDATA_MILVUS_HEALTH_URL:}
      # 相似度度量 / 索引类型 / 一致性级别（缺省 COSINE / AUTO_INDEX / STRONG）。
      metric-type: ${ASKDATA_MILVUS_METRIC_TYPE:COSINE}
      index-type: ${ASKDATA_MILVUS_INDEX_TYPE:AUTO_INDEX}
      consistency-level: ${ASKDATA_MILVUS_CONSISTENCY:STRONG}
    weaviate:
      # Weaviate scheme/host/port（REST/gRPC 同进程，缺省 http / 8080）。
      scheme: ${ASKDATA_WEAVIATE_SCHEME:http}
      host: ${ASKDATA_WEAVIATE_HOST:}
      port: ${ASKDATA_WEAVIATE_PORT:8080}
      # 可选 API Key（开启鉴权时必填）。
      api-key: ${ASKDATA_WEAVIATE_API_KEY:}
      # 一致性级别（缺省 QUORUM）。
      consistency-level: ${ASKDATA_WEAVIATE_CONSISTENCY:QUORUM}
    pgvector:
      # Postgres 连接信息（需已安装 pgvector 扩展）。可复用问数元数据库或独立库。
      host: ${ASKDATA_PGVECTOR_HOST:}
      port: ${ASKDATA_PGVECTOR_PORT:5432}
      database: ${ASKDATA_PGVECTOR_DATABASE:}
      user: ${ASKDATA_PGVECTOR_USER:}
      password: ${ASKDATA_PGVECTOR_PASSWORD:}
      # 是否建 ivfflat 索引（缺省 false，避免建索引开销；大数据量可开启）。
      use-index: ${ASKDATA_PGVECTOR_USE_INDEX:false}
    elasticsearch:
      # Elasticsearch 基址（如 http://es:9200）。索引由应用按集合自动创建（vector 映射为 dense_vector）。
      server-url: ${ASKDATA_ELASTICSEARCH_URL:}
      # 可选鉴权：api-key（ES8+ ApiKey）或 username/password（Basic），二者择一，api-key 优先。
      api-key: ${ASKDATA_ELASTICSEARCH_API_KEY:}
      username: ${ASKDATA_ELASTICSEARCH_USERNAME:}
      password: ${ASKDATA_ELASTICSEARCH_PASSWORD:}
      # 写入可见性：WaitFor（写后即查，缺省）/ True / False。
      refresh: ${ASKDATA_ELASTICSEARCH_REFRESH:WaitFor}
    redis:
      # Redis 向量库连接（需 Redis Stack：RediSearch 向量字段 + RedisJSON；社区版 Redis 不支持向量检索）。
      host: ${ASKDATA_VECTOR_REDIS_HOST:}
      port: ${ASKDATA_VECTOR_REDIS_PORT:6379}
      username: ${ASKDATA_VECTOR_REDIS_USERNAME:}
      password: ${ASKDATA_VECTOR_REDIS_PASSWORD:}
      # 是否走 TLS。
      ssl: ${ASKDATA_VECTOR_REDIS_SSL:false}
      # 库序号。
      database: ${ASKDATA_VECTOR_REDIS_DATABASE:0}
  # 应用密钥（落库加密用）。不内置缺省值：必须通过环境变量 ASKDATA_SECRET_KEY 或外部配置显式设定，
  # 否则启动期随机生成（当次进程内可用，重启后历史密文不可解，并在启动日志告警）。
  secret:
    key: ${ASKDATA_SECRET_KEY:}
  # 定时问数任务（A10）：调度轮询间隔、默认导出目录、webhook 推送超时。
  scheduled:
    enabled: ${ASKDATA_SCHEDULED_ENABLED:true}
    poll-interval-ms: 30000
    export-dir: ./data/exports
    # 任务执行权租约（秒）：抢占时写入到期时间，执行期间按 1/3 租约续租；
    # 进程被强杀后 running 残留，到期即可被其它实例回收（集群必需）
    lease-seconds: ${ASKDATA_SCHEDULED_LEASE_SECONDS:300}
    push-timeout-seconds: 10

  # A27：向量召回阈值（术语 / SQL 示例 / 表级召回共用）。
  # 对齐 SQLBot EMBEDDING_TERMINOLOGY_SIMILARITY=0.4；调高更严格、调低更宽松，缺省 0.4。
  vector:
    recall-threshold: ${ASKDATA_VECTOR_RECALL_THRESHOLD:0.4}
  # A27：提示词样例行开关（对齐 SQLBot SAMPLE_DATA_ENABLED=True）。
  # 关闭后 schema 提示词只含表/字段结构，不再读取样例行（大库/敏感数据场景）。
  prompt:
    sample-data-enabled: ${ASKDATA_SAMPLE_DATA_ENABLED:true}
  # A27：SQL 只读校验的元数据查询开关（对齐 SQLBot ALLOW_METADATA_QUERIES=False）。
  # 缺省拒绝 information_schema / pg_catalog / performance_schema / mysql.* / sys.* 查询。
  sql:
    allow-metadata-queries: ${ASKDATA_ALLOW_METADATA_QUERIES:false}
  # A27：服务端出图（A5）图片 URL 基址、token 有效期与持久化目录。
  # image-ttl-ms 缺省 86400000（24h）；过期图片与 token 由定时清理任务删除（清理间隔可配）。
  chart:
    image-base-url: ${ASKDATA_CHART_IMAGE_BASE_URL:/api/chart/image}
    image-ttl-ms: ${ASKDATA_CHART_IMAGE_TTL_MS:86400000}
    cleanup-interval-ms: ${ASKDATA_CHART_CLEANUP_INTERVAL_MS:3600000}
    # token→文件映射的持久化目录；留空则使用默认运行目录（进程重启后仍可打开）。
    token-store-dir: ${ASKDATA_CHART_TOKEN_STORE_DIR:}
  # A27：许可证门控（A3）。enforcement=bypass（缺省）时企业能力始终可用；
  # enforce 时按许可证校验；sign-key 用于 HMAC 签名校验，留空则不校验签名。
  license:
    enforcement: ${ASKDATA_LICENSE_ENFORCEMENT:bypass}
    sign-key: ${ASKDATA_LICENSE_SIGN_KEY:}
    max-count: ${ASKDATA_LICENSE_MAX_COUNT:1000000}
  # A27：嵌入签名（A11）。aes-key 为 SQLBot AES 信封密钥，留空时嵌入 token 校验不可用；
  # legacy-hmac-enabled=true 时才接受旧 id.timestamp.hmac 签名，缺省关闭。
  embedded:
    aes-key: ${ASKDATA_EMBEDDED_AES_KEY:}
    legacy-hmac-enabled: ${ASKDATA_EMBEDDED_LEGACY_HMAC_ENABLED:false}


# MCP server：复用 fw-plus 封装（fw-plus-ai-mcp-server-spring-boot-starter），取代手写 JSON-RPC。
# 前缀固定为 fw-plus.ai.mcp.*；缺省即开；传输 http-sse（GET /mcp/sse 建流 + POST /mcp/messages/{uuid}）。
# 鉴权 sa-token-login：复用现有 Sa-Token 登录会话（token 头 X-SQLBOT-TOKEN，见上方 sa-token 配置）。
fw-plus:
  ai:
    mcp:
      enabled: true
      transport: http-sse
      endpoint: /mcp
      auth:
        provider: sa-token-login

# 鉴权（D10）：Sa-Token。token 从请求头 X-SQLBOT-TOKEN: Bearer <token> 读取，
# 与 SQLBot 前端 request.ts 的请求拦截器逐字兼容。
sa-token:
  token-name: X-SQLBOT-TOKEN
  token-prefix: Bearer
  # 仅走 Header 携带 token（与前端一致，不使用 Cookie）
  is-read-header: true
  is-read-cookie: false
  # A24：访问 token 默认 8 天（SQLBot ACCESS_TOKEN_EXPIRE_MINUTES = 60*24*8），
  # 单位秒，可通过 ASKDATA_TOKEN_TIMEOUT 调整；过期后前端按 401 重新登录。
  timeout: ${ASKDATA_TOKEN_TIMEOUT:691200}
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-print: false
  is-log: false

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    # A15：x-file-storage 自动装配的默认 no-op recorder 会被 @EnableFileStorage 提前注册，
    # 即使 askdata 已用 @Primary 落库实现接管注入，它仍会打一条误导性 WARN
    # 「没有找到 FileRecorder 的实现类」。该实现对业务无作用，这里关闭其 WARN。
    org.dromara.x.file.storage.spring.FileStorageAutoConfiguration: ERROR
    # A15：fw-plus 的 WebMvcCommonFilter 对任何非 2xx 都打 WARN，导致外部探测（/v1/models）
    # 与浏览器缺省请求（/favicon.ico）周期性刷屏。业务错误的可读信息由 ApiExceptionHandler
    # 落日志，这里只保留 ERROR 及以上，避免噪声淹没真实告警。
    com.xiongx9527.fw.plus.boot.autoconfigure.web.webmvc.filter.WebMvcCommonFilter: ERROR

# 通用文件存储 x-file-storage（对齐 SQLBot 文件存储）。默认本地平台（离线可用）；
# 生产可改为 aliyun-oss / minio / tencent-cos 等远端平台（平台清单见 x-file-storage 文档），并同步切换 default-platform。
# 平台切换：设置 FILE_STORAGE_PLATFORM=local|minio|aliyun-oss|tencent-cos（默认 local）。
# 选中平台缺少必填配置时，启动阶段记录 WARN 并回退 local（见 StoragePlatformGuard），不影响启动。
dromara:
  x-file-storage:
    default-platform: ${FILE_STORAGE_PLATFORM:local}
    local:
      - platform: local
        enable-storage: true
        base-path: ./data/files
        # domain 留空：文件经 /api/file/download 或各自业务端点访问，不直接暴露静态域名
        domain: ""
    # MinIO（S3 兼容）：FILE_STORAGE_PLATFORM=minio 时启用
    minio:
      - platform: minio
        enable-storage: ${MINIO_ENABLE:true}
        access-key: ${MINIO_ACCESS_KEY:}
        secret-key: ${MINIO_SECRET_KEY:}
        end-point: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
        bucket-name: ${MINIO_BUCKET:askdata}
        # 对外访问域名（可留空；留空时使用预签名 URL）
        domain: ${MINIO_DOMAIN:}
    # 阿里云 OSS：FILE_STORAGE_PLATFORM=aliyun-oss 时启用
    aliyun-oss:
      - platform: aliyun-oss
        enable-storage: ${ALIYUN_OSS_ENABLE:true}
        access-key: ${ALIYUN_OSS_ACCESS_KEY_ID:}
        secret-key: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
        end-point: ${ALIYUN_OSS_ENDPOINT:}
        bucket-name: ${ALIYUN_OSS_BUCKET:}
        domain: ${ALIYUN_OSS_DOMAIN:}
    # 通用 S3 兼容存储（AWS S3 / Ceph RGW / 其它 S3 网关）：FILE_STORAGE_PLATFORM=amazon-s3 时启用
    amazon-s3:
      - platform: amazon-s3
        enable-storage: ${AMAZON_S3_ENABLE:true}
        access-key: ${AMAZON_S3_ACCESS_KEY_ID:}
        secret-key: ${AMAZON_S3_SECRET_ACCESS_KEY:}
        region: ${AMAZON_S3_REGION:us-east-1}
        end-point: ${AMAZON_S3_ENDPOINT:}
        bucket-name: ${AMAZON_S3_BUCKET:}
        domain: ${AMAZON_S3_DOMAIN:}
    # 腾讯云 COS：FILE_STORAGE_PLATFORM=tencent-cos 时启用
    tencent-cos:
      - platform: tencent-cos
        enable-storage: ${TENCENT_COS_ENABLE:true}
        secret-id: ${TENCENT_COS_SECRET_ID:}
        secret-key: ${TENCENT_COS_SECRET_KEY:}
        region: ${TENCENT_COS_REGION:}
        bucket-name: ${TENCENT_COS_BUCKET:}
        domain: ${TENCENT_COS_DOMAIN:}

# API 文档（Knife4j UI + OpenAPI 3，对齐 SQLBot /docs + /openapi.json 的对外能力）：
#   UI:  /doc.html     Knife4j 页面（knife4j-openapi3-ui 静态资源，免登录）
#   规范: /v3/api-docs  OpenAPI 3 JSON（springdoc 生成，可供第三方/前端 API KEY 页引用）
# 两者都在 AuthWhitelist.API_DOCS_PATHS 放行；Swagger 原生 UI 保留在 /swagger-ui/index.html。
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
