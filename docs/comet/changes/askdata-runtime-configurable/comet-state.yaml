acceptance:
  - id: A1
    source: brief.md
    text: "A1: askdata.cache.type=memory 时热点数据（用户信息 / API Key 信息 / 助手信息）走 Caffeine
      进程内缓存，鉴权热路径不再每次查库；type=redis 时走 Redis 且多实例共享；type=none 时不缓存。"
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: "A2: 用户改密 / 停用 / 删除 / 切工作空间、API Key 停用或删除、助手配置或密钥变更后，对应缓存立即失效（失效挂在
      Repository 写方法上），不会出现「已停用仍可鉴权」。"
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "A3: 未启用 Redis 时应用无需部署 Redis 也能启动（框架的 MCP Redis 集群模式不会因 spring-data-redis
      位于 classpath 而被激活并急切连接 Redis）。"
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "A4: askdata.cache.sa-token-store=redis 时登录态存 Redis、多实例共享；缺省为进程内。"
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "A5: 单 worker 启动守卫的锁后端可配置（db / redis），并支持防抖窗口：一次成功执行后，窗口内的后续启动不再重复执行同一任务。"
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "A6: 开启 askdata.debounce.enabled 后，同一「调用方 + 接口」在窗口内的重复请求返回 429 且带
      Retry-After；缺省关闭时既有行为不变。"
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: "A7: OpenAPI 文档的标题 / 版本 / 说明可配置，版本缺省取构建版本，文档中的 token 头名与
      sa-token.token-name 一致。"
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: "A8: 新增向量后端（milvus / weaviate / pgvector / elasticsearch / redis）只需实现
      VectorStore 并在 VectorStoreAutoConfiguration 登记，不改动 EmbeddingService
      与召回调用点。"
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: "A9: 全量回归通过（681 passed / 0 failed / 0 errors / 5 skipped），既有测试的断言语义无需修改。"
    result: pending
    reason: null
