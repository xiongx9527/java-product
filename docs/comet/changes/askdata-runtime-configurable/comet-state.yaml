  iteration: 1
  summary:
    text: 向量后端扩展（milvus/weaviate/pgvector/elasticsearch/redis）与运行时可配置化全部落地：缓存后端
      memory/redis/none 可配、热点数据缓存与失效覆盖全部变更路径、Sa-Token 会话存储可选 Redis、OpenAPI
      元数据可配置且 token 头取 sa-token 配置、启动守卫锁后端可配且带防抖、接口防抖 429；Redis 做成真正可选（未启用时无
      Redis bean，框架 MCP Redis 集群模式不激活，应用可无 Redis 启动）。
    truncated: false
