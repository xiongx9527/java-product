=redis → RedisCacheManager；type=none → NoOpCacheManager","config/CacheProperties.java：type / max-size / ttl-seconds / sa-token-store 归一化（resolveType / resolveSaTokenStore）","common/cache/HotCacheService.java：userById / userByAccount / apiKeyByAccessKey / assistantById 四个 @Cacheable 热点读","common/web/ApiKeyTokenAuthenticator.java、EmbeddedTokenAuthenticator.java：鉴权热路径改走热点缓存","src/test/.../config/ConfigurableRuntimeOptionsTest.java：缓存后端与 Sa-Token 存储归一化断言"],"id":"A1","note":"memory 为进程内（Caffeine），redis 多实例共享，none 不缓存；热点目标与 SQLBot 审计 F-10 的 user:info / ask:info / assistant:info 对齐。","status":"implemented-with-evidence"},{"evidence":["system/repository/UserRepository.java：insert / updateProfile / updateOid / updateStatus / updateLanguage / updatePassword / deleteById 七个写方法均挂 @Caching evict（USER_INFO 按 id + USER_INFO_BY_ACCOUNT 全量）","system/repository/ApiKeyRepository.java：insert / updateStatus / delete 挂 @CacheEvict(API_KEY_INFO, allEntries=true)","embedded/AssistantRepository.java：update / updateConfiguration / updateAppSecret / delete / deleteByIds / insert 挂 @CacheEvict(ASSISTANT_INFO)","变更路径覆盖：改密、停用/启用、删用户、切工作空间（updateOid）、apikey 停用/删除、助手配置与 app_secret 变更"],"id":"A2","note":"失效声明统一挂在 Repository 写方法上，故所有服务层调用点自动覆盖，不依赖逐个调用点显式 evict。","status":"implemented-with-evidence"},{"evidence":["resources/application.yaml：spring.autoconfigure.exclude 排除 RedisAutoConfiguration 与 cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate","config/RedisClientConfig.java：@ConditionalOnExpression 仅在 askdata.cache.type=redis / sa-token-store=redis / lock.type=redis 时装配连接工厂与模板","框架 fw-plus-ai-boot-autoconfigure 的 McpAutoConfiguration$RedisClusterConfiguration 以 @ConditionalOnBean(StringRedisTemplate) 为条件；无 Redis bean 即不激活，其 mcpRedisMessageListenerContainer 不会在启动期连接 Redis","全量回归中 681 个用例（含多个 @SpringBootTest 全上下文加载）均在本机无 Redis 的环境下启动通过"],"id":"A3","note":"已实测：仅引入 spring-boot-starter-data-redis 会导致应用启动失败（RedisConnectionException），改为按需装配后恢复正常。","status":"implemented-with-evidence"},{"evidence":["config/SaTokenStoreInitializer.java：sa-token-store=redis 时取 SaTokenDaoForRedisTemplate 并显式 SaManager.setSaTokenDao(dao)（Sa-Token 1.46 不会自动注册给 SaManager）","config/RedisClientConfig.java：创建 SaTokenDaoForRedisTemplate 并 init(RedisConnectionFactory)","缺省 memory：不改 SaManager，Sa-Token 惰性使用进程内 SaTokenDaoDefaultImpl"],"id":"A4","note":"sa-token-store 留空时跟随 askdata.cache.type。","status":"implemented-with-evidence"},{"evidence":["common/lock/WorkerLock.java：锁后端抽象（tryAcquire / release / name）","common/lock/DbWorkerLock.java：元数据库表行独占锁（原 SingleWorkerGuard 逻辑平移，行为不变）","common/lock/RedisWorkerLock.java：SET NX PX + 持有者 token 校验释放（Lua）","common/lock/WorkerLockConfig.java：按 askdata.lock.type 选择（db 缺省 / redis），@ConditionalOnProperty 互斥装配","common/lock/SingleWorkerGuard.java：委托 WorkerLock，锁不可用退化为进程内守卫","防抖：askdata.lock.debounce-seconds（默认 300）；DB 侧复用 acquired_at（与持锁同事务刷新、释放提交后生效），Redis 侧用 done 标记","src/test/.../common/lock/SingleWorkerGuardLockTest.java：防抖窗口内跳过、窗口关闭后可再获取、锁不可用退化为进程内守卫"],"id":"A5","note":"db 锁作用域与被保护数据一致（共享同一元库时集群内一次；各实例独立库时各跑各的），redis 锁为全局。","status":"implemented-with-evidence"},{"evidence":["common/debounce/DebounceProperties.java：enabled（默认关闭）/ window-ms / paths（Ant 风格匹配）","common/debounce/RequestDebouncer.java：用 Spring Cache 的 putIfAbsent 原子占位（内存与 Redis 后端都原子且沿用该缓存 TTL），缓存异常时放行","common/web/RequestDebounceFilter.java：@Order(HIGHEST_PRECEDENCE + 20) 排在鉴权之后；调用方按鉴权头摘要识别（无则来源 IP，摘要不落原文）；窗口内重复请求返回 429 + Retry-After","resources/messages*.properties（6 语种）：i18n_debounce.too_frequent 走消息包，不硬编码","src/test/.../common/debounce/RequestDebouncerTest.java：默认放行 / 同 key 窗口内拦截 / 缓存异常放行 / 路径匹配"],"id":"A6","note":"防抖缓存 TTL 独立设为防抖窗口（与业务缓存默认 TTL 不同）。","status":"implemented-with-evidence"},{"evidence":["config/OpenApiProperties.java：askdata.openapi.{title,version,description}，version 缺省取构建版本","config/OpenApiConfig.java：标题/版本/说明取自配置；token 头改取 sa-token.token-name（原先硬编码 X-SQLBOT-TOKEN），说明中的 {tokenHeader} 占位替换为实际值","resources/askdata-build.properties：Maven 资源过滤注入 project.version（仅此文件参与过滤，application.