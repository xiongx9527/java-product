acceptance:
  - id: A18
    source: brief.md
    text: A18 数据源类型细节：Hive 支持 LDAP 认证参数；SQL Server `lowVersion` 配置影响 URL/驱动参数；ES
      表/字段同步保留 `_meta.description` 注释；MySQL `allowPublicKeyRetrieval`
      仅在配置开启时追加；Oracle 可按配置启用 thick 模式；连接池按配置 recycle；`MAX_TABLES=10`。
    result: passed
    reason:
      text: MySQL allowPublicKeyRetrieval 仅显式开启时追加；SQL Server lowVersion 追加旧版兼容参数；Hive
        有口令时拼 auth=LDAP/user；Oracle 支持 oci thick URL；PoolSettings 增加 recycleMs
        并在借出时回收超龄空闲连接；SchemaContextBuilder MAX_TABLES=10；ES 同步读取
        _meta.description 作注释。
      truncated: false
  - id: A19
    source: brief.md
    text: A19 Excel 导出与类型推断：Excel 导出数字列写为数值单元格而非文本，可求和；类型推断不再只采样 100 行且保留 float
      语义；结果列名按大小写不敏感归一；上述行为有导出/导入回归测试。
    result: passed
    reason:
      text: ChatExcel 数字/布尔写为原生单元格，列名大小写不敏感归一且重复列名追加序号；ExcelService 类型推断全量扫描并保留
        float；ExcelServiceTest/ChatExcelTest/ChatExportParityTest 覆盖。
      truncated: false
  - id: A20
    source: brief.md
    text: A20 表级向量召回：表级向量召回在远程 embedding 不可用时回退到本地 embedding（与 EmbeddingService
      相同的本地模型路径），仍不可用才退化为词法；命中远程时优先远程向量。
    result: passed
    reason:
      text: TableEmbeddingService 注入 EmbeddingService，embed
        先远程、失败回退同一本地模型、再不可用才词法并记录降级原因；rankTables 三路径统一返回 List<Long>。
      truncated: false
  - id: A8
    source: brief.md
    text: A8 Excel 数据源与多 sheet：PostgreSQL/MySQL 元数据库下 Excel 数据源字段同步使用固定默认
      schema（不再用空 `db_schema`），`core_field` 有完整列；多 sheet Excel 每个 sheet
      的表头只出现一次，第 2..N 个 sheet 的数据行不被当成表头。
    result: passed
    reason:
      text: JdbcEngine.metadataConf 对应用库类型补固定默认 schema（defaultAppSchema 按方言），Excel
        字段/表同步使用该配置；ExcelService 按 sheet 独立读取表头，ExcelServiceTest 覆盖多 sheet
        表头只一次与列序/类型一致。
      truncated: false
