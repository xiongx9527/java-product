liations":[],"ref":"native-archive-finalize","requiredCapabilities":[],"retry":"manual","runId":"askdata-cluster-readiness-r2","status":"succeeded","stepId":"archive.finalize","type":"call_tool"}],"actionContexts":{"askdata-cluster-readiness-r2:1":{"results":{},"sequence":1},"askdata-cluster-readiness-r2:10":{"results":{},"sequence":10},"askdata-cluster-readiness-r2:11":{"results":{},"sequence":11},"askdata-cluster-readiness-r2:12":{"results":{},"sequence":12},"askdata-cluster-readiness-r2:13":{"results":{},"sequence":13},"askdata-cluster-readiness-r2:14":{"results":{},"sequence":14},"askdata-cluster-readiness-r2:15":{"results":{},"sequence":15},"askdata-cluster-readiness-r2:16":{"results":{},"sequence":16},"askdata-cluster-readiness-r2:17":{"results":{},"sequence":17},"askdata-cluster-readiness-r2:18":{"results":{},"sequence":18},"askdata-cluster-readiness-r2:19":{"results":{},"sequence":19},"askdata-cluster-readiness-r2:21":{"results":{},"sequence":21},"askdata-cluster-readiness-r2:22":{"results":{},"sequence":22},"askdata-cluster-readiness-r2:23":{"results":{},"sequence":23},"askdata-cluster-readiness-r2:24":{"results":{},"sequence":24},"askdata-cluster-readiness-r2:3":{"results":{},"sequence":3},"askdata-cluster-readiness-r2:4":{"results":{},"sequence":4},"askdata-cluster-readiness-r2:5":{"results":{},"sequence":5},"askdata-cluster-readiness-r2:6":{"results":{},"sequence":6},"askdata-cluster-readiness-r2:7":{"results":{},"sequence":7},"askdata-cluster-readiness-r2:9":{"results":{},"sequence":9}},"waits":[{"id":"askdata-cluster-readiness-r2:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"askdata-cluster-readiness-r2"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 集群自检：设置 `askdata.cluster.enabled=true` 且元数据库仍是 H2 文件库 / `ASKDATA_SECRET_KEY` 为空 / 会话仍是 memory 时，启动日志给出逐项可读诊断与修复建议；`askdata.cluster.fail-fast=true` 时拒绝启动并指出第一处不满足项。"},{"id":"A2","source":"brief.md","text":"A2 集群自检通过：元数据库为 MySQL/PostgreSQL、Redis 可用、对象存储可用、密钥已配置时，自检全部通过并在启动日志打印汇总（无告警、无 fail-fast）。"},{"id":"A3","source":"brief.md","text":"A3 通用文件跨实例：实例 A 上传助手 logo，实例 B 通过 `/api/file/download` 取回字节完全一致；替换 logo 后旧文件在 B 上返回 404。"},{"id":"A4","source":"brief.md","text":"A4 Excel 跨实例：实例 A 调 `/datasource/parseExcel` 上传，实例 B 用返回的 `filePath` 调 `/datasource/importToDb` 成功建表；单实例旧行为（返回本地文件名）仍可解析。"},{"id":"A5","source":"brief.md","text":"A5 术语/训练/设置文件跨实例：在 A 触发术语导入与错误行导出，B 能读取/下载同一文件；设置 logo 上传后 B 可取回。"},{"id":"A6","source":"brief.md","text":"A6 定时任务导出跨实例：任务在 A 执行并导出，运行记录中的 `export_path` 在 B 上可下载且行数与查询结果一致。"},{"id":"A7","source":"brief.md","text":"A7 图表图片跨实例：A 生成图表图片并返回 token，B 用同一 token 访问 `/api/chart/image` 返回同一张 PNG；token 过期后返回 404。"},{"id":"A8","source":"brief.md","text":"A8 图表清理单实例：两个实例同时运行清理任务，只产生一次清理动作（单实例守卫生效），不出现互相删除仍在有效期的文件。"},{"id":"A9","source":"brief.md","text":"A9 定时任务租约回收：任务在 A 执行期间 A 被强杀（`running` 残留），租约到期后 B 的轮询能回收该任务并重新执行，最终产生成功运行记录。"},{"id":"A10","source":"brief.md","text":"A10 会话与缓存跨实例：在 A 登录，B 携带同一 token 访问返回 200；在 A 禁用用户后，B 立即（不等待 TTL）拒绝该用户请求。"},{"id":"A11","source":"brief.md","text":"A11 防抖跨实例：同一用户对同一接口在两个实例上并发重复提交，只有一次被执行，另一次返回防抖错误。"},{"id":"A12","source":"brief.md","text":"A12 雪花 ID 唯一：两实例各生成 1 万个 ID，全量去重后数量为 2 万，无重复；`fw.plus.uid.enabled=false` 且未配置 `askdata.id.worker-id` 时自检给出撞号告警。"},{"id":"A13","source":"brief.md","text":"A13 MCP SSE 跨实例可用：集群模式启用 Redis 后，MCP 自动启用框架内置的 Redis 集群注册表（`RedisServerSseRegistry` + `McpRedisBroadcaster` pub/sub）；实例 A 建立 `/mcp/sse` 流、`POST /mcp/messages` 落到实例 B 时，仍能完成 initialize 与 tools/call，无需粘性会话。集群模式但未启用 Redis（容器内无 `StringRedisTemplate`）时，启动自检告警说明当前为进程内会话、需粘性会话或启用 Redis。"},{"id":"A14","source":"brief.md","text":"A14 单实例零回归：不设置集群开关时，H2 + 本地文件 + 内存会话仍可完整启动并通过既有全量测试。"},{"id":"A15","source":"brief.md","text":"A15 部署基线可运行：`docker-compose.cluster.yml` 起 MySQL + Redis + MinIO + 两实例，`probe-cluster.mjs` 在负载均衡下全部通过。"}],"children":null,"formalHash":"c83cd11fae0e46a94ccda5153e8dec09490c65823170e246432ad30f3174fddf","semanticSnapshot":{"