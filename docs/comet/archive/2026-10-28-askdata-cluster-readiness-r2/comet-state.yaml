f.md","text":"A8 图表清理单实例：两个实例同时运行清理任务，只产生一次清理动作（单实例守卫生效），不出现互相删除仍在有效期的文件。"},{"id":"A9","source":"brief.md","text":"A9 定时任务租约回收：任务在 A 执行期间 A 被强杀（`running` 残留），租约到期后 B 的轮询能回收该任务并重新执行，最终产生成功运行记录。"},{"id":"A10","source":"brief.md","text":"A10 会话与缓存跨实例：在 A 登录，B 携带同一 token 访问返回 200；在 A 禁用用户后，B 立即（不等待 TTL）拒绝该用户请求。"},{"id":"A11","source":"brief.md","text":"A11 防抖跨实例：同一用户对同一接口在两个实例上并发重复提交，只有一次被执行，另一次返回防抖错误。"},{"id":"A12","source":"brief.md","text":"A12 雪花 ID 唯一：两实例各生成 1 万个 ID，全量去重后数量为 2 万，无重复；`fw.plus.uid.enabled=false` 且未配置 `askdata.id.worker-id` 时自检给出撞号告警。"},{"id":"A13","source":"brief.md","text":"A13 MCP SSE 跨实例可用：集群模式启用 Redis 后，MCP 自动启用框架内置的 Redis 集群注册表（`RedisServerSseRegistry` + `McpRedisBroadcaster` pub/sub）；实例 A 建立 `/mcp/sse` 流、`POST /mcp/messages` 落到实例 B 时，仍能完成 initialize 与 tools/call，无需粘性会话。集群模式但未启用 Redis（容器内无 `StringRedisTemplate`）时，启动自检告警说明当前为进程内会话、需粘性会话或启用 Redis。"},{"id":"A14","source":"brief.md","text":"A14 单实例零回归：不设置集群开关时，H2 + 本地文件 + 内存会话仍可完整启动并通过既有全量测试。"},{"id":"A15","source":"brief.md","text":"A15 部署基线可运行：`docker-compose.cluster.yml` 起 MySQL + Redis + MinIO + 两实例，`probe-cluster.mjs` 在负载均衡下全部通过。"}],"children":null,"formalHash":"c83cd11fae0e46a94ccda5153e8dec09490c65823170e246432ad30f3174fddf","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"3f594a6b552978fa78807a674a935dc2b9c14a1b994438a6f577cb23286fe61f","contractHash":"50dfe8b07721ca14fa96041f094ce20130e38fead7cff6d353178f6eb896a313","inputHash":"4f6665d890fec762f77051478c4dbe76e28fc818977194df3c4f41dd3edcc41b","legacyFingerprint":"024611c6e539b399261ac2524adf5a78c2c1b540c72bf08c77cedbdc15c3a1a7","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"a5e84007c4b9e87a8cd9a93b4a33c801c3d543b7cb3f13a2f205a385965b80c3","contractHash":"819a0d4b7d898066a4332de27edf1f2e5d6e44c99bd11e382836113af3ed8530","inputHash":"98ec94d3ad1762067aab54718af