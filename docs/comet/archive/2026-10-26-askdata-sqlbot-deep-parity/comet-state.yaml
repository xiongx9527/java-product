及平台所需字段），不再硬编码 {client_id:null, enable:false}。"},{"id":"A31","source":"brief.md","text":"A31 企业 IM 扫码登录：钉钉、Lark、LarkSuite、企业微信四类扫码登录全流程可完成（取客户端信息 → 第三方 SDK 扫码 → 回调 → sso/{type} 建立会话并跳回系统）；平台未配置或已禁用时返回可读错误。"},{"id":"A32","source":"brief.md","text":"A32 平台用户同步：用户页平台同步按钮可用；POST /system/platform/user/sync 幂等同步并返回 total/created/updated/skipped。"},{"id":"A33","source":"brief.md","text":"A33 平台组织端点：/system/platform/org/{id} 可正常响应前端 api/system.ts 的 platform() 调用，不再是死链。"},{"id":"A34","source":"brief.md","text":"A34 SSO 协议登录链路：OIDC、OAuth2、CAS、SAML2 的 login/{type} 跳转 URL 与 sso/{type} 回调登录链路可用，配置缺失时给出明确错误。"},{"id":"A35","source":"brief.md","text":"A35 企业登录参数：/system/parameter/login 分组中企业登录相关配置可读可写，并实际影响登录页展示的登录方式。"}],"children":null,"formalHash":"21285f47b7627bd5110b9871e0bb27f5d0d5714083e9594d171457055642126c","shapeConfirmationHash":"5568d23f167f491cbe99a9e828f6e1f964c4491152ea7695a46f84b1012cd8ba","specChanges":[{"capability":"askdata-sqlbot-deep-parity","operation":"create","source":"specs/askdata-sqlbot-deep-parity/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"abb185ce0a862f472a0d05a5701e50acb7b9ffb7d410315f21806566b43f95ea","outcomeId":"3802bdb4-9997-4935-b5f7-0cbd457a54d0"}],"reconciliations":[],"ref":"native-shape-prepare","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-deep-parity","status":"succeeded","stepId":"shape.prepare","type":"call_tool"},{"attempt":1,"claim":{"executorId":"comet-native-cli","token":"portable-f8207abc071cf718d40801d967ddcbbb14aa31fe2208ef527792510364a5dbb5"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-deep-parity:5","input":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-deep-parity"},"outputs":{}},"inputHash":"f582bfc9f79651bbb0ddac07fccf0e42a4ec09a6b991e8e219b025a55a9b695c","outcome":{"actionId":"askdata-sqlbot-deep-parity:5","attempt":1,"claimToken":"portable-f8207abc0