"A26","source":"brief.md","text":"A26 问数执行明细契约：chat_log.operate 用 GENERATE_SQL 枚举名；错误事件为 {message,traceback,type:exec-sql-err|db-connection-err} 且生成 SQL 前先 check_connection；/chat/record/{id}/data 返回 fields_info；chart_answer 存模型原始思考；/chat/record/{id}/log 的 message 为结构化对象。"},{"id":"A27","source":"brief.md","text":"A27 前端交付一致性：外观链路与 license 状态解耦；关于页许可证上传按钮对应可用端点或从界面移除；web/dist 重新构建后与 web/src 行为一致。"},{"id":"A28","source":"brief.md","text":"A28 License 管理：ws admin 通过 POST /system/license 上传许可证后持久化生效；GET /system/license 返回真实状态（valid/invalid/expired）、版本、有效期与失败原因；GET /system/license/version 返回真实版本而非固定 community。"},{"id":"A29","source":"brief.md","text":"A29 前端企业门控：getLicense 读取后端真实状态；license 有效时企业 IM 扫码登录、用户页平台同步按钮、平台参数页企业能力可正常请求，无效时给出明确提示而非静默隐藏。"},{"id":"A30","source":"brief.md","text":"A30 平台客户端信息：GET /system/platform/client/{origin} 返回 sys_authentication 中该平台真实配置（client_id、enable、valid 及平台所需字段），不再硬编码 {client_id:null, enable:false}。"},{"id":"A31","source":"brief.md","text":"A31 企业 IM 扫码登录：钉钉、Lark、LarkSuite、企业微信四类扫码登录全流程可完成（取客户端信息 → 第三方 SDK 扫码 → 回调 → sso/{type} 建立会话并跳回系统）；平台未配置或已禁用时返回可读错误。"},{"id":"A32","source":"brief.md","text":"A32 平台用户同步：用户页平台同步按钮可用；POST /system/platform/user/sync 幂等同步并返回 total/created/updated/skipped。"},{"id":"A33","source":"brief.md","text":"A33 平台组织端点：/system/platform/org/{id} 可正常响应前端 api/system.ts 的 platform() 调用，不再是死链。"},{"id":"A34","source":"brief.md","text":"A34 SSO 协议登录链路：OIDC、OAuth2、CAS、SAML2 的 login/{type} 跳转 URL 与 sso/{type} 回调登录链路可用，配置缺失时给出明确错误。"},{"id":"A35","source":"brief.md","text":"A35 企业登录参数：/system/parameter/login 分组中企业登录相关配置可读可写，并实际影响登录页展示的登录方式。"}],"children":null,"formalHash":"21285f47b7627bd5110b9871e0bb27f5d0d5714083e9594d171457055642126c","shapeConfirmationHash":"5568d23f167f491cbe99a9e828f6e1f964c4491152ea7695a46f84b1012cd8ba","specChanges":[{"capability":"askdata-sqlbot-deep-parity","operation":"create","source":"specs/askdata-sqlbot-deep-parity/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 仪表板图表取数：配置