f.md","text":"A23 模型与数据源下发：AI 模型连通测试支持 Azure 端点与自定义参数；高级应用数据源优先取宿主 API 下发结果。"},{"id":"A24","source":"brief.md","text":"A24 嵌入与助手：嵌入页取数据源不要求 ws admin；助手 UI 上传校验 jpg/png 且不超过 10MB、替换时删除旧文件、清空时置空；mcp_assistant 使用下发的 url 与 authorization 调第三方接口。"},{"id":"A25","source":"brief.md","text":"A25 认证与平台：认证源 list/getById 要求 admin；SAML 响应断言签名被校验；平台客户端接口返回真实配置而非硬编码占位；助手 CORS 动态 origin 被实际调用。"},{"id":"A26","source":"brief.md","text":"A26 问数执行明细契约：chat_log.operate 用 GENERATE_SQL 枚举名；错误事件为 {message,traceback,type:exec-sql-err|db-connection-err} 且生成 SQL 前先 check_connection；/chat/record/{id}/data 返回 fields_info；chart_answer 存模型原始思考；/chat/record/{id}/log 的 message 为结构化对象。"},{"id":"A27","source":"brief.md","text":"A27 前端交付一致性：外观链路与 license 状态解耦；关于页许可证上传按钮对应可用端点或从界面移除；web/dist 重新构建后与 web/src 行为一致。"}],"children":null,"formalHash":"243c6817beb0f3871a22fb6831e39367f285f20d66d54cd4f38d80d74f5d6cdf","shapeConfirmationHash":"cf8830fb7b70a30f04469990224081c81d808923298d2c7b69e2136fe9817caa","specChanges":[{"capability":"askdata-sqlbot-deep-parity","operation":"create","source":"specs/askdata-sqlbot-deep-parity/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 仪表板图表取数：配置以应用密钥落库的数据源，仪表板图表请求返回 status=success 与数据；配置无法解密时返回 status=failed 且 message 指明原因，不再静默失败。"},{"id":"A2","source":"brief.md","text":"A2 表数据预览权限：普通用户预览已配置列权限与行权限的表时，返回字段仅含允许列，且执行 SQL 注入行权限 WHERE；ws admin 预览不受限。"},{"id":"A3","source":"brief.md","text":"A3 权限执行 fail-closed：PermissionEnforcer 无法解析 SQL 时拒绝执行并返回错误，不再以未加固 SQL 放行。"},{"id":"A4","source":"brief.md","text":"A4 analysis/predict 外键方向：对基础气泡执行分析/预测后，基础记录自身的 analysis_record_id 与 predict_record_id 保持 NULL，子记录指向基础记录。"},{"id":"A5","source":"brief.md","text":"A5 外观设置保存：ws admin 调 POST /system/appearance 保存外观键值后，GET /system/appearance/ui 能读回；外观页保存不再 404。"},{"id":"A6","source":"brief.md","text":"A6 外观不依赖 license：前端 getLicense() 返回 invalid 时，外观页仍可读取与保存，页面不再\"改了没反应\"。"},{"id":"A7","source":"brief.md","text":"A7 嵌入助手 token：缺少签名、签名不匹配或超出时间窗的请求被拒绝；带合法签名的请求可换取工作空间 token。"},