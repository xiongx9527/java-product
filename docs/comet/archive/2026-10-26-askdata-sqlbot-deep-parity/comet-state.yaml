：表名 1.0、表注释 0.9、表名子串 0.7、字段注释 0.5、字段名 0.3，并按覆盖率加权。"},{"id":"A16","source":"brief.md","text":"A16 跨轮错误自愈：同一会话下一轮提问的提示词中包含上一轮 exec-sql 错误的 traceback。"},{"id":"A17","source":"brief.md","text":"A17 first_chat 记录：创建会话时生成 first_chat=True 的空记录；recommended_config==2 时预填推荐问题。"},{"id":"A18","source":"brief.md","text":"A18 动态数据源行规则：宿主下发的表级 rule 生成并注入过滤 SQL；行权限 like 条件生成 '%value%'。"},{"id":"A19","source":"brief.md","text":"A19 数据源元数据细节：Hive 数据源按 Spark Thrift 结果集解析索引与字段；SQLServer 乱码按 latin-1→GBK 回正；字段枚举按 CoreField.id 查询。"},{"id":"A20","source":"brief.md","text":"A20 向量刷新时机：修改表注释、字段注释或数据源配置后，表、字段与数据源向量被重算。"},{"id":"A21","source":"brief.md","text":"A21 连接池参数：数据源配置的 poolSize、max_overflow、pool_timeout 生效。"},{"id":"A22","source":"brief.md","text":"A22 会话与口令：每个请求复查用户 status/oid；口令强度要求大小写、数字与特殊字符且长度 8-20。"},{"id":"A23","source":"brief.md","text":"A23 模型与数据源下发：AI 模型连通测试支持 Azure 端点与自定义参数；高级应用数据源优先取宿主 API 下发结果。"},{"id":"A24","source":"brief.md","text":"A24 嵌入与助手：嵌入页取数据源不要求 ws admin；助手 UI 上传校验 jpg/png 且不超过 10MB、替换时删除旧文件、清空时置空；mcp_assistant 使用下发的 url 与 authorization 调第三方接口。"},{"id":"A25","source":"brief.md","text":"A25 认证与平台：认证源 list/getById 要求 admin；SAML 响应断言签名被校验；平台客户端接口返回真实配置而非硬编码占位；助手 CORS 动态 origin 被实际调用。"},{"id":"A26","source":"brief.md","text":"A26 问数执行明细契约：chat_log.operate 用 GENERATE_SQL 枚举名；错误事件为 {message,traceback,type:exec-sql-err|db-connection-err} 且生成 SQL 前先 check_connection；/chat/record/{id}/data 返回 fields_info；chart_answer 存模型原始思考；/chat/record/{id}/log 的 message 为结构化对象。"},{"id":"A27","source":"brief.md","text":"A27 前端交付一致性：外观链路与 license 状态解耦；关于页许可证上传按钮对应可用端点或从界面移除；web/dist 重新构建后与 web/src 行为一致。"},{"id":"A28","source":"brief.md","text":"A28 License 管理：ws admin 通过 POST /system/license 上传许可证后持久化生效；GET /system/license 返回真实状态（valid/invalid/expired）、版本、有效期与失败原因；GET /system/license/version 返回真实版本而非固定 community。"},{"id":"A29","source":"brief.md","text":"A29 前端企业门控：getLicense 读取后端真实状态；license 有效时企业 IM 扫码登录、用户页平台同步按钮、平台参数页企业能力可正常请求，无效时给出明确提示而非静默隐藏。"},{"id":"A30","source":"brief.md","text":"A30 平台客户端信息：GET /system/platform/client/{origin} 返回 sys_authentication 中该平台真实配置（client_id、enable、valid 及平台所需字段），不再硬编码 {client_id:null, enable:false}。"},{"id":"A31","source":"brief.md","text":"A31 企业 IM 扫码登录：钉钉、Lark、LarkSuite、企业微信四类扫码登录全流程可完成（取客户端信息 → 第三方 SDK 扫码 → 回调 → sso/{type} 建立会话并跳回系统）；平台未配置或已禁用时返回可读错误。"},{"id":"A32","source":"brief.md","text":"A32 平台用户同步：用户页平台同步按钮可用；POST /system/platform/user/sync 幂等同步并返回 total/created/updated/skipped。"},{"id":"A33","source":"brief.md","text":"A33 平台组织端点：/system/platform/org/{id} 可正常响应前端 api/system.ts 的 platform() 调用，不再是死链。"},{"id":"A34","source":"brief.md","text":"A34 SSO 协议登录链路：OIDC、OAuth2、CAS、SAML2 的 login/{type} 跳转 URL 与 sso/{type} 回调登录链路可用，配置缺失时给出明确错误。"},{"id":"A35","source":"brief.md","text":"A35 企业登录参数：/system/parameter/login 分组中企业登录相关配置可读可写，并实际影响登录页展示的登录方式。"}],"children":null,"formalHash":"21285f47b7627bd5110b9871e0bb27f5d0d5714083e9594d171457055642126c","shapeConfirmationHash":"5568d23f167f491cbe99a9e828f6e1f964c4491152ea7695a46f84b1012cd8ba","specChanges":[{"capability":"askdata-sqlbot-deep-parity","operation":"create","source":"specs/askdata-sqlbot-deep-parity/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"4b992f9c6053c82b456fbd8c536f8eb51bc3b7d91861455bed0d3b64324ec92f","outcomeId":"c5ee12f2-2394-425b-9077-9b77ef5d5d44"}],"reconciliations":[],"ref":"native-shape-revalidate","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-deep-parity","status":"succeeded","stepId":"shape.revalidate","type":"call_tool"},{"attempt":1,"claim":{"executorId":"native-host","sessionId":"deep-parity-builder-20261025","token":"portable-8cc7402d1017f810ea1418d10b658ba5016d9b9b8d7cb9f2840fe494b671b207"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-deep-parity:6","input":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-deep-parity"},"outputs":{}},"inputHash":"a5cb7b5c713f