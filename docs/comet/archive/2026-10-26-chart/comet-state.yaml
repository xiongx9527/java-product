    reason:
      text: ChartImageRenderer.seriesColor/areaFillColor 多 series 不同色、area
        浅投影填充；drawCartesian barLen=((vals[i]-min)/(max-min))*plotW
        横向条长按值比例；pieLabel=名称+数值+占比；ChatChartBuilder.normalize/build 保留
        axis.multi-quota；normalize 未知/缺 type 抛
        IllegalArgumentException。ChartSemanticsParityTest 像素级与行为断言全绿。
      truncated: false
  - id: A5
    source: brief.md
    text: A5 出图 URL 生命周期：MCP/IM/第三方拿到的 `image_url` 使用持久化
      token→文件映射，进程重启后仍可打开；未登录第三方在有效期内可访问，篡改/过期 token 返回
      404/403；`/api/chart/image/*` 在鉴权白名单内；过期图片文件与 token 按 TTL 清理，不无限增长。
    result: passed
    reason:
      text: ChartImageService.saveStore 写磁盘 JSON 映射、initStore reload 支持重启；controller
        免鉴权返回 200 供有效期内第三方访问；get() 对非 32-hex/unknown/expired 返回
        null→404；AuthWhitelist.CHART_IMAGE_PATHS 含
        /api/chart/image/*；cleanupExpired + @Scheduled
        按期清理。ChartImageTokenLifecycleTest 全绿。
      truncated: false
