    source: brief.md
    text: A5：问数结果支持 CSV 导出（XLSX 已有）；代码与 schema.sql
      中不存在硬编码口令/密钥字面量；密钥/口令改为可配置，缺省值不写入版本库，且配置缺失时应用可正常启动（有测试/静态检查）。
