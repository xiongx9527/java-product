    text: A1：主聊天 NL2SQL 在生成 SQL 时把数据源方言（对应 DatasourceType 的 dialect 名，如
      PostgreSQL/Oracle/ClickHouse）注入 system prompt，并使用该方言的引号/分页/类型约定；对任意非 MySQL
      数据源生成的 SQL 在该方言下语法正确且可执行（由针对非 MySQL 数据源的集成/单测验证）。
    result: passed
    reason:
      text: 方言注入主 NL2SQL system prompt；DatasourceTypeDialectHintTest 通过，sqlDialectHint
        符号核对通过。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：MCP question_answer 与 SimpleAssistant 的 NL2SQL 不再硬编码 MySQL，不再每次问数全库
      DatabaseMetaData 扫描；复用与主路径一致的 top-N RAG schema 选择 + dialect 注入 + 校验；移除
      AskdataNl2Sql 中字面量 MySQL 与全表 dump 逻辑，且对非 MySQL 数据源产出正确 SQL（集成测试覆盖）。
    result: passed
    reason:
      text: AskdataNl2Sql/AskdataSqlRetriever 去除字面量 MySQL 与全表 dump，复用 top-N
        schema+方言+只读校验；全量套件通过。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：追问将前序 Q&A 上下文注入 SQL 生成使 follow-up 能引用前文实体；术语库/SQL 示例在无 embedding
      模型或对应表缺失时系统显式记录降级（日志/状态标志）而非静默失效（有对应测试或可观测日志断言）。
