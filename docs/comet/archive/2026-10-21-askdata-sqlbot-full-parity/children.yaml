schema: comet.native.children.v2
acceptance_index:
  A1:
    source: brief.md
    text: "A1 端点覆盖：逐条比对 SQLBot `backend/apps/**` 全部 router 端点（约 140 条）与其对应实现，askdata 侧均有等价路由且返回信封 `{code,data,msg}` 一致；`docs/comet/changes/askdata-sqlbot-full-parity/coverage.md` 给出逐条覆盖表（SQLBot 端点 → askdata 端点 → 状态 → 证据）。"
  A2:
    source: brief.md
    text: "A2 问数知识增强链路：提问命中术语库中的业务词时，生成的 SQL 上下文包含该术语的释义与同义词扩展；`chat_record.extracted_keywords` / `expanded_keywords` 有值；`chat_log` 可见 `EXTRACT_KEYWORDS` / `FILTER_TERMS` / `FILTER_SQL_EXAMPLE` / `FILTER_CUSTOM_PROMPT` 操作记录；未配置 embedding 模型时链路自动降级为词法召回且不报错。"
  A3:
    source: brief.md
    text: "A3 权限强制生效：为普通用户配置行权限（`ds_permission`）与列权限后，问数返回的结果集已被过滤/隐藏对应行与列，且过滤条件出现在执行的 SQL 中；管理员与白名单用户不受影响。当前 askdata 中 `DsPermissionQueryService` 无调用方，本项要求其为**运行时生效**而非仅存储。"
  A4:
    source: brief.md
    text: "A4 鉴权三通道与白名单：`X-SQLBOT-TOKEN` 主通道可用；`X-SQLBOT-ASK-TOKEN: sk <jwt>` API Key 通道可用（合法 key 通过、非法/停用 key 401）；`X-SQLBOT-ASSISTANT-TOKEN` 嵌入通道可用（`app_secret` 正确通过、管理员账号被拒、非 type=4 被拒）；SQLBot 33 条公共路径在 askdata 侧均免鉴权（尤其 `/system/assistant/info/*`、`/system/assistant/app/*`、`/system/assistant/picture/*`、`/system/assistant/validate/*`、`/system/appearance/*`、`/system/authentication/*`、`/mcp*`、`/images/*`）；伪造 `Host: evil.com/api/v1/mcp` 的请求被 400 拒绝。"
  A5:
    source: brief.md
    text: "A5 SQL 安全与执行安全：`WITH x AS (DELETE FROM t RETURNING *) SELECT * FROM x` 被拒绝；解析失败的 SQL 被拒绝（保守拒绝）；`execSql` 使用参数化执行；非法 JDBC 连接参数被拦截；SQLBot `test_cwe89_escape_fix.py` 钉住的转义语义（引号加倍、反斜杠加倍、`IN`/`LIKE`/`=`/`N'…'` 片段、逻辑运算符仅 `AND`/`OR`）在 askdata 侧有等价单测通过。"
  A6:
    source: brief.md
    text: "A6 嵌入/向量链路完整：术语、SQL 示例、表、数据源四类对象的向量均能写入并被召回；未配置远程 embedding 模型时使用本地 embedding 模型（`shibing624/text2vec-base-chinese`）仍可完成向量召回；启动时自动回填空向量（三类 backfill 在集群内只执行一次）；向量不可用时全链路降级不报错。"
  A7:
    source: brief.md
    text: "A7 数据格式化与图表：查询结果中的 `1.23e20` 以 `123000000000000000000` 形式返回（无科学计数法）；`alias.column` 形式的列在图表绑定中可按短列名解析；图表配置支持 `multi-quota`；Excel 导出按完整图表配置还原字段。"
  A8:
    source: brief.md
    text: "A8 审计完整性：新增/修改/删除等写操作经审计切面自动记录（含 `execution_time` 实际值、资源名、资源关联行）；登录成功/失败均有审计记录；审计写入失败不阻断业务。"
  A9:
    source: brief.md
    text: "A9 国际化覆盖：消息键集合与 SQLBot 177 键对齐（默认/中文/英文三包键集合一致，英文包无缺键）；支持 `zh-CN`/`zh-TW`/`en`/`ko-KR`/`th-TH` 五语言；`?lang=` 与 `Accept-Language` 切换生效；新增键有单测。"
  A10:
    source: brief.md
    text: "A10 基础设施等价：数据源查询走连接池（可验证 LRU 淘汰与 `dispose`）；ID 生成跨进程唯一（雪花位段正确）；应用密钥由配置提供而非硬编码；CORS 生效（含错误响应与助手动态域名）；响应信封由全局兜底保证。"
  A11:
    source: brief.md
    text: "A11 不回退：全模块既有测试（含 MCP E2E、问数主链路、RAG、datasource 引擎、ES、术语/训练/提示词、用户批量导入、i18n）保持通过；前端构建不破。"
children:
  - name: infra-toolchain
    depends_on: []
    covers: [A6, A10]
  - name: datasource-safety
    depends_on: [infra-toolchain]
    covers: [A3, A5]
  - name: auth-whitelist
    depends_on: []
    covers: [A4]
  - name: chat-knowledge
    depends_on: [infra-toolchain]
    covers: [A2, A7]
  - name: i18n-audit
    depends_on: []
    covers: [A8, A9]
  - name: integration-regression
    depends_on: [infra-toolchain, datasource-safety, auth-whitelist, chat-knowledge, i18n-audit]
    covers: [A1, A11]
