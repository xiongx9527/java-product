        infra.
      truncated: false
  - id: A9
    source: brief.md
    text: A9 国际化覆盖：消息键集合与 SQLBot 177 键对齐（默认/中文/英文三包键集合一致，英文包无缺键）；支持
      `zh-CN`/`zh-TW`/`en`/`ko-KR`/`th-TH` 五语言；`?lang=` 与 `Accept-Language`
      切换生效；新增键有单测。
    result: passed
    reason:
      text: i18n-audit verified (7333cfd); I18nA9Test(7) green; 6 bundles each 274
        keys, en zero missing vs default (>=177 floor satisfied); 5-language
        switching via ?lang= and Accept-Language. A9 177-key alignment =
