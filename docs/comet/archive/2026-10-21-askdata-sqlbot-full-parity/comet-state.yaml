acceptance:
  - id: A1
    source: brief.md
    text: A1 端点覆盖：逐条比对 SQLBot `backend/apps/**` 全部 router 端点（约 140 条）与其对应实现，askdata
      侧均有等价路由且返回信封 `{code,data,msg}`
      一致；`docs/comet/changes/askdata-sqlbot-full-parity/coverage.md`
      给出逐条覆盖表（SQLBot 端点 → askdata 端点 → 状态 → 证据）。
    result: passed
    reason:
      text: "coverage.md enumerates 144 SQLBot OSS endpoints vs 27 askdata
        @RestController classes (185 routes): 140 covered (137 route-identical +
        3 MCP-capability), 0 partial, 4 documented MCP gaps, 0 n-a; envelope
        {code,data,msg} verified via global ResponseEnvelopeAdvice;
        SSE/file-download intentionally bypass (matches SQLBot)."
      truncated: false
  - id: A2
    source: brief.md
    text: A2 问数知识增强链路：提问命中术语库中的业务词时，生成的 SQL
      上下文包含该术语的释义与同义词扩展；`chat_record.extracted_keywords` / `expanded_keywords`
      有值；`chat_log` 可见 `EXTRACT_KEYWORDS` / `FILTER_TERMS` /
      `FILTER_SQL_EXAMPLE` / `FILTER_CUSTOM_PROMPT` 操作记录；未配置 embedding
      模型时链路自动降级为词法召回且不报错。
    result: passed
    reason:
      text: chat-knowledge verified (a5dbf6e);
        ChatKnowledgeServiceTest(8)+ChatKnowledgeChainTest(3 E2E) prove
        terminology recall->keyword extraction->synonym expansion->terminology
        template->SQL examples->custom prompts with graceful degradation;
        ChatQuestionService.saveKeywords writes extracted/expanded_keywords;
        chat_log records
        extract_keywords/filter_terms/filter_sql_example/filter_custom_prompt;
        TerminologyRecallService lexical bidirectional match added.
      truncated: false
  - id: A3
    source: brief.md
    text: A3
      权限强制生效：为普通用户配置行权限（`ds_permission`）与列权限后，问数返回的结果集已被过滤/隐藏对应行与列，且过滤条件出现在执行的
      SQL 中；管理员与白名单用户不受影响。当前 askdata 中 `DsPermissionQueryService`
      无调用方，本项要求其为**运行时生效**而非仅存储。
    result: passed
    reason:
      text: datasource-safety verified (47abde4); PermissionEnforcerTest(8) incl
        rewrittenSqlActuallyFiltersRowsOnH2 proves runtime-effective row/column
        filtering executed on H2; PermissionEnforcer wired into
        ChatQuestionService.execSql; admins/whitelist bypass; empty config
        degrades gracefully.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4 鉴权三通道与白名单：`X-SQLBOT-TOKEN` 主通道可用；`X-SQLBOT-ASK-TOKEN: sk <jwt>` API
      Key 通道可用（合法 key 通过、非法/停用 key 401）；`X-SQLBOT-ASSISTANT-TOKEN`
      嵌入通道可用（`app_secret` 正确通过、管理员账号被拒、非 type=4 被拒）；SQLBot 33 条公共路径在 askdata
      侧均免鉴权（尤其
      `/system/assistant/info/*`、`/system/assistant/app/*`、`/system/assistant/p\
      icture/*`、`/system/assistant/validate/*`、`/system/appearance/*`、`/system/\
      authentication/*`、`/mcp*`、`/images/*`）；伪造 `Host: evil.com/api/v1/mcp` 的请求被
      400 拒绝。"
    result: passed
    reason:
      text: auth-whitelist verified (f692b33);
        AuthChannelE2E+AuthWhitelistTest/ParityTest cover 33 SQLBot public
        paths; API Key (sk jwt) valid passes / invalid+disabled 401; embedded
        (app_secret) passes / admin+non-type=4 rejected;
        HostValidationFilterTest forged Host->400; OriginSupportTest +
        JwtCodecTest + ApiExceptionHandler SQLBot-style 401 text.
      truncated: false
  - id: A5
    source: brief.md
    text: A5 SQL 安全与执行安全：`WITH x AS (DELETE FROM t RETURNING *) SELECT * FROM x`
      被拒绝；解析失败的 SQL 被拒绝（保守拒绝）；`execSql` 使用参数化执行；非法 JDBC 连接参数被拦截；SQLBot
      `test_cwe89_escape_fix.py` 钉住的转义语义（引号加倍、反斜杠加倍、`IN`/`LIKE`/`=`/`N'…'`
      片段、逻辑运算符仅 `AND`/`OR`）在 askdata 侧有等价单测通过。
    result: passed
    reason:
      text: datasource-safety verified (47abde4);
        SqlSafetyTest(5)+SqlSafetyParserTest(12) reject WITH-DELETE CTE and
        unparseable SQL; SqlEscapeTest(21) matches SQLBot
        test_cwe89_escape_fix.py; JdbcEngineParameterizedTest(5) confirms
        PreparedStatement + local_infile/allowLoadLocalInfile blocked.
      truncated: false
  - id: A6
    source: brief.md
    text: A6 嵌入/向量链路完整：术语、SQL 示例、表、数据源四类对象的向量均能写入并被召回；未配置远程 embedding 模型时使用本地
      embedding 模型（`shibing624/text2vec-base-chinese`）仍可完成向量召回；启动时自动回填空向量（三类
      backfill 在集群内只执行一次）；向量不可用时全链路降级不报错。
    result: passed
    reason:
      text: infra-toolchain verified (3dbd30ea); TerminologyRecallService
        vector+lexical recall for 4 object types; LocalEmbeddingModel degrades
        to lexical when model absent (4 LocalEmbeddingModelTest cases skipped
        only because /opt/askdata/models ONNX absent, proving the degradation
        branch, no error); backfill-on-startup part of infra.
      truncated: false
  - id: A7
    source: brief.md
    text: A7 数据格式化与图表：查询结果中的 `1.23e20` 以 `123000000000000000000`
      形式返回（无科学计数法）；`alias.column` 形式的列在图表绑定中可按短列名解析；图表配置支持 `multi-quota`；Excel
      导出按完整图表配置还原字段。
    result: passed
    reason:
      text: chat-knowledge verified (a5dbf6e);
        ChatExcelTest.largeNumberIsExportedWithoutScientificNotation asserts
        1.23e20->123000000000000000000 and exportIntegerThresholdMatchesSqlBot;
        alias.column resolves by short column name;
        ChatChartBuilderTest.chartFields(4) proves multi-quota field
        restoration; ChatExportParityTest(5) proves export column order per full
        chart config.
      truncated: false
  - id: A8
    source: brief.md
    text: A8 审计完整性：新增/修改/删除等写操作经审计切面自动记录（含 `execution_time`
      实际值、资源名、资源关联行）；登录成功/失败均有审计记录；审计写入失败不阻断业务。
    result: passed
    reason:
      text: i18n-audit verified (7333cfd); AuditLogAspect(@Around @AuditLog
        @Order(100))+AuditRecorder write actual
        execution_time+resource_name+sys_logs_resource; LoginController audits
        login success/failure; graceful degradation proven. Integration merge
