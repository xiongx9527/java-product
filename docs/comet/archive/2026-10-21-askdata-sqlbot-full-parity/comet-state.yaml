        parity (different i18n layers) - documented in known_limits.
      truncated: false
  - id: A10
    source: brief.md
    text: A10 基础设施等价：数据源查询走连接池（可验证 LRU 淘汰与 `dispose`）；ID
      生成跨进程唯一（雪花位段正确）；应用密钥由配置提供而非硬编码；CORS 生效（含错误响应与助手动态域名）；响应信封由全局兜底保证。
    result: passed
    reason:
      text: infra-toolchain verified (3dbd30ea); ConnectionPoolManagerTest(9/9)
        LRU+dispose; SnowflakeIdGeneratorTest cross-process-unique;
        CorsConfigTest CORS incl error responses + assistant dynamic domain;
        ResponseEnvelopeAdviceTest global envelope; app secrets from config.
      truncated: false
  - id: A11
    source: brief.md
    text: A11 不回退：全模块既有测试（含 MCP E2E、问数主链路、RAG、datasource
      引擎、ES、术语/训练/提示词、用户批量导入、i18n）保持通过；前端构建不破。
    result: passed
