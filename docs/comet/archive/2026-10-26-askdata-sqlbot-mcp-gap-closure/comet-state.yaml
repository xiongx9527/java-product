p-targeted-tests","name":"MCP 兼容层定向测试","repeatable":true,"timeoutMs":1800000},{"argv":["-lc","export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home; export PATH=\"$JAVA_HOME/bin:$PATH\"; mvn -pl askdata/askdata-server test -Dmaven.test.skip=false"],"cwdRef":".","executable":"bash","id":"askdata-server-full-tests","name":"askdata-server 全模块测试","repeatable":true,"timeoutMs":1800000}],"iteration":1,"kind":"request-checks"},"verifierExecutionRef":"opencode-verifier-62bdfa14-0481-4484-b160-59779b10f3e4"}},{"sequence":10,"value":{"candidateId":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","response":{"kind":"final-result","result":{"acceptance":[{"id":"A1","reason":"ChatQuestionService.ask/assembleAskResult reuses streamQuestion and reads chat_record data/chart, while AskdataMcpTools.mcp_question creates a chat when chat_id is absent; ChatPipelineTest.nonStreamAskReturnsSqlbotJsonAndPersistedDataObject asserts success=true, record_id, sql, data.fields order [status,cnt], data.datasource, chart, image_url and exact equality between response data and persisted chat_record.data.","result":"passed"},{"id":"A2","reason":"SqlbotMcpCompatController.mcpQuestion and mcpAssistant use !Boolean.FALSE.equals(stream) so null/default and true take SSE and only explicit false takes JSON; SqlbotMcpCompatControllerTest.mcpQuestionStreamsByDefaultWhenChatIdPresent, mcpAssistantDefaultsToStream, mcpQuestionNonStreamPassesIntStrUnionArgs and mcpQuestionCustomModelStillStreams cover default/true/false.","result":"passed"},{"id":"A3","reason":"ChatQuestionService.streamQuestion reads return_img, skips chartImageService.renderFromResult when false, resolves custom_model via ChatModelRouter and passes the same ModelRef aiModel into generateText for SQL and generateChart; ChatPipelineTest.returnImgFalseSkipsRenderingInBothPaths verifies no imageUrl/no image_url/no render, customModelAppliesToSqlAndChartGeneration observes model custom-gemma for SQL+chart