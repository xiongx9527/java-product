修复 | | S8：审计 M5（错误码） | complete | 无效 token 403；非流式问数 500 message；其他 400 detail | 同上 §8 | A8 | covered | 本次修复 | | S9：审计 M6（数据源授权） | complete | MCP 问数调用 `DsGrantService.checkUsable` | 同上 §9 | A9 | covered | 本次修复 | | S10：审计 L1（工作空间列表形状） | complete | 仅 `{id,name}`，按名称排序 | 同上 §10 | A10 | covered | 本次修复 | | S11：审计 L2（mcp_start 响应形状） | complete | 仅 `{access_token,chat_id}` | 同上 §11 | A11 | covered | 本次修复 | | S12：审计 L3（fields） | complete | 非流式结果包含 `fields` | 同上 §1 | A1 | covered | 与 H1 合并验收，避免重复项 |"}],"children":null,"formalHash":"7f2b8ec350952bf99cc7cb2c761fe414aaf755c1564dbea68ac84cf33f66c66c","shapeConfirmationHash":"6f4c92a581d6a4a6651a4062c082594c866fd49be4364076772bc95c76fa7a3b","specChanges":[{"capability":"askdata-sqlbot-mcp-gap-closure","operation":"create","source":"specs/askdata-sqlbot-mcp-gap-closure/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：非流式 `mcp_question`（`stream=false`，带或不带 `chat_id`）返回 SQLBot JSON：`success=true`、`record_id`、`sql`、`data` 对象（含 `fields` 数组与 `data` 数组；有数据源时含 `datasource`；发生 1000 行截断时含 `limit`）、`chart` 对象；`return_img` 未显式关闭且产出图片时含 `image_url`。该次查询在 `chat_record.data` 中落库的对象与响应 `data` 一致，不再是裸行数组；`data.fields` 与结果字段同名同序（覆盖 H1、L3）。"},{"id":"A2","source":"brief.md","text":"A2：`mcp_question` 带 `chat_id` 时，`stream` 字段缺省或为 `true` 返回 `text/event-stream`（SSE `data:{json}` 帧），为 `false` 返回 JSON；`mcp_assistant` 的 `stream` 缺省或为 `true` 返回 SSE，为 `false` 返回 JSON；缺省不再等价于 `false`。"},{"id":"A3","source":"brief.md","text":"A3：`mcp_question` 流式请求 `return_img=false` 时不渲染图片、不发送 `imageUrl` 帧；非流式时响应不含 `image_url`；`return_img` 缺省/`true` 时仍按原逻辑出图。同一请求带可用的 `custom_model` 时，SQL 生成与图表生成使用该模型（模型名/端点与所选模型一致），不再因 `custom_model` 退回同步 JSON；模型 id 不存在/不可用时返回错误（流式错误帧或非流式 `success=false`），不静默使用默认模型。"},{"id":"A4","source":"brief.md","text":"A4：`mcp_assistant` 缺少 `url` 或 `authorization` 时返回 400 `{\"detail\":...}`。合法请求以合成用户（id=-1、account=`sqlbot-mcp-assistant`、oid=1，不写入 `sys_user`）创建会话（不创建 `first_chat` 空记录），按 `url`+`authorization` 拉取宿主数据源并创建一条真实 `chat_record`（`first_chat=false`），落一条 CHAT 创建审计（`sys_logs.user_id=-1`）与问数 `chat_log`；随后执行问数。`stream` 缺省/`true` 返回 SSE，`false` 返回 JSON（`finish_step=QUERY_DATA`，不生成图表/图片）；不再回退到本地 `assistant()` 多轮问答。"},{"id":"A5","source":"brief.md","text":"A5：会话已绑定数据源 D1 时，`mcp_question` 传入 `datasource_id=D2` 仍在 D1 上生成/执行 SQL，`chat.datasource` 与 `chat_record.datasource` 保持 D1；会话未绑定数据源时传入 D2 则在 D2 上执行并把 `chat.datasource` 写为 D2；未传且未绑定时沿用 RAG 选库并回写；流式与非流式行为一致。"},{"id":"A6","source":"brief.md","text":"A6：`mcp_start`（及 `chat_start` 工具）只创建 `chat`，不创建任何 `first_chat=TRUE` 的空 `chat_record`；`chat.brief` 在有 `question` 时为去空白后的前 20 个字符，无 `question` 时为当前时间 `yyyy-MM-dd HH:mm:ss`；传入 `datasource_id` 时仍按既有授权校验后写入 `chat.datasource`。Web `/chat/start` 的首条空记录行为不变。"},{"id":"A7","source":"brief.md","text":"A7：原生 `datasource_list` 与 `mcp_datasource_list` 返回的数据源数组元素均不含 `configuration`、`embedding`、`table_relation`、`recommended_config`；其余既有字段保留，并按名称升序。REST `/datasource/list` 不受影响。"},{"id":"A8","source":"brief.md","text":"A8：`mcp_question`、`mcp_start`、`mcp_ws_list`、`mcp_ds_list`、`mcp_model_list` 在 token 无效时返回 HTTP 403 `{\"detail\":...}`；非流式 `mcp_question` 的运行期错误（会话不存在、无数据源、模型不可用、SQL 执行失败、授权拒绝）返回 HTTP 500 `{\"success\":false,\"message\":...}`（如已创建记录则带 `record_id`）；其他工具错误保持 HTTP 400 `{\"detail\":...}`；`mcp_question` 的 `datasource_id`/`chat_id`/`custom_model` 格式非法时按 SQLBot 校验返回 400 `{\"detail\":...}`。"},{"id":"A9","source":"brief.md","text":"A9：`mcp_question` 在流式与非流式路径上，对最终使用的数据源（会话已绑定、显式 `datasource_id` 或 RAG 选中）调用 `DsGrantService.checkUsable`；被拒绝时不生成/执行 SQL，非流式返回 500 `{success:false,message}`，流式发送错误帧；管理员与已授权用户不受影响。"},{"id":"A10","source":"brief.md","text":"A10：`mcp_ws_list`（及原生 `workspace_list`）返回的数组元素只含 `id` 与 `name` 两个键，按 `name` 升序（翻译后的名称），不再包含 `create_time` 等字段；`mcp_ds_list` 继续按名称升序。"},{"id":"A11","source":"brief.md","text":"A11：`POST /api/v1/mcp/mcp_start` 成功响应只含 `access_token` 与 `chat_id` 两个键（有令牌时两者都有；无令牌的既有会话场景可缺省 `access_token`，但不得出现其他键），不再返回 `id`、`brief`、`datasource`、`engine_type` 等会话详情。 ## Source coverage 覆盖边界：用户在 2026-10-26 会话中给出的 SQLBot → java-product MCP 能力覆盖审计 H1–L3 清单（全部 12 项），以及为理解这些差距所必需的 SQLBot 参考实现（`/Users/xiongxiao/Workspaces/Idea/codes/New/SQLBot` 的 `apps/mcp/mcp.py`、`apps/chat/api/chat.py`、`apps/chat/task/llm.py`、`apps/chat/curd/chat.py`、`apps/system/crud/user.py`）。范围外能力不纳入本次覆盖。 | 来源条目与位置 | 读取状态 | 需要保留的内容 | Spec 位置 | 验收 ID | 覆盖状态 | 理由或替代关系 | | --- | --- | --- | --- | --- | --- | --- | | S1：审计 H1（非流式 mcp_question 响应/落库） | complete | 返回 `{success,sql,data:{fields,data},chart,record_id,image_url?}`；`chat_record.data` 落 `{fields,data,datasource,limit}` | `specs/askdata-sqlbot-mcp-gap-closure/spec.md` §1 | A1 | covered | 本次修复 | | S2：审计 H2（stream 缺省值） | complete | `stream` 缺省按 `true` 处理 | 同上 §2 | A2 | covered | 本次修复 | | S3：审计 H3（流式 return_img/custom_model） | complete | `return_img=false` 不出图；`custom_model` 在流式生效且不退回同步 | 同上 §3 | A3 | covered | 本次修复 | | S4：审计 M1（mcp_assistant） | complete | 必填 url/authorization；合成用户建会话/记录/审计；支持 stream | 同上 §4 | A4 | covered | 本次修复 | | S5：审计 M2（datasource_id 优先级） | complete | 仅会话未绑定数据源时生效 | 同上 §5 | A5 | covered | 本次修复 | | S6：审计 M3（mcp_start 空记录/brief） | complete | 不建 first_chat 空记录；brief 问题前 20 字符或时间戳 | 同上 §6 | A6 | covered | 本次修复 | | S7：审计 M4（原生 datasource_list 裁剪） | complete | 裁掉 configuration/embedding/table_relation/recommended_config | 同上 §7 | A7 | covered | 本次修复 | | S8：审计 M5（错误码） | complete | 无效 token 403；非流式问数 500 message；其他 400 detail | 同上 §8 | A8 | covered | 本次修复 | | S9：审计 M6（数据源授权） | complete | MCP 问数调用 `DsGrantService.checkUsable` | 同上 §9 | A9 | covered | 本次修复 | | S10：审计 L1（工作空间列表形状） | complete | 仅 `{id,name}`，按名称排序 | 同上 §10 | A10 | covered | 本次修复 | | S11：审计 L2（mcp_start 响应形状） | complete | 仅 `{access_token,chat_id}` | 同上 §11 | A11 | covered | 本次修复 | | S12：审计 L3（fields） | complete | 非流式结果包含 `fields` | 同上 §1 | A1 | covered | 与 H1 合并验收，避免重复项 |"}],"children":null,"formalHash":"7f2b8ec350952bf99cc7cb2c761fe414aaf755c1564dbea68ac84cf33f66c66c","shapeConfirmationHash":"6f4c92a581d6a4a6651a4062c082594c866fd49be4364076772bc95c76fa7a3b","