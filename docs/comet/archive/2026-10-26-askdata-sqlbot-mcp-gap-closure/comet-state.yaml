.resolveDatasource returns bound chat.datasource first, then explicit datasource_id after existence/workspace checks, then RAG selectDatasource; streamQuestion writes chat.datasource back only when it was unbound and inserts each chat_record with the resolved dsId; ChatPipelineTest.boundDatasourceWinsAndUnboundChatUsesRequestedDatasource and unboundChatWithoutExplicitDatasourceUsesRagSelectionAndPersists verify both stream and non-stream paths plus chat/record persistence.","result":"passed"},{"id":"A6","reason":"ChatService.startForMcp inserts a chat only (no insertFirstChatRecord) with mcpBrief = trimmed first 20 chars or yyyy-MM-dd HH:mm:ss; AskdataMcpTools.chat_start and mcp_start delegate to it, while Web start(Map) still calls insertFirstChatRecord; ChatPipelineTest.mcpStartCreatesChatWithoutFirstChatRecordAndDerivesBrief and mcpStartValidatesAndPersistsDatasourceWithoutCreatingRecord assert zero records, brief shape, datasource grant check and persistence.","result":"passed"},{"id":"A7","reason":"AskdataMcpTools.sanitizeDatasourceList removes configuration/embedding/table_relation/recommended_config and sorts by name; both native datasource_list and mcp_datasource_list call it, while REST DatasourceController still calls DatasourceService.list directly; McpSqlbotCompatTest.datasourceListStripsInternalFieldsAndSortsByName asserts removals, retained fields and name order.","result":"passed"},{"id":"A8","reason":"AskdataMcpTools.bindTokenStrict throws ForbiddenException, mapped by ApiExceptionHandler.forbidden to 403 {\"detail\"} for mcp_question/mcp_start/mcp_ws_list/mcp_ds_list/mcp_model_list; non-stream mcp_question failures become {success:false,message,record_id?} and SqlbotMcpCompatController.respondQuestion maps them to 500; longOrNull/longArgOrNull map non-numeric IDs to 400 detail; tests cover invalid token 403, non-stream 500 message+record_id, invalid datasource_id 400 without execution, stream runtime error as SSE error+finish, assistant tool error 400 detail, and MCP-vs-Web detail/plain-text routing.","result":"passed"},{"id":"A9","reason":"ChatQuestionService.streamQuestion resolves the final datasource then calls DsGrantService.checkUsable(oid,uid,isAdmin,dsId) before checkConnection/schema/SQL generation; denial saves the record error, emits an error+finish frame in streaming, and makes ask return success=false with record_id for the 500 mapping; ChatPipelineTest.datasourceGrantDeniedStopsSqlInStreamAndNonStreamPaths asserts no sql/sql-data frames and success=false with record_id.","result":"passed"},{"id":"A10","reason":"WorkspaceService.listOptions emits only id and translated name and sorts by name; AskdataMcpTools.workspace_list uses listOptions and mcp_ws_list delegates to it, while mcp_datasource_list still returns sanitizeDatasourceList name-sorted; McpSqlbotGapClosureTest.workspaceOptionsOnlyIdAndNameSortedByLocalizedName asserts two-key maps and ordering (Default Workspace included) while REST list still has create_time, and McpSqlbotCompatTest covers datasource name sorting.","result":"passed"},{"id":"A11","reason":"AskdataMcpTools.mcpStartResponse builds a LinkedHashMap containing only access_token (when a token exists) and chat_id from chat_start's id, and mcp_start returns it after delegating; McpSqlbotCompatTest.mcpStartResponseContainsOnlyAccessTokenAndChatId and mcpStartResponseWithoutTokenOmitsAccessTokenKey assert two/one-key shapes with no brief/datasource/engine_type, and SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys checks the HTTP body mapping.","result":"passed"}],"attempt":1,"iteration":1,"risks":["A8 residual edge: non-scalar JSON values for datasource_id/chat_id/custom_model (object/array or non-empty container) are converted to an empty string by intStrArg/longOrNull and treated as absent rather than rejected with 400; non-numeric strings such as \"abc\" are correctly rejected and covered by tests.","A3's custom-model test uses anyMatch across request bodies, so the test alone does not isolate the chart request; code inspection confirms both SQL and chart calls receive the same custom ModelRef via ChatQuestionService.generateText/generateChart.","A1/A8/A11 HTTP controller tests mock AskdataMcpTools/ChatQuestionService; the end-to-end pipeline evidence is in ChatPipelineTest and McpAssistantFlowTest, not a single HTTP+DB integration test.","A9's denial test uses a mocked DsGrantService with an admin user; the production checkUsable implementation and its admin/grant semantics were inspected separately."],"summary":"Independent code and test verification found all A1-A11 acceptance behaviors implemented and exercised. I ran the targeted JDK 17 suite myself earlier: 57 tests, 0 failures, 0 errors. After the checks-input fingerprint drifted (caused by that test run changing generated target/ artifacts), I requested the original repeatable checks with refreshChecks:true; the Runtime re-ran both commands: targeted 57-test suite passed (exit 0, 44.8s) and full askdata-server suite passed (exit 0, 161.9s, 877 tests). No acceptance failure was found; only residual edge-case/test-isolation risks are noted.","verdict":"pass"}},"verifierExecutionRef":"opencode-verifier-62bdfa14-0481-4484-b160-59779b10f3e4"},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"c82c7b4965bf80a61296ebda5f36ae9dee5a63bc9bb700b77930eab30143b1f9","outcomeId":"askdata-sqlbot-mcp-gap-closure:10:1:62bdfa14-0481-4484-b160-59779b10f3e4"}],"reconciliations":[],"ref":"native-verifier","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-mcp-gap-closure","status":"succeeded","stepId":"verify.verifier","type":"handoff"},{"attempt":1,"claim":{"executorId":"comet-native-report","token":"portable-791e41f852fc4d923b66f43d2505e73c0514d9b7eb481b31c4f0b1bed164717d"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-mcp-gap-closure:11