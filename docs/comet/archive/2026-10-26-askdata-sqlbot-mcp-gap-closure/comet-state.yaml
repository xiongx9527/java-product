 保持 D1；会话未绑定数据源时传入 D2 则在 D2 上执行并把 `chat.datasource` 写为 D2；未传且未绑定时沿用 RAG 选库并回写；流式与非流式行为一致。"},{"id":"A6","source":"brief.md","text":"A6：`mcp_start`（及 `chat_start` 工具）只创建 `chat`，不创建任何 `first_chat=TRUE` 的空 `chat_record`；`chat.brief` 在有 `question` 时为去空白后的前 20 个字符，无 `question` 时为当前时间 `yyyy-MM-dd HH:mm:ss`；传入 `datasource_id` 时仍按既有授权校验后写入 `chat.datasource`。Web `/chat/start` 的首条空记录行为不变。"},{"id":"A7","source":"brief.md","text":"A7：原生 `datasource_list` 与 `mcp_datasource_list` 返回的数据源数组元素均不含 `configuration`、`embedding`、`table_relation`、`recommended_config`；其余既有字段保留，并按名称升序。REST `/datasource/list` 不受影响。"},{"id":"A8","source":"brief.md","text":"A8：`mcp_question`、`mcp_start`、`mcp_ws_list`、`mcp_ds_list`、`mcp_model_list` 在 token 无效时返回 HTTP 403 `{\"detail\":...}`；非流式 `mcp_question` 的运行期错误（会话不存在、无数据源、模型不可用、SQL 执行失败、授权拒绝）返回 HTTP 500 `{\"success\":false,\"message\":...}`（如已创建记录则带 `record_id`）；其他工具错误保持 HTTP 400 `{\"detail\":...}`；`mcp_question` 的 `datasource_id`/`chat_id`/`custom_model` 格式非法时按 SQLBot 校验返回 400 `{\"detail\":...}`。"},{"id":"A9","source":"brief.md","text":"A9：`mcp_question` 在流式与非流式路径上，对最终使用的数据源（会话已绑定、显式 `datasource_id` 或 RAG 选中）调用 `DsGrantService.checkUsable`；被拒绝时不生成/执行 SQL，非流式返回 500 `{success:false,message}`，流式发送错误帧；管理员与已授权用户不受影响。"},{"id":"A10","source":"brief.md","text":"A10：`mcp_ws_list`（及原生 `workspace_list`）返回的数组元素只含 `id` 与 `name` 两个键，按 `name` 升序（翻译后的名称），不再包含 `create_time` 等字段；`mcp_ds_list` 继续按名称升序。"},{"id":"A11","source":"brief.md","text":"A11：`POST /api/v1/mcp/mcp_start` 成功响应只含 `access_token` 与 `chat_id` 两个键（有令牌时两者都有；无令牌的既有会话场景可缺省 `access_token`，但不得出现其他键），不再返回 `id`、`brief`、`datasource`、`engine_type` 等会话详情。"}],"children":null,"formalHash":"fcb92a5133e99ab47e995878fbae65b03b3bc75c5ab503b50b9d1c1ca1544f86","shapeConfirmationHash":"49acb6006b4d75ca340f5ed9b1222342814dd579ae9849ec5352a3c4a3a8d5e7","specChanges":[{"capability":"askdata-sqlbot-mcp-gap-closure","operation":"create","source":"specs/askdata-sqlbot-mcp-gap-closure/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"1a1c40b39d2839508524ce81dd71a5faa2823504a215bad0a8af61ba599272af","outcomeId":"b0f4990a-882f-48e1-a3d5-943f714da97f"}],"reconciliations":[],"ref":"native-shape-revalidate","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-mcp-gap-closure","status":"succeeded","stepId":"shape.revalidate","type":"call_tool"},{"attempt":1,"claim":{"executorId":"native-host","sessionId":"opencode-1e450d2b-b3be-42a4-8c0d-ef115c9d6c6b","token":"portable-ce5c449d1b50dcbcc9205e3d25923c2bbddbaa6287c74832677b63e11b8ff207"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-mcp-gap-closure:6","input":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-mcp-gap-closure"},"outputs":{}},"inputHash":"630195a6f3d7b2b4a0dd6ddb91909ba78e941fa6baf46123df22de11bfbb0f2a","outcome":{"actionId":"askdata-sqlbot-mcp-gap-closure:6","attempt":1,"claimToken":"portable-ce5c449d1b50dcbcc9205e3d25923c2bbddbaa6287c74832677b63e11b8ff207","inputHash":"630195a6f3d7b2b4a0dd6ddb91909ba78e941fa6baf46123df22de11bfbb0f2a","outcomeId":"askdata-sqlbot-mcp-gap-closure:6:1:builder-result-2","output":{"acceptanceReview":[{"evidence":["ChatQuestionService.ask(Map) 与 assembleAskResult 复用同一 streamQuestion 管线（捕获帧组装），非流式返回 success/record_id/sql/data/chart/image_url，data 对象含 fields/data/datasource/limit","ChatQuestionService 落库 chat_record.data 使用与响应一致的 {fields,data,datasource,limit} 对象（assembleAskResult 同源构造）","ChatPipelineTest.nonStreamAskReturnsSqlbotJsonAndPersistedDataObject 断言 success、record_id、sql、data.fields、data.data、chart 及落库对象一致"],"id":"A1","note":"自检：非流式与流式共用管线，避免 fields/chart/权限/落库分叉；L3 的 fields 与 H1 同测覆盖。","status":"implemented-with-evidence"},{"evidence":["SqlbotMcpCompatController.mcpQuestion / mcpAssistant 采用 stream == null || stream 判定，缺省即流式；stream=false 才走 JSON","SqlbotMcpCompatControllerTest.mcpQuestionStreamsByDefaultWhenChatIdPresent、mcpAssistantDefaultsToStream、mcpQuestionNonStreamPassesIntStrUnionArgs 覆盖缺省/true/false 三态"],"id":"A2","note":"自检：缺省值从 false 改为 true，显式 false 的既有 JSON 调用保持可用。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService 读取 return_img：流式跳过 imageUrl 帧、非流式不返回 image_url；缺省/true 保持原出图逻辑","ChatQuestionService 读取 custom_model 并对 SQL 生成与图表生成统一使用所选模型；不可用时发错误帧/返回 success=false，不回退默认模型","ChatPipelineTest.returnImgFalseSkipsRenderingInBothPaths、customModelAppliesToSqlAndChartGeneration、unknownCustomModelFailsWithoutUsingDefaultModel；SqlbotMcpCompatControllerTest.mcpQuestionCustomModelStillStreams"],"id":"A3","note":"自检：custom_model 的流式行为由控制器测试确认仍返回 text/event-stream，不再退回同步 JSON。","status":"implemented-with-evidence"},{"evidence":["新增 McpAssistantSupport：校验 url/authorization，构造合成身份 id=-1/account=sqlbot-mcp-assistant/oid=1 的请求级 AuthContext，不写 sys_user","ChatService.startForMcpAssistant 仅创建 chat（无 first_chat 空记录）；随后经宿主数据源执行问数并创建真实 chat_record(finish_step=QUERY_DATA，无图表/图片)","AuditRecorder.currentUid 支持合成 id=-1 落 CHAT 创建审计；CurrentUserService 对 sqlbot-mcp-assistant 跳过活跃会话校验","McpAssistantFlowTest.askCreatesSyntheticChatRecordAndAuditWithoutChart、streamEmitsSseWithoutChartAndRestoresContext、missingQuestionUrlOrAuthorizationIsRejectedBeforeCreatingChat；SqlbotMcpCompatControllerTest.mcpAssistantMissingUrlReturns400Detail、mcpAssistantNonStreamDelegatesToTool"],"id":"A4","note":"自检：合成身份不伪造真实用户行，仅请求级承载；审计 user_id=-1 已由集成测试断言。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService.resolveDatasource 实现「会话已绑定 > 请求 datasource_id > RAG 选库」，已绑定会话忽略显式参数且不改绑","流式与非流式共用同一解析路径，未绑定采用显式数据源时回写 chat.datasource 与 chat_record.datasource","ChatPipelineTest.boundDatasourceWinsAndUnboundChatUsesRequestedDatasource、unboundChatWithoutExplicitDatasourceUsesRagSelectionAndPersists 覆盖两条路径"],"id":"A5","note":"自检：已绑定会话仍保留绑定值，显式数据源仅在未绑定时生效。","status":"implemented-with-evidence"},{"evidence":["ChatService.startForMcp 只创建 chat，不插入 first_chat 空记录；brief 由 mcpBrief 生成（问题去空白前 20 字，无问题为 yyyy-MM-dd HH:mm:ss）","chat_start 工具与 mcp_start 均委托 startForMcp；Web /chat/start 继续走原 start(Map) 保留首条空记录","ChatPipelineTest.mcpStartCreatesChatWithoutFirstChatRecordAndDerivesBrief、mcpStartValidatesAndPersistsDatasourceWithoutCreatingRecord；SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys"],"id":"A6","note":"自检：数据源授权校验沿用既有 resolveStartDatasource，不因 MCP 路径放宽。","status":"implemented-with-evidence"},{"evidence":["AskdataMcpTools.sanitizeDatasourceList 移除 configuration/embedding/table_relation/recommended_config，并按 name 升序排序","原生 datasource_list 与 mcp_datasource_list 共用该裁剪逻辑；REST /datasource/list 未改动","McpSqlbotCompatTest.datasourceListStripsInternalFieldsAndSortsByName 断言四字段缺失与名称顺序"],"id":"A7","note":"自检：仅 MCP 工具输出裁剪，REST 前端契约不受影响。","status":"implemented-with-evidence"},{"evidence":["新增 ForbiddenException；ApiExceptionHandler 对 MCP 路由映射 403 {\"detail\":...}、非法参数/其他工具错误 400 {\"detail\":...}，Web 路由保持原纯文本行为","SqlbotMcpCompatController 非流式 mcp_question 运行期错误映射 500 {\"success\":false,\"message\":...}（有记录时带 record_id）；流式路径业务错误仍以 SSE error+finish 帧结束","datasource_id/chat_id/custom_model 经 longArgOrNull 安全解析，格式非法返回 400 detail","SqlbotMcpCompatControllerTest.mcpQuestionInvalidTokenReturns403Detail、mcpQuestionNonStreamFailureReturns500WithMessage、mcpQuestionInvalidDatasourceIdReturns400Detail、mcpQuestionStreamRuntimeErrorStaysSse、mcpAssistantToolErrorMappedTo400Detail；McpSqlbotGapClosureTest.mcpRouteErrorsUseJsonDetailWhileWebRouteStaysPlainText"],"id":"A8","note":"自检：参数/身份校验在 SSE 建立前完成，运行期错误不改成 4xx/5xx，避免流内无法解析响应体。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService 在确定最终数据源（会话绑定/显式/RAG）后、执行 SQL 前调用 DsGrantService.checkUsable，流式与非流式一致","授权拒绝时不生成/执行 SQL；非流式返回 500 success=false+message、流式发送错误帧；管理员与已授权用户不触发","ChatPipelineTest.datasourceGrantDeniedStopsSqlInStreamAndNonStreamPaths 断言两路径均未执行 SQL 且返回/帧为拒绝"],"id":"A9","note":"自检：对已绑定会话也复检，防止授权撤销后继续问数（D5）。","status":"implemented-with-evidence"},{"evidence":["WorkspaceService.listOptions 仅输出 {id,name}，name 为当前语言翻译后的名称，并按 name 升序排序","mcp_ws_list 与原生 workspace_list 共用 listOptions；mcp_ds_list 继续按名称升序","McpSqlbotGapClosureTest.workspaceOptionsOnlyIdAndNameSortedByLocalizedName 断言键集合与顺序"],"id":"A10","note":"自检：未改工作空间 CRUD/REST 返回，仅收敛 MCP 列表形状。","status":"implemented-with-evidence"},{"evidence":["AskdataMcpTools.mcpStartResponse 只组装 access_token 与 chat_id（无令牌的既有会话场景缺省 access_token）","mcp_start 不再回传 id/brief/datasource/engine_type 等会话详情，chat_start 工具行为独立保留","McpSqlbotCompatTest.mcpStartResponseContainsOnlyAccessTokenAndChatId、mcpStartResponseWithoutTokenOmitsAccessTokenKey；SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys"],"id":"A11","note":"自检：两键响应由工具层与 HTTP 层测试双重覆盖。","status":"implemented-with-evidence"}],"addressedAcceptanceIds":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11"],"checks":[{"name":"定向测试（MCP 兼容层与问数管线）","note":"JDK 17 下 mvn -pl askdata/askdata-server test -Dmaven.test.skip=false -Dtest=SqlbotMcpCompatControllerTest,McpSqlbotCompatTest,McpSqlbotGapClosureTest,McpAssistantFlowTest,ChatPipelineTest,ChatKnowledgeChainTest -DfailIfNoTests=false：57 tests（19/5/2/4/24/3），0 failures，0 errors。","result":"passed"},{"name":"全模块测试 askdata-server","note":"JDK 17 下 mvn -pl askdata/askdata-server test -Dmaven.test.skip=false：877 tests，0 failures，0 errors，5 skipped，BUILD SUCCESS。","result":"passed"},{"name":"编译与测试编译","note":"上述 Maven 运行包含 main/test 编译，全部通过；无未使用导入导致的编译告警失败。","result":"passed"}],"knownLimits":["流式帧格式继续使用 askdata SSE data:{json}，不逐字复刻 SQLBot markdown 流文本（brief 非目标 D8）。","不实现 FastAPI/pydantic 的 422 字段校验细节，缺字段/非法 id 统一 400 {\"detail\":...}。","不回填历史 chat_record.data，旧记录保持原形状。","验证需 JDK 17；本机默认 JDK 非 17 时须显式设置 JAVA_HOME。"],"submittedAt":"2026-10-26T07:15:27.000Z","summary":"完成 SQLBot → askdata MCP 兼容层 H1–L3 全量修复：非流式 mcp_question 复用 ChatQuestionService 主问数管线并返回 SQLBot 结果对象（success/record_id/sql/data/chart/image_url），chat_record.data 落同一 {fields,data,datasource,limit} 形状；mcp_question 与 mcp_assistant 的 stream 缺省为 true；return_img=false 在流式/非流式均不出图，custom_mo