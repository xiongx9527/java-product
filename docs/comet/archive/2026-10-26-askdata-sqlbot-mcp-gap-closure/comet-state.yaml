run_checkpoint: {"schema":"comet.workflow-run-checkpoint.v2","hash":"a0a967a5092fbae91aed077f2d539a9ade6c60dc97c8b982a5199011b146a84c","run":{"protocolVersion":1,"schemaVersion":1,"runId":"askdata-sqlbot-mcp-gap-closure","revision":1,"workflow":{"id":"comet-native","version":"1","hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7"},"definitionHashes":{"[\"comet-native\",\"1\"]":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7"},"initialStateHash":"ec5624c7f003b7d02a34e4ab3409125253aaaddf5edeb0021751fe65eaaf2fc6","input":{"artifactRootRef":"docs","name":"askdata-sqlbot-mcp-gap-closure"},"state":{"acceptance":[{"id":"A1","reason":{"text":"ChatQuestionService.ask/assembleAskResult reuses streamQuestion and reads chat_record data/chart, while AskdataMcpTools.mcp_question creates a chat when chat_id is absent; ChatPipelineTest.nonStreamAskReturnsSqlbotJsonAndPersistedDataObject asserts success=true, record_id, sql, data.fields order [status,cnt], data.datasource, chart, image_url and exact equality between response data and persisted chat_record.data.","truncated":false},"result":"passed","source":"brief.md","text":"A1：非流式 `mcp_question`（`stream=false`，带或不带 `chat_id`）返回 SQLBot JSON：`success=true`、`record_id`、`sql`、`data` 对象（含 `fields` 数组与 `data` 数组；有数据源时含 `datasource`；发生 1000 行截断时含 `limit`）、`chart` 对象；`return_img` 未显式关闭且产出图片时含 `image_url`。该次查询在 `chat_record.data` 中落库的对象与响应 `data` 一致，不再是裸行数组；`data.fields` 与结果字段同名同序（覆盖 H1、L3）。"},{"id":"A2","reason":{"text":"SqlbotMcpCompatController.mcpQuestion and mcpAssistant use !Boolean.FALSE.equals(stream) so null/default and true take SSE and only explicit false takes JSON; SqlbotMcpCompatControllerTest.mcpQuestionStreamsByDefaultWhenChatIdPresent, mcpAssistantDefaultsToStream, mcpQuestionNonStreamPassesIntStrUnionArgs and mcpQuestionCustomModelStillStreams cover default/true/false.","truncated":false},"result":"passed","source":"brief.md","text":"A2：`mcp_question` 带 `chat_id` 时，`stream` 字段缺省或为 `true` 返回 `text/event-stream`（SSE `data:{json}` 帧），为 `false` 返回 JSON；`mcp_assistant` 的 `stream` 缺省或为 `true` 返回 SSE，为 `false` 返回 JSON；缺省不再等价于 `false`。"},{"id":"A3","reason":{"text":"ChatQuestionService.streamQuestion reads return_img, skips chartImageService.renderFromResult when false, resolves custom_model via ChatModelRouter and passes the same ModelRef aiModel into generateText for SQL and generateChart; ChatPipelineTest.returnImgFalseSkipsRenderingInBothPaths verifies no imageUrl/no image_url/no render, customModelAppliesToSqlAndChartGeneration observes model custom-gemma for SQL+chart, and unknownCustomModelFailsWithoutUsingDefaultModel verifies success=false without SQL generation.","truncated":false},"result":"passed","source":"brief.md","text":"A3：`mcp_question` 流式请求 `return_img=false` 时不渲染图片、不发送 `imageUrl` 帧；非流式时响应不含 `image_url`；`return_img` 缺省/`true` 时仍按原逻辑出图。同一请求带可用的 `custom_model` 时，SQL 生成与图表生成使用该模型（模型名/端点与所选模型一致），不再因 `custom_model` 退回同步 JSON；模型 id 不存在/不可用时返回错误（流式错误帧或非流式 `success=false`），不静默使用默认模型。"},{"id":"A4","reason":{"text":"McpAssistantSupport.prepare requires question/url/authorization (blank rejected), fetches the host datasource via url+authorization, enters synthetic AuthContext id=-1/account=sqlbot-mcp-assistant/oid=1, and ChatService.startForMcpAssistant creates only a chat; body sets finish_step=QUERY_DATA and return_img=false; McpAssistantFlowTest.askCreatesSyntheticChatRecordAndAuditWithoutChart asserts create_by=-1, oid=1, first_chat=false, one real record, no sys_user row, sys_logs.user_id=-1, chat_log, no chart/image, while streamEmitsSseWithoutChartAndRestoresContext and missingQuestionUrlOrAuthorizationIsRejectedBeforeCreatingChat cover streaming and 400-before-side-effects.","truncated":false},"result":"passed","source":"brief.md","text":"A4：`mcp_assistant` 缺少 `url` 或 `authorization` 时返回 400 `{\"detail\":...}`。合法请求以合成用户（id=-1、account=`sqlbot-mcp-assistant`、oid=1，不写入 `sys_user`）创建会话（不创建 `first_chat` 空记录），按 `url`+`authorization` 拉取宿主数据源并创建一条真实 `chat_record`（`first_chat=false`），落一条 CHAT 创建审计（`sys_logs.user_id=-1`）与问数 `chat_log`；随后执行问数。`stream` 缺省/`true` 返回 SSE，`false` 返回 JSON（`finish_step=QUERY_DATA`，不生成图表/图片）；不再回退到本地 `assistant()` 多轮问答。"},{"id":"A5","reason":{"text":"ChatQuestionService.resolveDatasource returns bound chat.datasource first, then explicit datasource_id after existence/workspace checks, then RAG selectDatasource; streamQuestion writes chat.datasource back only when it was unbound and inserts each chat_record with the resolved dsId; ChatPipelineTest.boundDatasourceWinsAndUnboundChatUsesRequestedDatasource and unboundChatWithoutExplicitDatasourceUsesRagSelectionAndPersists verify both stream and non-stream paths plus chat/record persistence.","truncated":false},"result":"passed","source":"brief.md","text":"A5：会话已绑定数据源 D1 时，`mcp_question` 传入 `datasource_id=D2` 仍在 D1 上生成/执行 SQL，`chat.datasource` 与 `chat_record.datasource` 保持 D1；会话未绑定数据源时传入 D2 则在 D2 上执行并把 `chat.datasource` 写为 D2；未传且未绑定时沿用 RAG 选库并回写；流式与非流式行为一致。"},{"id":"A6","reason":{"text":"ChatService.startForMcp inserts a chat only (no insertFirstChatRecord) with mcpBrief = trimmed first 20 chars or yyyy-MM-dd HH:mm:ss; AskdataMcpTools.chat_start and mcp_start delegate to it, while Web start(Map) still calls insertFirstChatRecord; ChatPipelineTest.mcpStartCreatesChatWithoutFirstChatRecordAndDerivesBrief and mcpStartValidatesAndPersistsDatasourceWithoutCreatingRecord assert zero records, brief shape, datasource grant check and persistence.","truncated":false},"result":"passed","source":"brief.md","text":"A6：`mcp_start`（及 `chat_start` 工具）只创建 `chat`，不创建任何 `first_chat=TRUE` 的空 `chat_record`；`chat.brief` 在有 `question` 时为去空白后的前 20 个字符，无 `question` 时为当前时间 `yyyy-MM-dd HH:mm:ss`；传入 `datasource_id` 时仍按既有授权校验后写入 `chat.datasource`。Web `/chat/start` 的首条空记录行为不变。"},{"id":"A7","reason":{"text":"AskdataMcpTools.sanitizeDatasourceList removes configuration/embedding/table_relation/recommended_config and sorts by name; both native datasource_list and mcp_datasource_list call it, while REST DatasourceController still calls DatasourceService.list directly; McpSqlbotCompatTest.datasourceListStripsInternalFieldsAndSortsByName asserts removals, retained fields and name order.","truncated":false},"result":"passed","source":"brief.md","text":"A7：原生 `datasource_list` 与 `mcp_datasource_list` 返回的数据源数组元素均不含 `configuration`、`embedding`、`table_relation`、`recommended_config`；其余既有字段保留，并按名称升序。REST `/datasource/list` 不受影响。"},{"id":"A8","reason":{"text":"AskdataMcpTools.bindTokenStrict throws ForbiddenException, mapped by ApiExceptionHandler.forbidden to 403 {\"detail\"} for mcp_question/mcp_start/mcp_ws_list/mcp_ds_list/mcp_model_list; non-stream mcp_question failures become {success:false,message,record_id?} and SqlbotMcpCompatController.respondQuestion maps them to 500; longOrNull/longArgOrNull map non-numeric IDs to 400 detail; tests cover invalid token 403, non-stream 500 message+record_id, invalid datasource_id 400 without execution, stream runtime error as SSE error+finish, assistant tool error 400 detail, and MCP-vs-Web detail/plain-text routing.","truncated":false},"result":"passed","source":"brief.md","text":"A8：`mcp_question`、`mcp_start`、`mcp_ws_list`、`mcp_ds_list`、`mcp_model_list` 在 token 无效时返回 HTTP 403 `{\"detail\":...}`；非流式 `mcp_question` 的运行期错误（会话不存在、无数据源、模型不可用、SQL 执行失败、授权拒绝）返回 HTTP 500 `{\"success\":false,\"message\":...}`（如已创建记录则带 `record_id`）；其他工具错误保持 HTTP 400 `{\"detail\":...}`；`mcp_question` 的 `datasource_id`/`chat_id`/`custom_model` 格式非法时按 SQLBot 校验返回 400 `{\"detail\":...}`。"},{"id":"A9","reason":{"text":"ChatQuestionService.streamQuestion resolves the final datasource then calls DsGrantService.checkUsable(oid,uid,isAdmin,dsId) before checkConnection/schema/SQL generation; denial saves the record error, emits an error+finish frame in streaming, and makes ask return success=false with record_id for the 500 mapping; ChatPipelineTest.datasourceGrantDeniedStopsSqlInStreamAndNonStreamPaths asserts no sql/sql-data frames and success=false with record_id.","truncated":false},"result":"passed","source":"brief.md","text":"A9：`mcp_question` 在流式与非流式路径上，对最终使用的数据源（会话已绑定、显式 `datasource_id` 或 RAG 选中）调用 `DsGrantService.checkUsable`；被拒绝时不生成/执行 SQL，非流式返回 500 `{success:false,message}`，流式发送错误帧；管理员与已授权用户不受影响。"},{"id":"A10","reason":{"text":"WorkspaceService.listOptions emits only id and translated name and sorts by name; AskdataMcpTools.workspace_list uses listOptions and mcp_ws_list delegates to it, while mcp_datasource_list still returns sanitizeDatasourceList name-sorted; McpSqlbotGapClosureTest.workspaceOptionsOnlyIdAndNameSortedByLocalizedName asserts two-key maps and ordering (Default Workspace included) while REST list still has create_time, and McpSqlbotCompatTest covers datasource name sorting.","truncated":false},"result":"passed","source":"brief.md","text":"A10：`mcp_ws_list`（及原生 `workspace_list`）返回的数组元素只含 `id` 与 `name` 两个键，按 `name` 升序（翻译后的名称），不再包含 `create_time` 等字段；`mcp_ds_list` 继续按名称升序。"},{"id":"A11","reason":{"text":"AskdataMcpTools.mcpStartResponse builds a LinkedHashMap containing only access_token (when a token exists) and chat_id from chat_start's id, and mcp_start returns it after delegating; McpSqlbotCompatTest.mcpStartResponseContainsOnlyAccessTokenAndChatId and mcpStartResponseWithoutTokenOmitsAccessTokenKey assert two/one-key shapes with no brief/datasource/engine_type, and SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys checks the HTTP body mapping.","truncated":false},"result":"passed","source":"brief.md","text":"A11：`POST /api/v1/mcp/mcp_start` 成功响应只含 `access_token` 与 `chat_id` 两个键（有令牌时两者都有；无令牌的既有会话场景可缺省 `access_token`，但不得出现其他键），不再返回 `id`、`brief`、`datasource`、`engine_type` 等会话详情。"}],"archived":true,"blockers":[],"brief":"brief.md","builder_handoff":{"acceptance_review":[{"evidence":["ChatQuestionService.ask(Map) 与 assembleAskResult 复用同一 streamQuestion 管线（捕获帧组装），非流式返回 success/record_id/sql/data/chart/image_url，data 对象含 fields/data/datasource/limit","ChatQuestionService 落库 chat_record.data 使用与响应一致的 {fields,data,datasource,limit} 对象（assembleAskResult 同源构造）","ChatPipelineTest.nonStreamAskReturnsSqlbotJsonAndPersistedDataObject 断言 success、record_id、sql、data.fields、data.data、chart 及落库对象一致"],"id":"A1","note":"自检：非流式与流式共用管线，避免 fields/chart/权限/落库分叉；L3 的 fields 与 H1 同测覆盖。","status":"implemented-with-evidence"},{"evidence":["SqlbotMcpCompatController.mcpQuestion / mcpAssistant 采用 stream == null || stream 判定，缺省即流式；stream=false 才走 JSON","SqlbotMcpCompatControllerTest.mcpQuestionStreamsByDefaultWhenChatIdPresent、mcpAssistantDefaultsToStream、mcpQuestionNonStreamPassesIntStrUnionArgs 覆盖缺省/true/false 三态"],"id":"A2","note":"自检：缺省值从 false 改为 true，显式 false 的既有 JSON 调用保持可用。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService 读取 return_img：流式跳过 imageUrl 帧、非流式不返回 image_url；缺省/true 保持原出图逻辑","ChatQuestionService 读取 custom_model 并对 SQL 生成与图表生成统一使用所选模型；不可用时发错误帧/返回 success=false，不回退默认模型","ChatPipelineTest.returnImgFalseSkipsRenderingInBothPaths、customModelAppliesToSqlAndChartGeneration、unknownCustomModelFailsWithoutUsingDefaultModel；SqlbotMcpCompatControllerTest.mcpQuestionCustomModelStillStreams"],"id":"A3","note":"自检：custom_model 的流式行为由控制器测试确认仍返回 text/event-stream，不再退回同步 JSON。","status":"implemented-with-evidence"},{"evidence":["新增 McpAssistantSupport：校验 url/authorization，构造合成身份 id=-1/account=sqlbot-mcp-assistant/oid=1 的请求级 AuthContext，不写 sys_user","ChatService.startForMcpAssistant 仅创建 chat（无 first_chat 空记录）；随后经宿主数据源执行问数并创建真实 chat_record(finish_step=QUERY_DATA，无图表/图片)","AuditRecorder.currentUid 支持合成 id=-1 落 CHAT 创建审计；CurrentUserService 对 sqlbot-mcp-assistant 跳过活跃会话校验","McpAssistantFlowTest.askCreatesSyntheticChatRecordAndAuditWithoutChart、streamEmitsSseWithoutChartAndRestoresContext、missingQuestionUrlOrAuthorizationIsRejectedBeforeCreatingChat；SqlbotMcpCompatControllerTest.mcpAssistantMissingUrlReturns400Detail、mcpAssistantNonStreamDelegatesToTool"],"id":"A4","note":"自检：合成身份不伪造真实用户行，仅请求级承载；审计 user_id=-1 已由集成测试断言。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService.resolveDatasource 实现「会话已绑定 > 请求 datasource_id > RAG 选库」，已绑定会话忽略显式参数且不改绑","流式与非流式共用同一解析路径，未绑定采用显式数据源时回写 chat.datasource 与 chat_record.datasource","ChatPipelineTest.boundDatasourceWinsAndUnboundChatUsesRequestedDatasource、unboundChatWithoutExplicitDatasourceUsesRagSelectionAndPersists 覆盖两条路径"],"id":"A5","note":"自检：已绑定会话仍保留绑定值，显式数据源仅在未绑定时生效。","status":"implemented-with-evidence"},{"evidence":["ChatService.startForMcp 只创建 chat，不插入 first_chat 空记录；brief 由 mcpBrief 生成（问题去空白前 20 字，无问题为 yyyy-MM-dd HH:mm:ss）","chat_start 工具与 mcp_start 均委托 startForMcp；Web /chat/start 继续走原 start(Map) 保留首条空记录","ChatPipelineTest.mcpStartCreatesChatWithoutFirstChatRecordAndDerivesBrief、mcpStartValidatesAndPersistsDatasourceWithoutCreatingRecord；SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys"],"id":"A6","note":"自检：数据源授权校验沿用既有 resolveStartDatasource，不因 MCP 路径放宽。","status":"implemented-with-evidence"},{"evidence":["AskdataMcpTools.sanitizeDatasourceList 移除 configuration/embedding/table_relation/recommended_config，并按 name 升序排序","原生 datasource_list 与 mcp_datasource_list 共用该裁剪逻辑；REST /datasource/list 未改动","McpSqlbotCompatTest.datasourceListStripsInternalFieldsAndSortsByName 断言四字段缺失与名称顺序"],"id":"A7","note":"自检：仅 MCP 工具输出裁剪，REST 前端契约不受影响。","status":"implemented-with-evidence"},{"evidence":["新增 ForbiddenException；ApiExceptionHandler 对 MCP 路由映射 403 {\"detail\":...}、非法参数/其他工具错误 400 {\"detail\":...}，Web 路由保持原纯文本行为","SqlbotMcpCompatController 非流式 mcp_question 运行期错误映射 500 {\"success\":false,\"message\":...}（有记录时带 record_id）；流式路径业务错误仍以 SSE error+finish 帧结束","datasource_id/chat_id/custom_model 经 longArgOrNull 安全解析，格式非法返回 400 detail","SqlbotMcpCompatControllerTest.mcpQuestionInvalidTokenReturns403Detail、mcpQuestionNonStreamFailureReturns500WithMessage、mcpQuestionInvalidDatasourceIdReturns400Detail、mcpQuestionStreamRuntimeErrorStaysSse、mcpAssistantToolErrorMappedTo400Detail；McpSqlbotGapClosureTest.mcpRouteErrorsUseJsonDetailWhileWebRouteStaysPlainText"],"id":"A8","note":"自检：参数/身份校验在 SSE 建立前完成，运行期错误不改成 4xx/5xx，避免流内无法解析响应体。","status":"implemented-with-evidence"},{"evidence":["ChatQuestionService 在确定最终数据源（会话绑定/显式/RAG）后、执行 SQL 前调用 DsGrantService.checkUsable，流式与非流式一致","授权拒绝时不生成/执行 SQL；非流式返回 500 success=false+message、流式发送错误帧；管理员与已授权用户不触发","ChatPipelineTest.datasourceGrantDeniedStopsSqlInStreamAndNonStreamPaths 断言两路径均未执行 SQL 且返回/帧为拒绝"],"id":"A9","note":"自检：对已绑定会话也复检，防止授权撤销后继续问数（D5）。","status":"implemented-with-evidence"},{"evidence":["WorkspaceService.listOptions 仅输出 {id,name}，name 为当前语言翻译后的名称，并按 name 升序排序","mcp_ws_list 与原生 workspace_list 共用 listOptions；mcp_ds_list 继续按名称升序","McpSqlbotGapClosureTest.workspaceOptionsOnlyIdAndNameSortedByLocalizedName 断言键集合与顺序"],"id":"A10","note":"自检：未改工作空间 CRUD/REST 返回，仅收敛 MCP 列表形状。","status":"implemented-with-evidence"},{"evidence":["AskdataMcpTools.mcpStartResponse 只组装 access_token 与 chat_id（无令牌的既有会话场景缺省 access_token）","mcp_start 不再回传 id/brief/datasource/engine_type 等会话详情，chat_start 工具行为独立保留","McpSqlbotCompatTest.mcpStartResponseContainsOnlyAccessTokenAndChatId、mcpStartResponseWithoutTokenOmitsAccessTokenKey；SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys"],"id":"A11","note":"自检：两键响应由工具层与 HTTP 层测试双重覆盖。","status":"implemented-with-evidence"}],"addressed_acceptance_ids":["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","A11"],"builder_execution_ref":"opencode-1e450d2b-b3be-42a4-8c0d-ef115c9d6c6b","candidate_id":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","checks":[{"name":{"text":"定向测试（MCP 兼容层与问数管线）","truncated":false},"note":{"text":"JDK 17 下 mvn -pl askdata/askdata-server test -Dmaven.test.skip=false -Dtest=SqlbotMcpCompatControllerTest,McpSqlbotCompatTest,McpSqlbotGapClosureTest,McpAssistantFlowTest,ChatPipelineTest,ChatKnowledgeChainTest -DfailIfNoTests=false：57 tests（19/5/2/4/24/3），0 failures，0 errors。","truncated":false},"result":"passed"},{"name":{"text":"全模块测试 askdata-server","truncated":false},"note":{"text":"JDK 17 下 mvn -pl askdata/askdata-server test -Dmaven.test.skip=false：877 tests，0 failures，0 errors，5 skipped，BUILD SUCCESS。","truncated":false},"result":"passed"},{"name":{"text":"编译与测试编译","truncated":false},"note":{"text":"上述 Maven 运行包含 main/test 编译，全部通过；无未使用导入导致的编译告警失败。","truncated":false},"result":"passed"}],"checks_truncated":false,"identity_provider":"skill-coordinated","iteration":1,"known_limits":[{"text":"流式帧格式继续使用 askdata SSE data:{json}，不逐字复刻 SQLBot markdown 流文本（brief 非目标 D8）。","truncated":false},{"text":"不实现 FastAPI/pydantic 的 422 字段校验细节，缺字段/非法 id 统一 400 {\"detail\":...}。","truncated":false},{"text":"不回填历史 chat_record.data，旧记录保持原形状。","truncated":false},{"text":"验证需 JDK 17；本机默认 JDK 非 17 时须显式设置 JAVA_HOME。","truncated":false}],"known_limits_truncated":false,"review":null,"submitted_at":"2026-10-26T07:15:27.000Z","summary":{"text":"完成 SQLBot → askdata MCP 兼容层 H1–L3 全量修复：非流式 mcp_question 复用 ChatQuestionService 主问数管线并返回 SQLBot 结果对象（success/record_id/sql/data/chart/image_url），chat_record.data 落同一 {fields,data,datasource,limit} 形状；mcp_question 与 mcp_assistant 的 stream 缺省为 true；return_img=false 在流式/非流式均不出图，custom_model 同时作用于 SQL 与图表生成且不因流式退回同步；mcp_assistant 按 url+authorization 以合成用户（id=-1/sqlbot-mcp-assistant/oid=1）创建会话、真实记录与审计并按 finish_step=QUERY_DATA 执行；datasource_id 采用「会话绑定 > 显式 > RAG」优先级并对最终数据源复检 DsGrantService.checkUsable；mcp_start/chat_start 不再创建 first_chat 空记录且 brief 取问题前 20 字或时间戳；datasource 列表裁剪 configuration/embedding/table_relation/recommended_config 并按名称升序；workspace 列表仅 {id,name} 按翻译名排序；错误映射为无效 token 403 detail、非流式问数运行期错误 500 success=false+message、其他工具错误与非法 id 400 detail；mcp_start 响应收敛为 access_token+chat_id 两键。","truncated":false}},"created_at":"2026-10-26T05:43:23.922Z","document_constraints_version":2,"history":[{"attempt":1,"completed_at":"2026-10-26T07:43:20.952Z","goal_cycle":1,"iteration":1,"outcome":"pass","summary":{"text":"Independent code and test verification found all A1-A11 acceptance behaviors implemented and exercised. I ran the targeted JDK 17 suite myself earlier: 57 tests, 0 failures, 0 errors. After the checks-input fingerprint drifted (caused by that test run changing generated target/ artifacts), I requested the original repeatable checks with refreshChecks:true; the Runtime re-ran both commands: targeted 57-test suite passed (exit 0, 44.8s) and full askdata-server suite passed (exit 0, 161.9s, 877 tests). No acceptance failure was found; only residual edge-case/test-isolation risks are noted.","truncated":false},"unresolved_ids":[]}],"history_overflow":{"dropped_entries":0,"first_dropped_at":null,"last_dropped_at":null,"outcome_counts":{"blocked":0,"execution-error":0,"fail":0,"pass":0,"recovery":0}},"language":"zh-CN","loop":{"attempt":1,"execution_failure_count":0,"failed_iteration_count":0,"goal_cycle":1,"iteration":1,"next_action":null,"no_progress_count":0,"previous_unresolved_ids":[],"retry_epoch":0,"stage":"done"},"name":"askdata-sqlbot-mcp-gap-closure","phase":"archive","schema":"comet.native.v4","shape_confirmation_hash":"49acb6006b4d75ca340f5ed9b1222342814dd579ae9849ec5352a3c4a3a8d5e7","spec_changes":[{"capability":"askdata-sqlbot-mcp-gap-closure","operation":"create","source":"specs/askdata-sqlbot-mcp-gap-closure/spec.md"}],"state_version":10,"status":"done","verification":{"assurance":"skill-coordinated","attempt":1,"candidate_id":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","checks":[{"argv_display":[{"text":"-lc","truncated":false},{"text":"export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home; export PATH=\"$JAVA_HOME/bin:$PATH\"; mvn -pl askdata/askdata-server test -Dmaven.test.skip=false -Dtest=SqlbotMcpCompatControllerTest,McpSqlbotCompatTest,McpSqlbotGapClosureTest,McpAssistantFlowTest,ChatPipelineTest,ChatKnowledgeChainTest -DfailIfNoTests=false","truncated":false}],"argv_truncated":false,"cwd_ref":".","duration_ms":44753,"exit_code":0,"id":"mcp-targeted-tests","name":{"text":"MCP 兼容层定向测试","truncated":false},"status":"passed"},{"argv_display":[{"text":"-lc","truncated":false},{"text":"export JAVA_HOME=/Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home; export PATH=\"$JAVA_HOME/bin:$PATH\"; mvn -pl askdata/askdata-server test -Dmaven.test.skip=false","truncated":false}],"argv_truncated":false,"cwd_ref":".","duration_ms":161919,"exit_code":0,"id":"askdata-server-full-tests","name":{"text":"askdata-server 全模块测试","truncated":false},"status":"passed"}],"completed_at":"2026-10-26T07:43:20.952Z","identity_provider":"skill-coordinated","iteration":1,"risks":[{"text":"A8 residual edge: non-scalar JSON values for datasource_id/chat_id/custom_model (object/array or non-empty container) are converted to an empty string by intStrArg/longOrNull and treated as absent rather than rejected with 400; non-numeric strings such as \"abc\" are correctly rejected and covered by tests.","truncated":false},{"text":"A3's custom-model test uses anyMatch across request bodies, so the test alone does not isolate the chart request; code inspection confirms both SQL and chart calls receive the same custom ModelRef via ChatQuestionService.generateText/generateChart.","truncated":false},{"text":"A1/A8/A11 HTTP controller tests mock AskdataMcpTools/ChatQuestionService; the end-to-end pipeline evidence is in ChatPipelineTest and McpAssistantFlowTest, not a single HTTP+DB integration test.","truncated":false},{"text":"A9's denial test uses a mocked DsGrantService with an admin user; the production checkUsable implementation and its admin/grant semantics were inspected separately.","truncated":false}],"risks_truncated":false,"summary":{"text":"Independent code and test verification found all A1-A11 acceptance behaviors implemented and exercised. I ran the targeted JDK 17 suite myself earlier: 57 tests, 0 failures, 0 errors. After the checks-input fingerprint drifted (caused by that test run changing generated target/ artifacts), I requested the original repeatable checks with refreshChecks:true; the Runtime re-ran both commands: targeted 57-test suite passed (exit 0, 44.8s) and full askdata-server suite passed (exit 0, 161.9s, 877 tests). No acceptance failure was found; only residual edge-case/test-isolation risks are noted.","truncated":false},"verdict":"pass","verifier_execution_ref":"opencode-verifier-62bdfa14-0481-4484-b160-59779b10f3e4"},"verification_report":"verification.md","verification_result":"pass","workspace":{"change_branch":"main","finish":null,"isolation":"current","target_branch":"main"}},"status":"completed","sequence":16,"actions":[{"attempt":1,"claim":{"executorId":"comet-native-cli","token":"portable-492607636d41b6f15f7f6d97202e850b93aae32c35198bde0455172fcf1e6868"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-mcp-gap-closure:1","input":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-mcp-gap-closure"},"outputs":{}},"inputHash":"65a6c87f07e15cc5b122d2d43350e9dfa79c69954697f4ed4591709377b0da27","outcome":{"actionId":"askdata-sqlbot-mcp-gap-closure:1","attempt":1,"claimToken":"portable-492607636d41b6f15f7f6d97202e850b93aae32c35198bde0455172fcf1e6868","inputHash":"65a6c87f07e15cc5b122d2d43350e9dfa79c69954697f4ed4591709377b0da27","outcomeId":"23acf886-f8f9-4b26-a678-8baf1d0a8ab2","output":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：非流式 `mcp_question`（`stream=false`，带或不带 `chat_id`）返回 SQLBot JSON：`success=true`、`record_id`、`sql`、`data` 对象（含 `fields` 数组与 `data` 数组；有数据源时含 `datasource`；发生 1000 行截断时含 `limit`）、`chart` 对象；`return_img` 未显式关闭且产出图片时含 `image_url`。该次查询在 `chat_record.data` 中落库的对象与响应 `data` 一致，不再是裸行数组；`data.fields` 与结果字段同名同序（覆盖 H1、L3）。"},{"id":"A2","source":"brief.md","text":"A2：`mcp_question` 带 `chat_id` 时，`stream` 字段缺省或为 `true` 返回 `text/event-stream`（SSE `data:{json}` 帧），为 `false` 返回 JSON；`mcp_assistant` 的 `stream` 缺省或为 `true` 返回 SSE，为 `false` 返回 JSON；缺省不再等价于 `false`。"},{"id":"A3","source":"brief.md","text":"A3：`mcp_question` 流式请求 `return_img=false` 时不渲染图片、不发送 `imageUrl` 帧；非流式时响应不含 `image_url`；`return_img` 缺省/`true` 时仍按原逻辑出图。同一请求带可用的 `custom_model` 时，SQL 生成与图表生成使用该模型（模型名/端点与所选模型一致），不再因 `custom_model` 退回同步 JSON；模型 id 不存在/不可用时返回错误（流式错误帧或非流式 `success=false`），不静默使用默认模型。"},{"id":"A4","source":"brief.md","text":"A4：`mcp_assistant` 缺少 `url` 或 `authorization` 时返回 400 `{\"detail\":...}`。合法请求以合成用户（id=-1、account=`sqlbot-mcp-assistant`、oid=1，不写入 `sys_user`）创建会话（不创建 `first_chat` 空记录），按 `url`+`authorization` 拉取宿主数据源并创建一条真实 `chat_record`（`first_chat=false`），落一条 CHAT 创建审计（`sys_logs.user_id=-1`）与问数 `chat_log`；随后执行问数。`stream` 缺省/`true` 返回 SSE，`false` 返回 JSON（`finish_step=QUERY_DATA`，不生成图表/图片）；不再回退到本地 `assistant()` 多轮问答。"},{"id":"A5","source":"brief.md","text":"A5：会话已绑定数据源 D1 时，`mcp_question` 传入 `datasource_id=D2` 仍在 D1 上生成/执行 SQL，`chat.datasource` 与 `chat_record.datasource` 保持 D1；会话未绑定数据源时传入 D2 则在 D2 上执行并把 `chat.datasource` 写为 D2；未传且未绑定时沿用 RAG 选库并回写；流式与非流式行为一致。"},{"id":"A6","source":"brief.md","text":"A6：`mcp_start`（及 `chat_start` 工具）只创建 `chat`，不创建任何 `first_chat=TRUE` 的空 `chat_record`；`chat.brief` 在有 `question` 时为去空白后的前 20 个字符，无 `question` 时为当前时间 `yyyy-MM-dd HH:mm:ss`；传入 `datasource_id` 时仍按既有授权校验后写入 `chat.datasource`。Web `/chat/start` 的首条空记录行为不变。"},{"id":"A7","source":"brief.md","text":"A7：原生 `datasource_list` 与 `mcp_datasource_list` 返回的数据源数组元素均不含 `configuration`、`embedding`、`table_relation`、`recommended_config`；其余既有字段保留，并按名称升序。REST `/datasource/list` 不受影响。"},{"id":"A8","source":"brief.md","text":"A8：`mcp_question`、`mcp_start`、`mcp_ws_list`、`mcp_ds_list`、`mcp_model_list` 在 token 无效时返回 HTTP 403 `{\"detail\":...}`；非流式 `mcp_question` 的运行期错误（会话不存在、无数据源、模型不可用、SQL 执行失败、授权拒绝）返回 HTTP 500 `{\"success\":false,\"message\":...}`（如已创建记录则带 `record_id`）；其他工具错误保持 HTTP 400 `{\"detail\":...}`；`mcp_question` 的 `datasource_id`/`chat_id`/`custom_model` 格式非法时按 SQLBot 校验返回 400 `{\"detail\":...}`。"},{"id":"A9","source":"brief.md","text":"A9：`mcp_question` 在流式与非流式路径上，对最终使用的数据源（会话已绑定、显式 `datasource_id` 或 RAG 选中）调用 `DsGrantService.checkUsable`；被拒绝时不生成/执行 SQL，非流式返回 500 `{success:false,message}`，流式发送错误帧；管理员与已授权用户不受影响。"},{"id":"A10","source":"brief.md","text":"A10：`mcp_ws_list`（及原生 `workspace_list`）返回的数组元素只含 `id` 与 `name` 两个键，按 `name` 升序（翻译后的名称），不再包含 `create_time` 等字段；`mcp_ds_list` 继续按名称升序。"},{"id":"A11","source":"brief.md","text":"A11：`POST /api/v1/mcp/mcp_start` 成功响应只含 `access_token` 与 `chat_id` 两个键（有令牌时两者都有；无令牌的既有会话场景可缺省 `access_token`，但不得出现其他键），不再返回 `id`、`brief`、`datasource`、`engine_type` 等会话详情。 ## Source coverage 覆盖边界：用户在 2026-10-26 会话中给出的 SQLBot → java-product MCP 能力覆盖审计 H1–L3 清单（全部 12 项），以及为理解这些差距所必需的 SQLBot 参考实现（`/Users/xiongxiao/Workspaces/Idea/codes/New/SQLBot` 的 `apps/mcp/mcp.py`、`apps/chat/api/chat.py`、`apps/chat/task/llm.py`、`apps/chat/curd/chat.py`、`apps/system/crud/user.py`）。范围外能力不纳入本次覆盖。 | 来源条目与位置 | 读取状态 | 需要保留的内容 | Spec 位置 | 验收 ID | 覆盖状态 | 理由或替代关系 | | --- | --- | --- | --- | --- | --- | --- | | S1：审计 H1（非流式 mcp_question 响应/落库） | complete | 返回 `{success,sql,data:{fields,data},chart,record_id,image_url?}`；`chat_record.data` 落 `{fields,data,datasource,limit}` | `specs/askdata-sqlbot-mcp-gap-closure/spec.md` §1 | A1 | covered | 本次修复 | | S2：审计 H2（stream 缺省值） | complete | `stream` 缺省按 `true` 处理 | 同上 §2 | A2 | covered | 本次修复 | | S3：审计 H3（流式 return_img/custom_model） | complete | `return_img=false` 不出图；`custom_model` 在流式生效且不退回同步 | 同上 §3 | A3 | covered | 本次修复 | | S4：审计 M1（mcp_assistant） | complete | 必填 url/authorization；合成用户建会话/记录/审计；支持 stream | 同上 §4 | A4 | covered | 本次修复 | | S5：审计 M2（datasource_id 优先级） | complete | 仅会话未绑定数据源时生效 | 同上 §5 | A5 | covered | 本次修复 | | S6：审计 M3（mcp_start 空记录/brief） | complete | 不建 first_chat 空记录；brief 问题前 20 字符或时间戳 | 同上 §6 | A6 | covered | 本次修复 | | S7：审计 M4（原生 datasource_list 裁剪） | complete | 裁掉 configuration/embedding/table_relation/recommended_config | 同上 §7 | A7 | covered | 本次修复 | | S8：审计 M5（错误码） | complete | 无效 token 403；非流式问数 500 message；其他 400 detail | 同上 §8 | A8 | covered | 本次修复 | | S9：审计 M6（数据源授权） | complete | MCP 问数调用 `DsGrantService.