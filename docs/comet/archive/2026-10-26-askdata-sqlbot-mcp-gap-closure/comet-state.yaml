fig and sorts by name; both native datasource_list and mcp_datasource_list call it, while REST DatasourceController still calls DatasourceService.list directly; McpSqlbotCompatTest.datasourceListStripsInternalFieldsAndSortsByName asserts removals, retained fields and name order.","result":"passed"},{"id":"A8","reason":"AskdataMcpTools.bindTokenStrict throws ForbiddenException, mapped by ApiExceptionHandler.forbidden to 403 {\"detail\"} for mcp_question/mcp_start/mcp_ws_list/mcp_ds_list/mcp_model_list; non-stream mcp_question failures become {success:false,message,record_id?} and SqlbotMcpCompatController.respondQuestion maps them to 500; longOrNull/longArgOrNull map non-numeric IDs to 400 detail; tests cover invalid token 403, non-stream 500 message+record_id, invalid datasource_id 400 without execution, stream runtime error as SSE error+finish, assistant tool error 400 detail, and MCP-vs-Web detail/plain-text routing.","result":"passed"},{"id":"A9","reason":"ChatQuestionService.streamQuestion resolves the final datasource then calls DsGrantService.checkUsable(oid,uid,isAdmin,dsId) before checkConnection/schema/SQL generation; denial saves the record error, emits an error+finish frame in streaming, and makes ask return success=false with record_id for the 500 mapping; ChatPipelineTest.datasourceGrantDeniedStopsSqlInStreamAndNonStreamPaths asserts no sql/sql-data frames and success=false with record_id.","result":"passed"},{"id":"A10","reason":"WorkspaceService.listOptions emits only id and translated name and sorts by name; AskdataMcpTools.workspace_list uses listOptions and mcp_ws_list delegates to it, while mcp_datasource_list still returns sanitizeDatasourceList name-sorted; McpSqlbotGapClosureTest.workspaceOptionsOnlyIdAndNameSortedByLocalizedName asserts two-key maps and ordering (Default Workspace included) while REST list still has create_time, and McpSqlbotCompatTest covers datasource name sorting.","result":"passed"},{"id":"A11","reason":"AskdataMcpTools.mcpStartResponse builds a LinkedHashMap containing only access_token (when a token exists) and chat_id from chat_start's id, and mcp_start returns it after delegating; McpSqlbotCompatTest.mcpStartResponseContainsOnlyAccessTokenAndChatId and mcpStartResponseWithoutTokenOmitsAccessTokenKey assert two/one-key shapes with no brief/datasource/engine_type, and SqlbotMcpCompatControllerTest.mcpStartMapsSnakeCaseBodyAndKeepsTwoKeys checks the HTTP body mapping.","result":"passed"}],"attempt":1,"iteration":1,"risks":["A8 residual edge: non-scalar JSON values for datasource_id/chat_id/custom_model (object/array or non-empty container) are converted to an empty string by intStrArg/longOrNull and treated as absent rather than rejected with 400; non-numeric strings such as \"abc\" are correctly rejected and covered by tests.","A3's custom-model test uses anyMatch across request bodies, so the test alone does not isolate the chart request; code inspection confirms both SQL and chart calls receive the same custom ModelRef via ChatQuestionService.generateText/generateChart.","A1/A8/A11 HTTP controller tests mock AskdataMcpTools/ChatQuestionService; the end-to-end pipeline evidence is in ChatPipelineTest and McpAssistantFlowTest, not a single HTTP+DB integration test.","A9's denial test uses a mocked DsGrantService with an admin user; the production checkUsable implementation and its admin/grant semantics were inspected separately."],"summary":"Independent code and test verification found all A1-A11 acceptance behaviors implemented and exercised. I ran the targeted JDK 17 suite myself earlier: 57 tests, 0 failures, 0 errors. After the checks-input fingerprint drifted (caused by that test run changing generated target/ artifacts), I requested the original repeatable checks with refreshChecks:true; the Runtime re-ran both commands: targeted 57-test suite passed (exit 0, 44.8s) and full askdata-server suite passed (exit 0, 161.9s, 877 tests). No acceptance failure was found; only residual edge-case/test-isolation risks are noted.","verdict":"pass"}},"verifierExecutionRef":"opencode-verifier-62bdfa14-0481-4484-b160-59779b10f3e4"}},{"sequence":12,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-mcp-gap-closure"},"outputs":{"verify.report":{"candidateId":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","reportRef":"docs/comet/changes/askdata-sqlbot-mcp-gap-closure/verification.md","reportSha256":"aa0e06b8e824f68d2bebd1552b4775168bc97f9b6d6fcf29c874fb0edf715930","stateVersion":8}}}}},{"sequence":11,"value":{"candidateId":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","reportRef":"docs/comet/changes/askdata-sqlbot-mcp-gap-closure/verification.md","reportSha256":"aa0e06b8e824f68d2bebd1552b4775168bc97f9b6d6fcf29c874fb0edf715930","stateVersion":8}},{"sequence":13,"value":{"candidateId":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","reportRef":"docs/comet/changes/askdata-sqlbot-mcp-gap-closure/verification.md","reportSha256":"aa0e06b8e824f68d2bebd1552b4775168bc97f9b6d6fcf29c874fb0edf715930","stateVersion":8}},{"sequence":14,"value":{"archiveDirRef":"docs/comet/archive/2026-10-26-askdata-sqlbot-mcp-gap-closure","blockers":[],"candidateBinding":"8ec4eb4d3359c8365c8856fc50f8764989f1826efde908932e7f04ad758d6b22","candidateId":"acac55656f7ae54609ac4c365077dcbe32d611fb5b8dfeb49df38e2702148586","capabilityPeers":[],"ready":true,"reportRef":"docs/comet/changes/askdata-sqlbot-mcp-gap-closure/verification.md","reportSha256":"aa0e06b8e824f68d2bebd1552b4775168bc97f9b6d6fcf29c874fb0edf715930","reportStateVersion":8,"requiresReverification":false,"specPreview":[{"capability":"askdata-sqlbot-mcp-gap-closure","current_hash":null,"operation":"create","source":"specs/askdata-sqlbot-mcp-gap-closure/spec.md","target_hash":"466b62f9a4bb06584cec68bce667f1d8ff9f3cee01a75dbde9f63891ef94e93f"}],"stateVersion":9}},{"sequence":15,"value":{"archiveRef":"2026-10-26-askdata-sqlbot-mcp-gap-closure","specCount":1,"stateVersion":9,"transactionId":"f9b04714-bcbf-4173-b5f9-e8a13f027316"}},{"sequence":2,"value":{"choice":"rejected","proposal":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-mcp-gap-closure"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：非流式 `mcp_question`（`stream=false`，带或不带 `chat_id`）返回 SQLBot JSON：`success=true`、`record_id`、`sql`、`data` 对象（含 `fields` 数组与 `data` 数组；有数据源时含 `datasource`；发生 1000 行截断时含 `limit`）、`chart` 对象；`return_img` 未显式关闭且产出图片时含 `image_url`。该次查询在 `chat_record.data` 中落库的对象与响应 `data` 一致，不再是裸行数组；`data.fields` 与结果字段同名同序（覆盖 H1、L3）。"},{"id":"A2","source":"brief.md","text":"A2：`mcp_question` 带 `chat_id` 时，`stream` 字段缺省或为 `true` 返回 `text/event-stream`（SSE `data:{json}` 帧），为 `false` 返回 JSON；`mcp_assistant` 的 `stream` 缺省或为 `true` 返回 SSE，为 `false` 返回 JSON；缺省不再等价于 `false`。"},{"id":"A3","source":"brief.md","text":"A3：`mcp_question` 流式请求 `return_img=false` 时不渲染图片、不发送 `imageUrl` 帧；非流式时响应不含 `image_url`；`return_img` 缺省/`true` 时仍按原逻辑出图。同一请求带可用的 `custom_model` 时，SQL 生成与图表生成使用该模型（模型名/端点与所选模型一致），不再因 `custom_model` 退回同步 JSON；模型 id 不存在/不可用时返回错误（流式错误帧或非流式 `success=false`），不静默使用默认模型。"},{"id":"A4","source":"brief.md","text":"A4：`mcp_assistant` 缺少 `url` 或 `authorization` 时返回 400 `{\"detail\":...}`。合法请求以合成用户（id=-1、account=`sqlbot-mcp-assistant`、oid=1，不写入 `sys_user`）创建会话（不创建 `first_chat` 空记录），按 `url`+`authorization` 拉取宿主数据源并创建一条真实 `chat_record`（`first_chat=false`），落一条 CHAT 创建审计（`sys_logs.user_id=-1`）与问数 `chat_log`；随后执行问数。`stream` 缺省/`true` 返回 SSE，`false` 返回 JSON（`finish_step=QUERY_DATA`，不生成图表/图片）；不再回退到本地 `assistant()` 多轮问答。"},{"id":"A5","source":"brief.md","text":"A5：会话已绑定数据源 D1 时，`mcp_question` 传入 `datasource_id=D2` 仍在 D1 上生成/执行 SQL，`chat.datasource` 与 `chat_record.datasource` 保持 D1；会话未绑定数据源时传入 D2 则在 D2 上执行并把 `chat.datasource` 写为 D2；未传且未绑定时沿用 RAG 选库并回写；流式与非流式行为一致。"},{"id":"A6","source":"brief.md","text":"A6：`mcp_start`（及 `chat_start` 工具）只创建 `chat`，不创建任何 `first_chat=TRUE` 的空 `chat_record`；`chat.brief` 在有 `question` 时为去空白后的前 20 个字符，无 `question` 时为当前时间 `yyyy-MM-dd HH:mm:ss`；传入 `datasource_id` 时仍按既有授权校验后写入 `chat.datasource`。Web `/chat/start` 的首条空记录行为不变。"},{"id":"A7","source":"brief.md","text":"A7：原生 `datasource_list` 与 `mcp_datasource_list` 返回的数据源数组元素均不含 `configuration`、`embedding`、`table_relation`、`recommended_config`；其余既有字段保留，并按名称升序。REST `/datasource/list` 不受影响。"},{"id":"A8","source":"brief.md","text":"A8：`mcp_question`、`mcp_start`、`mcp_ws_list`、`mcp_ds_list`、`mcp_model_list` 在 token 无效时返回 HTTP 403 `{\"detail\":...}`；非流式 `mcp_question` 的运行期错误（会话不存在、无数据源、模型不可用、SQL 执行失败、授权拒绝）返回 HTTP 500 `{\"success\":false,\"message\":...}`（如已创建记录则带 `record_id`）；其他工具错误保持 HTTP 400 `{\"detail\":...}`；`mcp_question` 的 `datasource_id`/`chat_id`/`custom_model` 格式非法时按 SQLBot 校验返回 400 `{\"detail\":...}`。"},{"id":"A9","source":"brief.md","text":"A9：`mcp_question` 在流式与非流式路径上，对最终使用的数据源（会话已绑定、显式 `datasource_id` 或 RAG 选中）调用 `DsGrantService.checkUsable`；被拒绝时不生成/执行 SQL，非流式返回 500 `{success:false,message}`，流式发送错误帧；管理员与已授权用户不受影响。"},{"id":"A10","source":"brief.md","text":"A10：`mcp_ws_list`（及原生 `workspace_list`）返回的数组元素只含 `id` 与 `name` 两个键，按 `name` 升序（翻译后的名称），不再包含 `create_time` 等字段；`mcp_ds_list` 继续按名称升序。"},{"id":"A11","source":"brief.md","text":"A11：`POST /api/v1/mcp/mcp_start` 成功响应只含 `access_token` 与 `chat_id` 两个键（有令牌时两者都有；无令牌的既有会话场景可缺省 `access_token`，但不得出现其他键），不再返回 `id`、`brief`、`datasource`、`engine_type` 等会话详情。 ## Source coverage 覆盖边界：用户在 2026-10-26 会话中给出的 SQLBot → java-product MCP 能力覆盖审计 H1–L3 清单（全部 12 项），以及为理解这些差距所必需的 SQLBot 参考实现（`/Users/xiongxiao/Workspaces/Idea/codes/New/SQLBot` 的 `apps/mcp/mcp.py`、`apps/chat/api/chat.py`、`apps/chat/task/llm.py`、`apps/chat/curd/chat.py`、`apps/system/crud/user.py`）。范围外能力不纳入本次覆盖。 | 来源条目与位置 | 读取状态 | 需要保留的内容 | Spec 位置 | 验收 ID | 覆盖状态 | 理由或替代关系 | | --- | --- | --- | --- | --- | --- | --- | | S1：审计 H1（非流式 mcp_question 响应/落库） | complete | 返回 `{success,sql,data:{fields,data},chart,record_id,image_url?}`；`chat_record.data` 落 `{fields,data,datasource,limit}` | `specs/a