acceptance:
  - id: A1
    source: brief.md
    text: A1 中文表名可授权并查询：数据源中存在中文表名（如 `EXCEL_销售数据_xxx`）时，`POST /chat/question`
      不再返回「SQL 使用了未授权的表」，能正常产出 SQL 并返回表格数据（`sql`/`sql-data`/`finish` 帧）；ASCII
      表名行为不变。
    result: passed
    reason:
      text: 独立验证：ChatQuestionService.usedTables 正则已改为 [^\p{L}\p{N}_]；单测
        ChatQuestionServiceTest.extractsChineseTableName 对表名
        EXCEL_销售数据_319C13A236 断言提取结果为 excel_销售数据_319c13a236（大小写不敏感比对）。该提取正是 SQL
        使用了未授权的表 误判的根因，正则修复后中文表名可与授权名单匹配。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 不越权：不属于该数据源/未勾选的表名（含中文）仍被拒绝，且拒绝信息中的表名与实际表名一致，不出现字符被剥离的畸形名。
    result: passed
    reason:
      text: 独立验证：单测 dropsPunctuationAroundName
        确认表名外侧标点被剥离而表名本体（含中文）保留，拒绝信息中的表名与实际一致，未出现字符被剥离的畸形名；asciiTableNameUnchanged
        确认 ASCII 行为不变，未放宽授权。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 长文本可导入：Excel 单元格文本超过 1024 字符（如 1500 字符）时，`importToDb` 成功且
      `previewData`/`execSql` 能读出完整文本；元数据列类型显示为 VARCHAR(65535)。
    result: passed
    reason:
      text: 独立验证：ExcelService.STRING_COLUMN_LENGTH=65535；单测
        importToDbLongTextUsesVarchar65535 以 1500 字符中文文本走 importToDb（与 Excel
        导入同路径）建表并回读，断言列类型为 VARCHAR 家族且文本完整一致。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 失败不残留：构造导入失败场景（如超长文本之外的失败路径或强制失败）后，应用库中不残留该次已建的空表。
    result: passed
    reason:
      text: 独立验证：ExcelService.createAndInsert 插入失败分支回滚 DROP TABLE；单测
        importToDbRollsBackTableOnInsertFailure 子类化 JdbcTemplate 使 batchUpdate
        抛错，断言抛出 DatasourceException 且 INFORMATION_SCHEMA.TABLES 中无残留 EXCEL% 表。
      truncated: false
  - id: A5
    source: brief.md
    text: A5 回归：既有单测全通过（基线 78/78），Excel 与 H2 数据源的建表→查询→预览→执行链路仍可用。
