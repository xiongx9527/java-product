      通过（`fw-plus-ai-build` 须已 `mvn install` 至本地仓库或由 reactor 聚合）。
    result: passed
    reason:
      text: 独立验证：根 pom.xml 以 com.xiongx9527.fw.plus.ai:fw-plus-ai-build:0.1.1-SNAPSHOT
