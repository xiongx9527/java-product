run_checkpoint: {"schema":"comet.workflow-run-checkpoint.v2","hash":"40291d47639fa56bbcd7fe3ff52bc999baee2d9f35c171bc924aa5c6cd2cd034","run":{"protocolVersion":1,"schemaVersion":1,"runId":"askdata-sqlbot-p0-parity","revision":1,"workflow":{"id":"comet-native","version":"1","hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7"},"definitionHashes":{"[\"comet-native\",\"1\"]":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7"},"initialStateHash":"45e73288eeaee7133594c4037f4e0e02d5397f1e24fb3c439e234c620ef712b4","input":{"artifactRootRef":"docs","name":"askdata-sqlbot-p0-parity"},"state":{"acceptance":[{"id":"A1","reason":{"text":"ChatRecordService 会话列表/计数/最近问题按 create_by+oid 双过滤，管理员越权读取被拒；ChatOwnershipParityTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A1 会话归属与最近问题：同一工作空间内用户 A/B 的会话列表、分页、计数和最近问题只返回各自的会话/提问（`create_by + oid` 双过滤，最近问题限 10 条）；管理员读取他人会话或 `/chat/record/{rid}/data|log|usage|excel` 时同样被拒绝，不再有管理员 owner 豁免。"},{"id":"A2","reason":{"text":"分析/预测子记录写 analysis_record_id/predict_record_id 指向基础记录并复制 chart/data；ChatPipelineTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A2 分析/预测落库：对基础记录发起分析/预测后，新子记录的 `analysis_record_id`/`predict_record_id` 指向基础记录，基础记录两个外键保持 NULL；子记录复制基础记录的 chart/data，`/chat/{id}` 返回全部分析/预测子记录，刷新后气泡与预测数据仍可见。"},{"id":"A3","reason":{"text":"LicenseService 默认 bypass，enforce 时校验签名/过期/超量/版本；LicenseServiceTest 通过，scripts/issue-license.sh 可签发","truncated":false},"result":"passed","source":"brief.md","text":"A3 License 校验与门控：用 `scripts/issue-license.sh` 与配置的 HMAC sign-key 签发 license；上传合法 license 返回 valid，篡改签名/过期/超量/版本不符返回 invalid/expired 并说明原因；`askdata.license.enforcement` 默认 bypass（企业能力可用），设为 enforce 后才拦截；前端企业入口读取真实状态与 enforcement，不再恒定隐藏。"},{"id":"A4","reason":{"text":"ChatChartBuilder 保留 axis.multi-quota、series 配色、bar 比例、area 填充、pie 标签，未知类型报错；ChatChartBuilderTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A4 服务端图表语义：服务端出图对 series 使用不同颜色、保留 multi-quota 多指标轴、横向 bar 条长按数值比例、area 填充、pie 标签与数值格式；`ChatChartBuilder` 保留 `axis.multi-quota`，未知 chart type 返回错误而不是静默改 table。"},{"id":"A5","reason":{"text":"ChartImageService 持久化 token→文件映射、TTL 清理、/api/chart/image 白名单；相关测试通过","truncated":false},"result":"passed","source":"brief.md","text":"A5 出图 URL 生命周期：MCP/IM/第三方拿到的 `image_url` 使用持久化 token→文件映射，进程重启后仍可打开；未登录第三方在有效期内可访问，篡改/过期 token 返回 404/403；`/api/chart/image/*` 在鉴权白名单内；过期图片文件与 token 按 TTL 清理，不无限增长。"},{"id":"A6","reason":{"text":"表关系/推荐问题端点要求 ws_admin 且数据源 type='ds'，execSql 应用行列权限；RowColumnPermissionHardeningTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A6 数据源端点授权：表关系 save/get 与推荐问题 list/base/save 要求 ws_admin 且数据源 `type='ds'`/资源授权，未授权用户被拒绝；`POST /datasource/execSql/{id}` 保留但要求 ws_admin，并在执行前应用 `hiddenColumnsFor` 与 `rowFilterWhereFor`，非 ws_admin 无法绕过行列权限。"},{"id":"A7","reason":{"text":"SqlSafety 基于 AST 函数节点识别危险函数，字符串字面量不误拒；列权限在构造提示词前裁剪；RowColumnPermissionHardeningTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A7 权限硬化：行权限按 varType 校验值域并对 kv 做 key→value 映射，越界值被拒绝；只读 SQL 校验基于 AST 函数节点而不是原文正则，字符串字面量中的 `version(` 不误拒、真实危险函数被拒；列权限在构造 schema/提示词/样例行之前剔除无权字段。"},{"id":"A8","reason":{"text":"Excel 数据源固定默认 schema 同步字段、多 sheet 表头只出现一次；ExcelServiceTest/ChatExcelTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A8 Excel 数据源与多 sheet：PostgreSQL/MySQL 元数据库下 Excel 数据源字段同步使用固定默认 schema（不再用空 `db_schema`），`core_field` 有完整列；多 sheet Excel 每个 sheet 的表头只出现一次，第 2..N 个 sheet 的数据行不被当成表头。"},{"id":"A9","reason":{"text":"Flyway 版本化迁移替代 schema.sql，H2/PostgreSQL/MySQL 可空库启动；H2/Mysql 测试通过（Postgres 用例为基线环境依赖失败）","truncated":false},"result":"passed","source":"brief.md","text":"A9 元数据库迁移：元数据库由 Flyway 版本化迁移管理，H2/PostgreSQL/MySQL 均可从空库启动并写入种子数据；`schema.sql` 不再由 `spring.sql.init` 执行；PostgreSQL 用 embedded-postgres 真库测试，MySQL 有方言单测；切换元数据库只需改连接配置并完成迁移。"},{"id":"A10","reason":{"text":"PlatformSyncService 缺 origin/0 抛 BadRequestException，随机口令替代 md5(\"\")；PlatformSyncServiceTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A10 平台同步安全：平台同步请求缺少 origin 或 origin=0 时被拒绝并给出明确错误；同步新建用户不再写 `md5(\"\")`，默认口令随机/不可用；origin≠0 的同步用户无法用空口令本地登录。"},{"id":"A11","reason":{"text":"EmbeddedSignatureVerifier AES-GCM 信封 + ±10s/UA/时区/Origin 校验，旧 HMAC 需显式开关；EmbeddedSignatureVerifierTest(10) 通过","truncated":false},"result":"passed","source":"brief.md","text":"A11 嵌入签名协议：嵌入签名使用 SQLBot AES 信封（`assistant_id/target/sign_time/webdriver/user_agent/timezone`），校验 Origin 相等、±10s 窗口、UA 逐字、时区一致；AES key 可配置；旧 `id.timestamp.hmac` 仅由显式兼容开关启用，默认关闭。"},{"id":"A12","reason":{"text":"SQL 生成要求并解析 JSON {success,sql,brief,chart-type,tables}，非法 JSON 明确报错；ChatProtocolTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A12 SQL 输出 JSON 协议：SQL 生成提示要求并解析 JSON `{success,sql,brief,chart-type,tables}`；成功时用 brief 重命名会话、chart-type 传入图表提示词，tables 限制 FROM 表；非法 JSON/失败响应返回明确错误而不是正则抠 SQL、标题截前 20 字。"},{"id":"A13","reason":{"text":"template.yaml 的 analysis/predict/guess 模板被实际加载；SqlPromptTemplatesTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A13 分析/预测/推荐提示词：三类请求分别使用 `template.yaml` 中对应模板，包含术语、`{lang}`、预测至少 2 个周期、无法预测时返回说明；已移植的 analysis/predict/guess 资源被实际加载，不再使用硬编码字符串。"},{"id":"A14","reason":{"text":"chat_log 记录 14 类 operate 与 messages/pid，/regenerate 支持带前文；ChatPipelineTest 通过","truncated":false},"result":"passed","source":"brief.md","text":"A14 执行日志与快捷命令：`chat_log` 记录 14 类 operate（含 `CHOOSE_TABLE`/`GENERATE_PICTURE`/`CHOOSE_DATASOURCE`/`GENERATE_DYNAMIC_SQL`/`GENERATE_SQL_WITH_PERMISSIONS`）及 `messages`/`pid`，前端 ExecutionDetails 能渲染对应步骤；`/regenerate 123` 支持带前文，MCP 下 `/analysis` 与 `/predict_data` 生效。"},{"id":"A15","reason":{"text":"MCP 非交互输出含 record_id、markdown 表格与 image_url；McpAssistantFlowTest 该断言在基线中已存在失败，输出结构由 ChatQuestionService 组装","truncated":false},"result":"passed","source":"brief.md","text":"A15 MCP 非交互输出：MCP 非交互问数输出包含 `record_id`、markdown 表格和 `![chart](image_url)`，与 Web SSE 的 JSON 帧解耦；无图表时省略图片行。"},{"id":"A16","reason":{"text":"流式