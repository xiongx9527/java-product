PipelineTest,RowColumnPermissionHardeningTest","-DfailIfNoTests=false","test"],"cwdRef":".","executable":"/tmp/mvn17","id":"i18n-config-integration","name":"i18n-config 集成后回归测试","repeatable":true,"timeoutMs":900000}],"integrationCommit":"070afd0296e87f47588f23cbd0b5fb35c660e947","integrationWorktree":"/Users/xiongxiao/Workspaces/Idea/codes/New/java-product/.worktrees/askdata-sqlbot-p0-parity-integration","mergeActionId":"askdata-sqlbot-p0-parity:94","verificationChecks":[{"argv":["-Dmaven.test.skip=false","-Dtest=I18nA9Test,I18nMessageConvergenceTest,I18nBundleKeyParityTest,A27ConfigCompletenessTest,SqlSafetyTest,SqlSafetyParserTest","-DfailIfNoTests=false","test"],"cwdRef":".","executable":"/tmp/mvn17","id":"i18n-config-checks","name":"i18n 键集合与 A27 配置项聚焦测试","repeatable":true,"timeoutMs":900000}],"verifierActionId":"askdata-sqlbot-p0-parity:93","verifierSessionId":"sess-i18n-config-verifier","worktree":"/Users/xiongxiao/Workspaces/Idea/codes/New/java-product/.worktrees/askdata-sqlbot-p0-parity-i18n-config"},"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-p0-parity"},"outputs":{}},"inputHash":"1e337124e369545e0ddb58bdf927fdb26796e24db9833dc7e61d2858c2d7c29c","outcome":{"actionId":"askdata-sqlbot-p0-parity:95","attempt":1,"claimToken":"portable-4a295e088f832e6b4ce9d4607d68d5c5d2023bdd58e5a5c7364a03e1b0d9f60d","inputHash":"1e337124e369545e0ddb58bdf927fdb26796e24db9833dc7e61d2858c2d7c29c","outcomeId":"askdata-sqlbot-p0-parity:95:1:executor-result","output":{"candidateId":"070afd0296e87f47588f23cbd0b5fb35c660e947","candidateInputFingerprintGate":null,"checks":[{"argvDisplay":["-Dmaven.test.skip=false","-Dtest=I18nA9Test,I18nMessageConvergenceTest,I18nBundleKeyParityTest,A27ConfigCompletenessTest,SqlSafetyTest,SqlSafetyParserTest,ChatRagTest,ChatPipelineTest,RowColumnPermissionHardeningTest","-DfailIfNoTests=false","test"],"cwdRef":".","durationMs":52899,"exitCode":0,"id":"i18n-config-integration","logRef":"native/sdk-checks/e93fe598a1256780b92950ad4325a4f98a0ef