dbd8d4f197d37d88ef11581f6183b83ca93032","archiveRef":"2026-10-27-i18n-config","baseCommit":"070afd0296e87f47588f23cbd0b5fb35c660e947","candidateCommit":"7e6a6d6855d14ee1de623edc1fe7d4c8518cdddb","child":"i18n-config","integrationCommit":"c94ddd4930530cb90e61f420e872712fdfb1f5e9"},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"0512f21040b88d9041014a0d6e38ae9961b0ef113d63741495dbf010b2c78be6","outcomeId":"askdata-sqlbot-p0-parity:96:1:executor-result"}],"reconciliations":[],"ref":"native-supervisor-child-archive","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-p0-parity","status":"succeeded","stepId":"supervisor.child.archive","type":"call_tool"},{"attempt":1,"claim":{"executorId":"native-host","sessionId":"sess-parent-builder","token":"portable-5cb3c95574d006cdeeaf58e9a1db092de46d2e2c535771ad782eb1666bad1352"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-p0-parity:97","input":{"activation":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 会话归属与最近问题：同一工作空间内用户 A/B 的会话列表、分页、计数和最近问题只返回各自的会话/提问（`create_by + oid` 双过滤，最近问题限 10 条）；管理员读取他人会话或 `/chat/record/{rid}/data|log|usage|excel` 时同样被拒绝，不再有管理员 owner 豁免。"},{"id":"A2","source":"brief.md","text":"A2 分析/预测落库：对基础记录发起分析/预测后，新子记录的 `analysis_record_id`/`predict_record_id` 指向基础记录，基础记录两个外键保持 NULL；子记录复制基础记录的 chart/data，`/chat/{id}` 返回全部分析/预测子记录，刷新后气泡与预测数据仍可见。"},{"id":"A3","source":"brief.md","text":"A3 License 校验与门控：用 `scripts/issue-license.sh` 与配置的 HMAC sign-key 签发 license；上传合法 license 返回 valid，篡改签名/过期/超量/版本不符返回 invalid/expired 并说明原因；`askdata.license.enforcement` 默认 bypass（企业能力可用），设为 enforce 后才拦截；前端企业入口读取真实状态与 enforcement，不再恒定隐藏。"},{"id":"A4","source":"brief.md","text":"A4 服务端图表语义：服务端出图对 series 使用不同颜色、保留 multi-quota 多指标轴、横向 bar 条长按数值比例、area 填充、pie 标签与数值格式；`ChatChartBuilder` 保留 `axis.multi-quota`，未知 chart type 返回错误而不是静默改 table。"},{"id":"A5","source":"brief.md","text":"A5 出图 URL 生命周期：MCP/IM/第三方拿到的 `image_url` 使用持久化 token→文件映射，进程重启后仍可打开；未登录第三方在有效期内可访问，篡改/过期 token 返回 404/403；`/api/chart/image/*` 在鉴权白名单内；过期图片文件与 token 按 TTL 清理，不无限增长。"},{"id":"A6","source":"brief.md","text":"A6 数据源端点授权：表关系 save/get 与推荐问题 list/base/save 要求 ws_admin 且数据源 `type='ds'`/资源授权，未授权用户被拒绝；`POST /datasource/execSql/{id}` 保留但要求 ws_admin，并在执行前应用 `hiddenColumnsFor` 与 `rowFilterWhereFor`，非 ws_admin 无法绕过行列权限。"},{"id":"A7","source":"brief.md","text":"A7 权限硬化：行权限按 varType 校验值域并对 kv 做 key→value 映射，越界值被拒绝；只读 SQL 校验基于 AST 函数节点而不是原文正则，字符串字面量中的 `version(` 不误拒、真实危险函数被拒；列权限在构造 schema/提示词/样例行之前剔除无权字段。"},{"id":"A8","source":"brief.md","text":"A8 Excel 数据源与多 sheet：PostgreSQL/MySQL 元数据库下 Excel 数据源字段同步使用固定默认 schema（不再用空 `db_schema`），`core_field` 有完整列；多 sheet Excel 每个 sheet 的表头只出现一次，第 2..N 个 sheet 的数据行不被当成表头。"},{"id":"A9","source":"brief.md","text":"A9 元数据库迁移：元数据库由 Flyway 版本化迁移管理，H2/PostgreSQL/MySQL 均可从空库启动并写入种子数据；`schema.sql` 不再由 `spring.sql.init` 执行；PostgreSQL 用 embedded-postgres 真库测试，MySQL 有方言单测；切换元数据库只需改连接配置并完成迁移。"},{"id":"A10","source":"brief.md","text":"A10 平台同步安全：平台同步请求缺少 origin 或 origin=0 时被拒绝并给出明确错误；同步新建用户不再写 `md5(\"\")`，默认口令随机/不可用；origin≠0 的同步用户无法用空口令本地登录。"},{"id":"A11","source":"brief.md","text":"A11 嵌入签名协议：嵌入签名使用 SQLBot AES 信封（`assistant_id/target/sign_time/webdriver/user_agent/timezone`），校验 Origin 相等、±10s 窗口、UA 逐字、时区一致；AES key 可配置；旧 `id.timestamp.hmac` 仅由显式兼容开关启用，默认关闭。"},{"id":"A12","source":"brief.md","text":"A12 SQL 输出 JSON 协议：SQL 生成提示要求并解析 JSON `{success,sql,brief,chart-type,tables}`；成功时用 brief 重命名会话、chart-type 传入图表提示词，tables 限制 FROM 表；非法 JSON/失败响应返回明确错误而不是正则抠 SQL、标题截前 20 字。"},{"id":"A13","source":"brief.md","text":"A13 分析/预测/推荐提示词：三类请求分别使用 `template.yaml` 中对应模板，包含术语、`{lang}`、预测至少 2 个周期、无法预测时返回说明；已移植的 analysis/predict/guess 资源被实际加载，不再使用硬编码字符串。"},{"id":"A14","source":"brief.md","text":"A14 执行日志与快捷命令：`chat_log` 记录 14 类 operate（含 `CHOOSE_TABLE`/`GENERATE_PICTURE`/`CHOOSE_DATASOURCE`/`GENERATE_DYNAMIC_SQL`/`GENERATE_SQL_WITH_PERMISSIONS`）及 `messages`/`pid`，前端 ExecutionDetails 能渲染对应步骤；`/regenerate 123` 支持带前文，MCP 下 `/analysis` 与 `/predict_data` 生效。"},{"id":"A15","source":"brief.md","text":"A15 MCP 非交互输出：MCP 非交互问数输出包含 `record_id`、markdown 表格和 `![chart](image_url)`，与 Web SSE 的 JSON 帧解耦；无图表时省略图片行。"},{"id":"A16","source":"brief.md","text":"A16 流式韧性与问数细节：客户端断连后后端继续执行 SQL/图表/落库，只有真实执行错误才 `saveError`；空提问在调用 LLM 前被拒绝；token 统计以最后一次 usage 为准；修复轮提示包含术语/样例/历史；每问只调用一次推荐问题 LLM。"},{"id":"A17","source":"brief.md","text":"A17 嵌入助手与动态数据源：嵌入页按 token 中的 `assistant_id` 取助手；type=1 高级应用实时请求宿主 API 获取 `ds_list`，失败时不回退到“当前用户第一个 type=0 助手”；`X-SQLBOT-ASSISTANT-ONLINE` 运行时在线/离线通道生效；宿主下发数据源支持 AES 解密与 cookie/param 凭证位。"},{"id":"A18","source":"brief.md","text":"A18 数据源类型细节：Hive 支持 LDAP 认证参数；SQL Server `lowVersion` 配置影响 URL/驱动参数；ES 表/字段同步保留 `_meta.description` 注释；MySQL `allowPublicKeyRetrieval` 仅在配置开启时追加；Oracle 可按配置启用 thick 模式；连接池按配置 recycle；`MAX_TABLES=10`。"},{"id":"A19","source":"brief.md","text":"A19 Excel 导出与类型推断：Excel 导出数字列写为数值单元格而非文本，可求和；类型推断不再只采样 100 行且保留 float 语义；结果列名按大小写不敏感归一；上述行为有导出/导入回归测试。"},{"id":"A20","source":"brief.md","text":"A20 表级向量召回：表级向量召回在远程 embedding 不可用时回退到本地 embedding（与 EmbeddingService 相同的本地模型路径），仍不可用才退化为词法；命中远程时优先远程向量。"},{"id":"A21","source":"brief.md","text":"A21 仪表盘与工作空间：仪表盘列表/加载/保存/移动/删除按同工作空间可见即可操作，不再要求 `create_by=当前用户`；删除工作空间时用户 oid 重选或置 0，不再一律改成 1；术语/训练 `datasource_ids` 必须属于当前工作空间。"},{"id":"A22","source":"brief.md","text":"A22 审计日志三列：审计日志 `operation_type_name` 返回本地化标签而非 code，`operation_detail_info` 返回真实操作详情，`oid_name` 返回工作空间名称而非数字 id；前端审计列表三列正常显示。"},{"id":"A23","source":"brief.md","text":"A23 用户导入兼容：用户导入模板与解析使用本地化表头及“已启用/已禁用/本地创建”等枚举，兼容 SQLBot 模板；导入返回字段名与 SQLBot 一致，中文枚举值不再被判非法。"},{"id":"A24","source":"brief.md","text":"A24 会话与系统细节：访问 token 默认 8 天且可配置；SSO 登出联动 IdP；用户搜索保留相关性排序；内置系统变量可删除；助手图片校验类型与大小；模型连通性测试使用 protocol/Azure 等配置；isAdmin 按角色而非 `id==1 && account=='admin'`。"},{"id":"A25","source":"brief.md","text":"A25 SAML2 配置端点：补齐前端调用的 `/setting/authentication/info/saml`、`/setting/authentication/save/saml`、`/setting/authentication/validate/saml2` 三个端点，读写 SAML2 配置并校验证书/元数据，配置缺失时返回可读错误。"},{"id":"A26","source":"brief.md","text":"A26 i18n 五语种：`zh-CN`/`en`/`zh-TW`/`ko-KR`/`th-TH` 五个 locale 的键集合与使用点一致，四语种不再回退中文/英文；工作空间名等 Java 新增文案全部有对应翻译，缺失键有自动检查。"},{"id":"A27","source":"brief.md","text":"A27 配置项补齐：`application.yaml` 补齐向量召回阈值、`SAMPLE_DATA_ENABLED`、`ALLOW_METADATA_QUERIES`、token 有效期、图表图片 TTL/清理、许可证/嵌入签名开关等配置项，均有默认值与文档；未配置时行为与默认值一致。"}],"contractHash":"0fa101278005d5daed3fecf9085dd4588a03b7b86784926d64b9a4ce2b1b6003","integrationBranch":"comet/supervisor/askdata-sqlbot-p0-parity/integration","integrationCommit":"c94ddd4930530cb90e61f420e872712fdfb1f5e9","integrationWorktree":"/Users/xiongxiao/Workspaces/Idea/codes/New/java-product/.worktrees/askdata-sqlbot-p0-parity-integration"},"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-p0-parity"},"outputs":{}},"inputHash":"8d3a28ca67a81eb83101a628a60243a95d800f874813eb1007386cbc90485b7c","outcome":{"actionId":"askdata-sqlbot-p0-parity:97","attempt":1,"claimToken":"portable-5cb3c95574d006cdeeaf58e9a1db092de46d2e2c535771ad782eb1666bad1352","inputHash":"8d3a28ca67a81eb83101a628a60243a95d800f874813eb1007386cbc90485b7c","outcomeId":"askdata-sqlbot-p0-parity:97:1:parent-builder-result-232","output":{"acceptanceReview":[{"evidence":["askdata/askdata-server/src/main/java/com/xiongx9527/askdata/chat/service/ChatRecordService.java：会话列表/计数/最近问题按 create_by+oid 双过滤","ChatOwnershipParityTest 覆盖用户 A/B 隔离与管理員越权读取被拒"],"id":"A1","note":"子任务已归档并集成，独立 Verifier 已逐项复核通过","status":"implemented-with-evidence"},{"evidence":["chat/service：分析/预测子记录写 analysis_record_id/predict_record_id 指向基础记录并复制 chart/data","ChatOwnershipParityTest / ChatPipelineTest 覆盖子记录落库与 /chat/{id} 返回"],"id":"A2","note":"子任务已归档并集成，独立 Verifier 已逐项复核通过","status":"implemented-with-evidence"},{"evidence":["system/license/LicenseService.java：enforcement 默认 bypass，enforce 时校验签名/过期/超量/版本","LicenseServiceTest 覆盖合法/篡改/过期/超量/版本不符；scripts/issue-license.sh 可签发"],"id":"A3","note":"子任务已归档并集成，独立 Verifier 已逐项复核通过","status":"implemented-