n":1,"receipts":[{"hash":"457ee1ea68f1cadf937b7cc900840cf1690edffbf75e24fb31cb587ca1715be3","outcomeId":"askdata-sqlbot-p0-parity:101:1:verifier-result"}],"reconciliations":[],"ref":"native-verifier","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-p0-parity","status":"succeeded","stepId":"verify.verifier","type":"handoff"},{"attempt":1,"claim":{"executorId":"comet-native-report","token":"portable-f09fdbb23b7aa4439b8ba1dc0dd636f3ec6a291ffe01d72ca7c2d34cbe7ded1f"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-sqlbot-p0-parity:102","input":{"input":{"artifactRootRef":"docs","name":"askdata-sqlbot-p0-parity"},"outputs":{}},"inputHash":"d272e23ff0ba372d20fb3910d84ed5aa65b54300657bb2d767c6d9238bba65a2","outcome":{"actionId":"askdata-sqlbot-p0-parity:102","attempt":1,"claimToken":"portable-f09fdbb23b7aa4439b8ba1dc0dd636f3ec6a291ffe01d72ca7c2d34cbe7ded1f","inputHash":"d272e23ff0ba372d20fb3910d84ed5aa65b54300657bb2d767c6d9238bba65a2","outcomeId":"askdata-sqlbot-p0-parity:102:1:executor-result","output":{"candidateId":"b51da24c205aa90f76f259c62d35e067725fa2bc47fbc6a3a64c1f6c9cfa57b8","reportRef":"docs/comet/changes/askdata-sqlbot-p0-parity/verification.md","reportSha256":"6aa02630dbef1b35ceb02e3821f9e8d009a90510e1f403a5762412226b6ab5fc","stateVersion":8},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"778ed07072f4b014ac616f10e1f5fcd2c12e8eafdb07ff8588ceefa43b68ca9e","outcomeId":"askdata-sqlbot-p0-parity:102:1:executor-result"}],"reconciliations":[],"ref":"native-verification-report","requiredCapabilities":[],"retry":"manual","runId":"askdata-sqlbot-p0-parity","status":"succeeded","stepId":"verify.report","type":"call_tool"},{"attempt":1,"claim":{"executorId":"comet-native-report-revalidate","token":"portable-b37ca802db2c35c5d56e4b6bfbb9f603b2e8593766d5175fa8be13690bb3fa20"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fd