toconfigure 的 McpAutoConfiguration$RedisClusterConfiguration 以 @ConditionalOnBean(StringRedisTemplate) 为条件；无 Redis bean 即不激活，其 mcpRedisMessageListenerContainer 不会在启动期连接 Redis","全量回归中 681 个用例（含多个 @SpringBootTest 全上下文加载）均在本机无 Redis 的环境下启动通过"],"id":"A3","note":"已实测：仅引入 spring-boot-starter-data-redis 会导致应用启动失败（RedisConnectionException），改为按需装配后恢复正常。","status":"implemented-with-evidence"},{"evidence":["config/SaTokenStoreInitializer.java：sa-token-store=redis 时取 SaTokenDaoForRedisTemplate 并显式 SaManager.setSaTokenDao(dao)（Sa-Token 1.46 不会自动注册给 SaManager）","config/RedisClientConfig.java：创建 SaTokenDaoForRedisTemplate 并 init(RedisConnectionFactory)","缺省 memory：不改 SaManager，Sa-Token 惰性使用进程内 SaTokenDaoDefaultImpl"],"id":"A4","note":"sa-token-store 留空时跟随 askdata.cache.type。","status":"implemented-with-evidence"},{"evidence":["common/lock/WorkerLock.java：锁后端抽象（tryAcquire / release / name）","common/lock/DbWorkerLock.java：元数据库表行独占锁（原 SingleWorkerGuard 逻辑平移，行为不变）","common/lock/RedisWorkerLock.java：SET NX PX + 持有者 token 校验释放（Lua）","common/lock/WorkerLockConfig.java：按 askdata.lock.type 选择（db 缺省 / redis），@ConditionalOnProperty 互斥装配","common/lock/SingleWorkerGuard.java：委托 WorkerLock，锁不可用退化为进程内守卫","防抖：askdata.lock.debounce-seconds（默认 300）；DB 侧复用 acquired_at（与持锁同事务刷新、释放提交后生效），Redis 侧用 done 标记","src/test/.../common/lock/SingleWorkerGuardLockTest.java：防抖窗口内跳过、窗口关闭后可再获取、锁不可用退化为进程内守卫"],"id":"A5","note":"db 锁作用域与被保护数据一致（共享同一元库时集群内一次；各实例独立库时各跑各的），redis 锁为全局。","status":"implemented-with-evidence"},{"evidence":["common/debounce/DebounceProperties.java：enabled（默认关闭）/ window-ms / paths（Ant 风格匹配）","common/debounce/RequestDebouncer.java：用 Spring Cache 的 putIfAbsent 原子占位（内存与 Redis 后端都原子且沿用该缓存 TTL），缓存异常时放行","common/web/RequestDebounceFilter.java：@Order(HIGHEST_PRECEDENCE + 20) 排在鉴权之后；调用方按鉴权头摘要识别（无则来源 IP，摘要不落原文）；窗口内重复请求返回 429 + Retry-After","resources/messages*.properties（6 语种）：i18n_debounce.too_frequent 走消息包，不硬编码","src/test/.../common/debounce/RequestDebouncerTest.java：默认放行 / 同 key 窗口内拦截 / 缓存异常放行 / 路径匹配