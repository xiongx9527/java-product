      text: config/CacheConfig.java:54-84 三分支（redis→RedisCacheManager /
        none→NoOpCacheManager /
        缺省→CaffeineCacheManager）；common/cache/HotCacheService.java 四类热点
        @Cacheable（用户/账号/API
        Key/助手）；鉴权热路径改走缓存：common/web/ApiKeyTokenAuthenticator.java（apiKeyByAccessKey/userById）与
        EmbeddedTokenAuthenticator.java（assistantById/userByAccount/userById）；ConfigurableRuntimeOptionsTest
        4/0/0
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 用户改密 / 停用 / 删除 / 切工作空间、API Key 停用或删除、助手配置或密钥变更后，对应缓存立即失效（失效挂在
      Repository 写方法上），不会出现「已停用仍可鉴权」。"
    result: passed
    reason:
      text: 失效全部挂在 Repository
        写方法：system/repository/UserRepository.java（updatePassword/updateStatus/deleteById/updateOid/updateProfile/updateLanguage
        等共 7 方法 × @Caching 双 evict）、ApiKeyRepository.java:48,54,59（停用/删除
        allEntries=true）、embedded/AssistantRepository.java:96,109,117,122,127,132；全仓无绕过
        Repository 的 sys_user/sys_apikey/sys_assistant 直写 SQL
