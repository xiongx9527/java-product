ocs","name":"askdata-audit-remaining-gaps"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 行权限经 MCP 生效：为某用户配置表级行权限后，经 MCP question_answer 问数返回行集与 Chat 主链路一致（过滤生效）；未配置行权限的数据源行为不变；表白名单校验保留。"},{"id":"A2","source":"brief.md","text":"A2 列权限经 MCP 生效：被列权限隐藏的列不出现在 MCP 问数的执行 SQL 引用与返回结果中。"},{"id":"A3","source":"brief.md","text":"A3 动态子查询占位符替换：宿主下发含表级 dynamic_sql 的动态数据源（含 resolveFromHost 实时拉取形态）时，一阶段 SQL 引用占位符表，执行前被确定性替换为宿主子查询；替换失败时按错误处理（回喂修复或失败帧），不执行含未替换占位符的 SQL。"},{"id":"A4","source":"brief.md","text":"A4 动态路径权限边界：动态数据源问数仍执行表白名单校验；无数据源身份时跳过行/列权限（对齐 SQLBot，记录为既定行为）。"},{"id":"A5","source":"brief.md","text":"A5 模型请求体结构：config 含 extra_body 或 enable_thinking 时，请求体出现嵌套 extra_body 且无顶层平铺键；Azure 端点请求体不含 api_version 与 deployment_name，URL 仍含二者；temperature 等其他参数整包透传保持。"},{"id":"A6","source":"brief.md","text":"A6 导出物 i18n：自定义提示词/术语/SQL 示例的导出与模板列头按当前 locale 渲染（不再固定中文）。"},{"id":"A7","source":"brief.md","text":"A7 错误文案 i18n：ChatService、ChatQuestionService、SettingsFileController、TableRelationService、ExternalIdpController、ParameterService 中的硬编码英文错误文案全部改走 messageResolver，键在 6 个 messages*.properties 齐备。"},{"id":"A8","source":"brief.md","text":"A8 workspace_list 非管理员：非管理员登录用户经 MCP workspace_list 获得自己所属工作空间列表；管理员仍列全部。"},{"id":"A9","source":"brief.md","text":"A9 历史轮数默认 3：chat.context_record_count 未配置/种子缺省时 priorContext 默认取 3。"},{"id":"A10","source":"brief.md","text":"A10 全量回归：mvn -o -pl askdata/askdata-server clean test（zulu-17，-Dmaven.test.skip=false）全部通过，现有 626 用例无回归。"}],"children":null,"formalHash":"ab7ee1ef54ddfcc9af996cb3e6806f253fc3fd78b3dde0c8c52db2e111037a1a","shapeConfirmationHash":"068b43109c2c9ff3e5ba27bf46c682d8b90a68e41f0fa92bff3f3654d3e34ae4","specChanges":[{"capability":"parity-hardening","operation":"create","source":"specs/parity-hardening/spec.md"}]}}}},{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 行权限经 MCP 生效：为某用户配置表级行权限后，经 MCP question_answer 问数返回行集与 Chat 主链路一致（过滤生效）；未配置行权限的数据源行为不变；表白名单校验保留。"},{"id":"A2","source":"brief.md","tex