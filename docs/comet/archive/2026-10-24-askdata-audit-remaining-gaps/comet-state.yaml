ateTables 表白名单 → 执行）；宿主子查询文本原样使用，不做重写 - 验收：A3"},{"id":"A17","source":"specs/parity-hardening/spec.md","text":"替换失败不执行 - **WHEN** 生成的 SQL 含占位符但宿主未下发对应表级 SQL，或替换过程失败 - **THEN** 不执行含未替换占位符的 SQL：进入错误回喂修复轮（regenerateSql）或返回失败帧 - 验收：A3"},{"id":"A18","source":"specs/parity-hardening/spec.md","text":"宿主 URL 实时拉取路径一致 - **WHEN** 动态数据源经 resolveFromHost 实时 GET 宿主 API 获得，响应含 dynamic_sql - **THEN** 走同一解析 → 占位符注入 → 替换闭环 - 验收：A3"},{"id":"A19","source":"specs/parity-hardening/spec.md","text":"extra_body 嵌套归并 - **WHEN** 模型 config（config_list）中存在 key=extra_body 的对象，或单独出现 enable_thinking 键 - **THEN** 请求体中 extra_body 为嵌套对象（enable_thinking 归入其内），payload 顶层不出现 extra_body / enable_thinking 平铺键 - 验收：A5"},{"id":"A20","source":"specs/parity-hardening/spec.md","text":"Azure 参数剔除 - **WHEN** 端点为 Azure（域名匹配 *.openai.azure.com/.cn） - **THEN** api_version、deployment_name 仅用于构造请求 URL（deployment 路径段与 api-version 查询参数），请求 JSON body 不含这两个键 - 验收：A5"},{"id":"A21","source":"specs/parity-hardening/spec.md","text":"其他参数整包透传保持 - **WHEN** config 含 temperature 等其他参数 - **THEN** 维持现状：整包平铺进 payload 顶层（跳过 null），temperature 正常下发 - 验收：A5"},{"id":"A22","source":"specs/parity-hardening/spec.md","text":"导出与模板列头走 i18n - **WHEN** 导出或下载模板：自定义提示词、术语、SQL 示例三类 - **THEN** Excel 列头与模板示例文案按当前 locale 从 messageResolver 渲染，键在 6 个 messages*.properties 齐备 - 验收：A6"},{"id":"A23","source":"specs/parity-hardening/spec.md","text":"后端错误文案 i18n 全覆盖 - **WHEN** ChatService、ChatQuestionService、SettingsFileController、TableRelationService、ExternalIdpController、ParameterService 抛出面向用户的错误 - **THEN** 文案来自 messageResolver（新键 + 6 语言文件），代码中不再残留该范围内的硬编码英文文案 - 验收：A7"},{"id":"A24","source":"specs/parity-hardening/spec.md","text":"workspace_list 非管理员语义 - **WHEN** 非管理员登录用户调用 workspace_list（MCP 或 API） - **THEN** 返回其所属工作空间列表（不要求管理员）；管理员调用返回全部；身份校验与归属过滤沿用现有机制 - 验收：A8"},{"id":"A25","source":"specs/parity-hardening/spec.md","text":"历史轮数默认 3 - **WHEN** chat.context_record_count 未显式配置（使用种子缺省） - **THEN** priorContext 默认注入最近 3 条历史（对齐 SQLBot GENERATE_SQL_QUERY_HISTORY_ROUND_COUNT=3）；显式配置值优先 - 验收：A9"},{"id":"A26","source":"specs/parity-hardening/spec.md","text":"既有行为不回归 - **WHEN** 全量测试执行（mvn -o -pl askdata/askdata-server clean test，JDK 17，-Dmaven.test.skip=false） - **THEN** 全部通过，现有 626 用例无回归；新增测试（MCP 权限、占位符替换、payload 构造）覆盖上述场景 - 验收：A10"}],"children":null,"formalHash":"0050dbcbb39101d4020a8493ead031d0c3b8eeb719bccd60047a8b651f7d0134","shapeConfirmationHash":"032108bb19680139ad7a0039a849ad952c8401a4a1360d68f2ae7acb441e877f","specChanges":[{"capability":"parity-hardening","operation":"create","source":"specs/parity-hardening/spec.md"}]},"status":"succeeded"},"protocolVersion":1,"receipts":[{"hash":"13f79a0aea476c1ab58ee762d375f6fd8c5fd219600fbadd499f4d8c2cc4bdcd","outcomeId":"1fca9919-edcc-405e-b79c-aba3af97a060"}],"reconciliations":[],"ref":"native-shape-prepare","requiredCapabilities":[],"retry":"manual","runId":"askdata-audit-remaining-gaps","status":"succeeded","stepId":"shape.prepare","type":"call_tool"},{"attempt":1,"claim":{"executorId":"comet-native-cli","token":"portable-44f19af48b317a898eaf6cd3df2bc9e579a11158c0e38af998e5a31add45c2df"},"executionOrigin":{"workflow":{"hash":"fb7d10f66cb304d7b7470fdba5aef47f9dba222d8bea539632e2bba50e0743a7","id":"comet-native","version":"1"}},"id":"askdata-audit-remaining-gaps:3","input":{"input":{"artifactRootRef":"docs","name":"askdata-audit-remaining-gaps"},"outputs":{}},"inputHash":"5ea558d5c6491b1b0838d2fb1293a800db474c6cdb214e9377a109a6de80e8ee","outcome":{"actionId":"askdata-audit-remaining-gaps:3","attempt":1,"claimToken":"portable-44f19af48b317a898eaf6cd3df2bc9e579a11158c0e38af998e5a31add45c2df","inputHash":"5ea558d5c6491b1b0838d2fb1293a800db474c6cdb214e9377a109a6de80e8ee","outcomeId":"645b56e3-14ba-4d9d-98ad-d065f797cadf","output":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1 行权限经 MCP 生效：为某用户配置表级行权限后，经 MCP question_answer 问数返回行集与 Chat 主链路一致（过滤生效）；未配置行权限的数据源行为不变；表白名单校验保留。"},{"id":"A2","source":"brief.md","text":"A2 列权限经 MCP 生效：被列权限隐藏的列不出现在 MCP 问数的执行 SQL 引用与返回结果中。"},{"i