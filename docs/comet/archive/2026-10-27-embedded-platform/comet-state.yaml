acceptance:
  - id: A10
    source: brief.md
    text: A10 平台同步安全：平台同步请求缺少 origin 或 origin=0 时被拒绝并给出明确错误；同步新建用户不再写
      `md5("")`，默认口令随机/不可用；origin≠0 的同步用户无法用空口令本地登录。
    result: passed
    reason:
      text: PlatformSyncService 对缺失/空白/0 origin 抛 BadRequestException 且不落库；新建用户写入随机
        UUID 口令哈希（测试断言非 md5("")）；LoginController 对 origin!=0 用户拒绝空口令登录。
      truncated: false
  - id: A11
    source: brief.md
    text: A11 嵌入签名协议：嵌入签名使用 SQLBot AES
      信封（`assistant_id/target/sign_time/webdriver/user_agent/timezone`），校验
      Origin 相等、±10s 窗口、UA 逐字、时区一致；AES key 可配置；旧 `id.timestamp.hmac`
      仅由显式兼容开关启用，默认关闭。
    result: passed
    reason:
      text: EmbeddedSignatureVerifier 校验 AES 信封 target==origin、±10s、UA/时区逐字、webdriver
        拒绝；askdata.embedded.aes-key 可配置，未配置时报可读错误；legacy-hmac-enabled 默认 false，旧
        id.timestamp.hmac 仅显式开启时生效。
      truncated: false
  - id: A17
    source: brief.md
    text: A17 嵌入助手与动态数据源：嵌入页按 token 中的 `assistant_id` 取助手；type=1 高级应用实时请求宿主 API 获取
      `ds_list`，失败时不回退到“当前用户第一个 type=0 助手”；`X-SQLBOT-ASSISTANT-ONLINE`
      运行时在线/离线通道生效；宿主下发数据源支持 AES 解密与 cookie/param 凭证位。
    result: passed
    reason:
      text: datasources 优先使用 AuthContext 中 token 的 assistant_id；type=1 在线实时拉取宿主
        ds_list，宿主失败直接报错不回退；X-SQLBOT-ASSISTANT-ONLINE 覆盖 online 通道；宿主
        certificate 支持 header/cookie/param，加密凭证与密码用 AES 解密。
      truncated: false
