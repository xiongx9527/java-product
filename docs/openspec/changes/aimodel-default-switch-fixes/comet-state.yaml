                      且无活线程→标 interrupted 并令 pending=true；Redis 旧锁 owner
                      主动释放)。新增 V7 迁移：ai_embedding_index_state 增加
                      failed_scopes/stop_requested/mode 列，status 值域加
                      interrupted。重建期间锁定：isRebuildActive() 时前端禁用、后端
                      setDefault(向量)/update(默认向量) 返回 4xx 拒绝。取舍：停止用持久化
                      stop_requested 而非纯内存，保证重启后状态一致；resume 仅在维度未变时允许，维度变强制
                      full；崩溃恢复标 interrupted 而非 failed
                      以保留断点。风险：维度变化全量重建耗时较长；Redis 锁 TTL 须小于单次重建耗时；pending 须把
                      interrupted 视同 failed，否则问答静默返回缺数据。Spec Patch 即本 change 的
                      ai-model-configuration / ai-model-connectivity delta
                      specs（已 validate 通过）。
