                handoffHash: b72fb94b856b46c798aabddc39ceeb0e6904f0ec00717a82d6c32f15f1e29f4e
                proposal: 默认模型切换健壮性修复 + 向量重建可控性增强。技术方案：D1 update 入口补 clearDefaults 保证默认唯一；D2 复用
                  EmbeddingService.storeDimensionConflict，setDefault/update(向量默认)
                  维度冲突时硬拦截；D3
                  仅当连线字段(api_domain/api_key/base_model/protocol/supplier/upstream_format)变化才重探；D4
                  probeModel 比对返回向量长度与 dimension；D5 向量重建可控性：进度(status 已含
                  done/failed/total/current_scope)、停止(stop_requested
                  列+内存标志，循环每空间前检查置 interrupted)、重新开始(full 清集合/resume 从
                  current_scope 断点续做)、仅重试失败(解析 failed_scopes
                  只重算失败空间)、崩溃恢复(ApplicationRunner 启动自检 state.status=running
                  且无活线程→标 interrupted 并令 pending=true；Redis 旧锁 owner 主动释放)。新增 V7
                  迁移：ai_embedding_index_state 增加
                  failed_scopes/stop_requested/mode 列，status 值域加
                  interrupted。重建期间锁定：isRebuildActive() 时前端禁用、后端
                  setDefault(向量)/update(默认向量) 返回 4xx 拒绝。取舍：停止用持久化 stop_requested
                  而非纯内存，保证重启后状态一致；resume 仅在维度未变时允许，维度变强制 full；崩溃恢复标 interrupted
                  而非 failed 以保留断点。风险：维度变化全量重建耗时较长；Redis 锁 TTL 须小于单次重建耗时；pending
                  须把 interrupted 视同 failed，否则问答静默返回缺数据。Spec Patch 即本 change 的
                  ai-model-configuration / ai-model-connectivity delta specs（已
                  validate 通过）。
                requirementsEvidence:
                  contentHash: dd3059bd1d4f2567464f3067640d69b3fb47f073c53561ca0e5c1ddf199386cb
