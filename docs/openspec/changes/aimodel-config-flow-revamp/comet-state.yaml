          output:
            handoffContext: docs/openspec/changes/aimodel-config-flow-revamp/.comet/handoff/design-context.json
            handoffHash: bad4986e8d15b6566d115fe4d29212cbaad0b9707b47f8cedc03cfd14ddc9f8b
            proposal: 技术方案：沿用 change 内 design.md 作为唯一 Design Doc，覆盖 15 项决策与端到端验证。\n1)
              数据层：ai_model 新增 enable / valid / upstream_format / dimension 四列，新增
              ai_embedding_index_state 单行状态表；三套方言迁移脚本，存量回填
              enable=1、valid=1、upstream_format=1，并把 H2 向量列改为 CLOB、MySQL 改
              MEDIUMTEXT，消除维度上限。\n2) 仓储与路由：AiModelRepository
              只保留带类型参数的查询（findDefault/clearDefaults/countByType/listByWorkspace），编译期强制调用方声明类型；ChatModelRouter
              仅暴露 chatModel()/embeddingModel()，按 model_type+enable+valid
              过滤，无默认时回退该类型首个可用模型。\n3) 报文格式：新增 UpstreamFormatResolver 统一判定与 URL
              规范化（自动识别 Azure/Anthropic，Responses 手选）；ChatModelClient.generate()
              增加格式参数，按 Chat Completions / Anthropic Messages / Responses / Azure
              四分支构造请求与解析流式事件，Chat Completions 现有路径不改结构。\n4) 接口：连通校验按类型分支（LLM 对话
              / 向量 embeddings）并回写 valid；新增 POST /system/aimodel/models 代理上游
              /models（失败降级 preset/none）；新增 embedding status 与 rebuild
              两个管理接口，重建全空间、强制重算、复用单 worker 守卫。\n5) 向量：移除本地
              ONNX（LocalEmbeddingModel、BertWordPieceTokenizer、onnxruntime
              依赖、model-path
              配置），无可用在线向量模型时网页会话/MCP/定时任务统一阻断；维度作为一等属性，启用、设默认、问答入口三处硬校验。\n6)
              前端：ModelForm 持有拉取与测试状态机（请求序号丢弃过期响应），字段顺序改为 模型名称→Base URL→API
              Key→模型类型→基础模型→是否生效→高级配置；模型类型新建可选、编辑只读；默认模型按类型唯一且不可停用/删除；模型页常驻「向量索引待重建」提示与一键重建。\n7)
              对等基线：以 SQLBot 为硬性基线，reference-parity.md 登记 B1–B14 / R1–R6 / F1–F13
              共 33 条与 7 项有意偏离（D1–D7）。\n\n关键取舍：新增独立列而非复用
              protocol/config；类型维度在仓储层收口而非各调用点过滤；格式判定收敛为单一解析器；报文适配放在
              ChatModelClient 内部；重建必须全空间且强制重算。\n\n风险：default_model
              语义变更影响面大（迁移不回算，走回退逻辑）；新列回填错误会导致全站无模型（DEFAULT 1 +
              断言可用模型数不减少）；ChatModelClient
              触及问数主链路（只加分支，回归问数/图表/权限/定时任务）；Anthropic 与 Responses 无真实网关（stub
              单测并写入交付说明）；维度变化导致召回异常（切换前确认 + 重建幂等）。\n\nSpec
              Patch：无。本阶段只做文档一致性修正——reference-parity.md 第 4 节实际为 7
              项偏离（D1–D7），proposal/design/spec/tasks 的「6 项（D1–D6）」统一更正为 7
              项（D1–D7），不改变任何行为或验收范围。\n验证策略：后端单测 + 进程内 stub provider；前端复用
              askdata-server/e2e，Playwright 覆盖 10
              类用例（含字段顺序、拉取降级、校验失败可保存、向量端点分支、格式切换、默认模型保护、五语言）。
            requirementsEvidence:
              contentHash: df66f44213af4fd76fe46803fbfbff36feca8a044d37a8ab0fb3de26ac811f77
              ref: docs/openspec/changes/aimodel-config-flow-revamp
            sourceEvidence:
              contentHash: 62ddf39badff58584f74181d6cd6d3217f5523f1bd78b9933f6b1681698e8ec2
              ref: docs/openspec/changes/aimodel-config-flow-revamp
